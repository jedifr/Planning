// Repère les pièces "à faire", non figées individuellement, sur un poste marqué fusionnable,
// partageant la même combinaison Matière + Épaisseur — sans jamais décider seule de fusionner :
// c'est juste une proposition, la décision et le nombre de pièces retenues restent à vous.
function detectFusionOpportunities(){
  if(!state.config.matiereFusionActive) return []; // détection par matière/épaisseur désactivée dans les réglages généraux
  const groups = {};
  state.commandes.forEach(c => {
    c.pieces.forEach(o => {
      if(o.statut !== 'a_faire') return;
      if(o.manualStart) return; // déjà figée individuellement : exclue de la détection
      if(o.fusionGroupId) return; // déjà fusionnée
      const m = state.machines.find(mm=>mm.id===o.machineId);
      if(!m || !m.fusionnable) return;
      const matiere = (o.matiere||'').trim();
      const epaisseur = (o.epaisseur||'').trim();
      if(!matiere || !epaisseur) return; // pas assez d'information pour proposer un regroupement
      const key = `${o.machineId}|${matiere.toLowerCase()}|${epaisseur.toLowerCase()}`;
      if(!groups[key]) groups[key] = { key, machineId: o.machineId, matiere, epaisseur, items: [] };
      const dureeH = (o.dureeOverrideH!=null && o.dureeOverrideH>0) ? o.dureeOverrideH : (o.tempsUnitaire*o.quantite)/60;
      groups[key].items.push({ cid: c.id, cnom: c.nom, oid: o.id, piece: o.piece, etape: o.etape, dureeH });
    });
  });
  return Object.values(groups).filter(g => g.items.length >= 2);
}
// Fusionne réellement les pièces données (au moins 2) : elles reçoivent toutes le même départ figé
// et la même durée (la somme de leurs durées individuelles) — elles se retrouvent donc terminées
// exactement en même temps, tout en restant chacune rattachée à sa propre commande d'origine.
// skipCommit : pour les appelants qui gèrent eux-mêmes l'enregistrement (création de commande,
// libération d'un groupe). Sans ça, deux sauvegardes s'enchaînent et la seconde part avec une
// version périmée — d'où le message "quelqu'un d'autre a modifié le planning" à tort.
function performFusion(items, skipCommit){
  if(items.length < 2) return;
  const groupId = uid('fusion');
  const totalDuree = items.reduce((s,it)=>s+it.dureeH, 0);
  const schedule = computeSchedule(state);
  let commonStart = null;
  items.forEach(it => {
    const c = schedule.find(cc=>cc.id===it.cid);
    const p = c && c.pieces.find(pp=>pp.id===it.oid);
    if(p && p.start && (!commonStart || p.start > commonStart)) commonStart = p.start;
  });
  if(!commonStart){
    // Même sécurité que performFusionOnState : sans horaire calculé, on ne fige jamais "maintenant"
    // (ce qui placerait le groupe avant les tâches dont il dépend), mais sur un plancher sûr.
    const floors = [];
    items.forEach(it => {
      const c = state.commandes.find(cc=>cc.id===it.cid);
      const o = c && c.pieces.find(pp=>pp.id===it.oid);
      if(!o) return;
      const m = state.machines.find(mm=>mm.id===o.machineId);
      if(m && m.dispo) floors.push(new Date(m.dispo));
      const cmdSched = schedule.find(cc=>cc.id===it.cid);
      if(cmdSched){
        cmdSched.pieces.forEach(pp => {
          if((pp.phase||1) < (o.phase||1) && pp.end) floors.push(pp.end);
        });
      }
    });
    floors.push(new Date());
    // Arrondi à la minute SUPÉRIEURE : le figeage ne conserve pas les secondes, donc tronquer
    // ferait repasser le groupe quelques secondes avant son plancher.
    commonStart = new Date(Math.ceil(Math.max(...floors.map(d=>d.getTime())) / 60000) * 60000);
  }
  items.forEach(it => {
    const c = state.commandes.find(cc=>cc.id===it.cid);
    const o = c && c.pieces.find(pp=>pp.id===it.oid);
    if(!o) return;
    o.fusionGroupId = groupId;
    o.manualStart = toInputValue(commonStart);
    o.dureeOverrideH = totalDuree;
  });
  if(!skipCommit){
    commit();
    showToast(`${items.length} pièces fusionnées en un seul passage.`);
  }
}
function toggleFusionItem(key, oid, checked){
  if(!fusionCheckedItems[key]) fusionCheckedItems[key] = new Set();
  if(checked) fusionCheckedItems[key].add(oid); else fusionCheckedItems[key].delete(oid);
  render();
}
function fuseSelected(key){
  const g = detectFusionOpportunities().find(gg => gg.key === key);
  if(!g) return;
  const checked = fusionCheckedItems[key] || new Set();
  const items = g.items.filter(it => checked.has(it.oid));
  if(items.length < 2){ alert('Sélectionnez au moins 2 pièces à fusionner.'); return; }
  performFusion(items);
  delete fusionCheckedItems[key];
}
function fuseAll(key){
  const g = detectFusionOpportunities().find(gg => gg.key === key);
  if(!g) return;
  performFusion(g.items);
  delete fusionCheckedItems[key];
}

// includeDone : le panneau de synthèse masque les groupes entièrement terminés (ils s'accumuleraient
// au fil des mois), mais la pop-up de détail doit pouvoir les retrouver si on en ouvre un.
function getActiveFusionGroups(includeDone){
  const groups = {};
  state.commandes.forEach(c => {
    c.pieces.forEach(o => {
      if(!o.fusionGroupId) return;
      if(!groups[o.fusionGroupId]) groups[o.fusionGroupId] = { id: o.fusionGroupId, items: [] };
      groups[o.fusionGroupId].items.push({
        cid: c.id, cnom: c.nom, oid: o.id, piece: o.piece, etape: o.etape, statut: o.statut,
        matiere: o.matiere, epaisseur: o.epaisseur, machineId: o.machineId,
        manualStart: o.manualStart, dureeOverrideH: o.dureeOverrideH
      });
    });
  });
  // Un groupe réduit à 1 seule pièce (les autres retirées manuellement) n'a plus grand intérêt à
  // être affiché comme "fusionné" — mais reste fonctionnellement normal, donc on ne le cache que de cette vue de synthèse.
  return Object.values(groups).filter(g => {
    if(g.items.length < 2) return false;
    if(!includeDone && g.items.every(it => it.statut === 'termine')) return false;
    return true;
  });
}
function updateFusionGroupStart(groupId, value){
  if(!value) return;
  state.commandes.forEach(cc => cc.pieces.forEach(oo => { if(oo.fusionGroupId===groupId) oo.manualStart = value; }));
  commit();
}
function updateFusionGroupDuree(groupId, value){
  const v = Number(value);
  if(!v || v<=0) return;
  state.commandes.forEach(cc => cc.pieces.forEach(oo => { if(oo.fusionGroupId===groupId) oo.dureeOverrideH = v; }));
  commit();
}

    return `<div class="fusion-group">
      <div class="fusion-group-head"><strong>${escapeHtml(m?m.nom:'')}</strong> — ${escapeHtml(first.matiere||'—')} / ${escapeHtml(first.epaisseur||'—')} — ${g.items.length} pièce(s)</div>
      <div class="commande-top-fields" style="grid-template-columns:1fr 1fr; margin-bottom:8px;">

        <div><label class="field">Durée totale (h, partagée)</label><input type="number" min="0.25" step="0.25" value="${dureeH}" data-action="update-fusion-group-duree" data-group="${g.id}"></div>

    ${collapsed ? '' : `<div class="panel-body">${body}
      <div class="footer-note" style="text-align:left; padding-top:8px;">Modifier le départ ou la durée ici s'applique à toutes les pièces du groupe en une fois. Chaque champ reste aussi modifiable individuellement dans le tableau de sa commande.</div>
    </div>`}
  </section>`;
}
let fusionGroupDetailsOpen = {}; // clé de groupe -> détail (liste + cases) déplié ou non, replié par défaut
function renderFusionPanel(){
  const groups = detectFusionOpportunities();
  if(groups.length === 0) return '';
  const collapsed = fusionPanelsCollapsed.detect;
  const blocks = collapsed ? '' : groups.map(g => {
    const key = g.key;
    if(!fusionCheckedItems[key]) fusionCheckedItems[key] = new Set();
    const checked = fusionCheckedItems[key];
    const m = state.machines.find(mm=>mm.id===g.machineId);
    const totalH = g.items.reduce((s,i)=>s+i.dureeH,0);
    const detailsOpen = !!fusionGroupDetailsOpen[key];
    const rows = g.items.map(it => `
      <tr>
        <td><input type="checkbox" data-action="toggle-fusion-item" data-key="${key}" data-oid="${it.oid}" ${checked.has(it.oid)?'checked':''}></td>
        <td>${escapeHtml(it.cnom)}</td>
        <td>${escapeHtml([it.piece,it.etape].filter(Boolean).join(' / ')||'—')}</td>
        <td>${durationLabel(it.dureeH)}</td>
      </tr>`).join('');
    return `<div class="fusion-group">
      <div class="fusion-group-head"><strong>${escapeHtml(m?m.nom:'')}</strong> — ${escapeHtml(g.matiere)} / ${escapeHtml(g.epaisseur)} — ${g.items.length} pièce(s) de commandes différentes, ${durationLabel(totalH)} au total si tout est pris
        <button class="ghost small" data-action="toggle-fusion-group-details" data-key="${key}" style="margin-left:8px;">${detailsOpen?'▾ Masquer le détail':'▸ Voir le détail'}</button>
      </div>
      ${detailsOpen ? `<table class="ops-table">
        <thead><tr><th></th><th>Commande</th><th>Pièce / Étape</th><th>Durée</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : ''}
      <div class="form-actions" style="margin-top:8px;">
        ${detailsOpen ? `<button class="small" data-action="fuse-selected" data-key="${key}">Fusionner la sélection (${checked.size})</button>` : '<span></span>'}
        <button class="primary small" data-action="fuse-all" data-key="${key}">Tout fusionner (${g.items.length})</button>
      </div>
    </div>`;
  }).join('');
  return `<section class="panel"><div class="panel-head" style="cursor:pointer;" data-action="toggle-fusion-panel" data-which="detect"><h2>${collapsed?'▸':'▾'} 🔗 Regroupements possibles (découpe) — ${groups.length}</h2></div>
    ${collapsed ? '' : `<div class="panel-body">${blocks}
    <div class="footer-note" style="text-align:left; padding-top:8px;">Ces pièces partagent la même matière et épaisseur sur un poste marqué "fusionnable" (réglable dans Paramètres → Postes). La durée du bloc fusionné est la somme des durées individuelles — modifiable ensuite comme n'importe quelle durée.</div>
  </div>`}
  </section>`;
}
function renderPlanningSection(schedule){
  const hasOps = schedule.some(c=>c.pieces.some(o=>o.start));
  let body;
  if(currentView==='kanban') body = renderKanbanView(schedule);
  else if(currentView==='liste') body = renderListeView(schedule);
  else if(!hasOps){ body = `<div class="gantt-empty">Aucune opération planifiée. Ajoutez une commande ci-dessous pour voir apparaître le planning.</div>`; }
  else if(currentView==='jour') body = `<div class="panel-body" style="padding:0 0 4px;">${renderDayView(schedule)}</div>`;
  else if(currentView==='semaine') body = `<div class="panel-body" style="padding:0 0 4px;">${renderWeekView(schedule)}</div>`;
  else if(currentView==='mois') body = `<div class="panel-body">${renderMonthView(schedule)}</div>`;
  else body = renderYearView(schedule);
  return `<section class="panel" id="planning-section">
    <div class="panel-head panel-head-clickable" data-action="toggle-panel-collapse" data-key="planning">
      <h2>Planning visuel</h2>
      <button class="ghost icon-btn collapse-chevron ${panelCollapsed.planning?'collapsed':''}" data-action="toggle-panel-collapse" data-key="planning" title="${panelCollapsed.planning?'Déplier':'Replier'}">▾</button>
    </div>
    ${panelCollapsed.planning ? '' : `${renderPlanningToolbar()}${body}`}
  </section>`;
}

function renderKanbanView(schedule){
  const cols = [
    { key:'a_faire', label:'À faire' },
    { key:'en_cours', label:'En cours' },
    { key:'en_pause', label:'En pause' },
    { key:'termine', label:'Terminée' }
  ];
  let allOps = [];
  schedule.forEach(c => c.pieces.forEach(o => {
    allOps.push({ ...o, commandeNom:c.nom, cid:c.id, urgence:c.urgence||'normale', dateBesoin:c.dateBesoin });
  }));
  allOps = allOps.filter(o => matchesSearch({ nom:o.commandeNom, pieces:[o] }, searchQuery));
  if(kanbanMachineFilters) allOps = allOps.filter(o => kanbanMachineFilters.has(o.machineId));

  const doneCutoff = doneFilterCutoff(doneFilterRange);
  const colsHtml = cols.map(col => {
    let ops = allOps.filter(o => o.statut===col.key);
    if(kanbanGroupedView) ops = mergeFusedOpsForDisplay(ops); // une seule carte par groupe fusionné, comptée comme telle dans les limites/compteurs ci-dessous
    let totalAvantLimite = ops.length;
    if(col.key==='termine'){
      if(doneCutoff) ops = ops.filter(o => !o.finReel || new Date(o.finReel) >= doneCutoff);
      totalAvantLimite = ops.length;
      ops.sort((a,b) => {
        const ta = a.finReel ? new Date(a.finReel).getTime() : 0;
        const tb = b.finReel ? new Date(b.finReel).getTime() : 0;
        return tb - ta; // les plus récentes d'abord
      });
      ops = ops.slice(0, kanbanDoneLimit);
    } else if(col.key==='a_faire'){
      ops.sort((a,b) => {
        const ta = a.start ? a.start.getTime() : 0;
        const tb = b.start ? b.start.getTime() : 0;
        return ta - tb;
      });
      totalAvantLimite = ops.length;
      ops = ops.slice(0, kanbanDoneLimit); // les plus proches dans le temps restent visibles en priorité
    } else {
      ops.sort((a,b) => {
        const ta = a.start ? a.start.getTime() : 0;
        const tb = b.start ? b.start.getTime() : 0;
        return ta - tb;
      });
    }
    const cards = ops.map(o => {
      const mi = state.machines.findIndex(m=>m.id===o.machineId);
      const m = mi>=0 ? state.machines[mi] : null;
      const color = machineColor(m, mi<0?0:mi);
      const urgBorder = urgencyBorderColor(o.urgence);
      const timeInfo = o.sousTraitance
        ? (col.key==='termine' ? (o.finReel ? `🏭 Revenue le ${formatDT(new Date(o.finReel))}` : '🏭 Revenue') : '🏭 Sous-traitée — non planifiée')
        : col.key==='termine'
        ? (o.finReel ? `Terminée le ${formatDT(new Date(o.finReel))}` : 'Réalisée')
        : (o.start ? `${formatDT(o.start)} → ${formatDT(o.end)}` : 'Non planifiée');
      const label = o._fusionMembers
        ? (() => {
            const distinctCmd = Array.from(new Set(o._fusionMembers.map(mb=>mb.commandeNom)));
            const refLabel = distinctCmd.length===1 ? distinctCmd[0] : `${distinctCmd.length} commandes`;
            return `🔗 ${o._fusionMembers.length} pièces — ${refLabel}`;
          })()
        : [o.commandeNom, o.piece, o.etape].filter(Boolean).join(' · ');
      const fusionListLineK = o._fusionMembers
        ? `<div class="kanban-card-fusion-list">${o._fusionMembers.map(mb=>escapeHtml([mb.piece,mb.etape].filter(Boolean).join(' / ')||'—')).join(', ')}</div>` : '';
      const hlOnK = highlightActive();
      const hlK = isHighlighted(o.cid, o.commandeNom, o.piece);
      const hlClsK = hlOnK ? (hlK ? 'spotlight' : 'dimmed') : '';
      const operateurK = o.operatorUserId ? usersList.find(u=>String(u.id)===String(o.operatorUserId)) : null;
      const dueLineK = o.dateBesoin ? `<div class="kanban-card-due">Échéance : ${escapeHtml(new Date(o.dateBesoin+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}))}</div>` : '';
      const dureeH = (o.dureeOverrideH!=null && o.dureeOverrideH>0) ? o.dureeOverrideH : (Number(o.tempsUnitaire)*Number(o.quantite))/60;
      const plannedLineK = `<div class="kanban-card-planned">Prévu : ${durationLabel(dureeH)}</div>`;
      const elapsedLineK = (col.key==='en_cours'||col.key==='en_pause'||col.key==='termine') ? (() => {
        const elapsedH = dureePasseeH(o, state);
        if(!elapsedH || elapsedH <= 0) return '';
        const label2 = col.key==='termine' ? 'Passé' : 'Passé jusqu\'ici';
        return `<div class="kanban-card-elapsed">${label2} : ${durationLabel(elapsedH)}</div>`;
      })() : '';
      return `<div class="kanban-card ${hlClsK}" data-action="card-isolate" data-cid="${o.cid}" data-oid="${o.id}" style="border-left:3px solid ${urgBorder};" title="Clic : isoler la commande — clic droit : menu de statut">
        <div class="kanban-card-main">
          <div class="kanban-card-title">${escapeHtml(label)}</div>
          <div class="kanban-card-meta"><span class="machine-swatch" style="background:${color}"></span>${m?escapeHtml(m.nom):'—'}${operateurK ? ` · 👤 ${escapeHtml(operateurK.username)}` : ''}</div>
          ${fusionListLineK}
          ${dueLineK}
        </div>
        <div class="kanban-card-times">
          <div class="kanban-card-time">${escapeHtml(timeInfo)}</div>
          ${plannedLineK}
          ${elapsedLineK}
        </div>
      </div>`;
    }).join('');
    const limited = (col.key==='a_faire' || col.key==='termine');
    const countLabel = (limited && totalAvantLimite>ops.length)
      ? `(${ops.length} sur ${totalAvantLimite})` : `(${ops.length})`;
    return `<div class="kanban-col">
      <div class="kanban-col-head">${col.label} <span class="collapse-count">${countLabel}</span></div>
      <div class="kanban-col-body">${cards || `<div class="kanban-empty">Aucune tâche</div>`}</div>
    </div>`;
  }).join('');

  const nbVisibles = kanbanMachineFilters ? kanbanMachineFilters.size : state.machines.length;
  return `<div class="panel-body">
    <div class="kanban-machine-filters">
      <span class="kanban-filter-label">Postes affichés (${nbVisibles}/${state.machines.length})</span>
      ${state.machines.map(m=>`
        <label class="kanban-filter-chip ${isKanbanMachineVisible(m.id)?'on':''}">
          <input type="checkbox" ${isKanbanMachineVisible(m.id)?'checked':''} data-action="toggle-kanban-machine" data-id="${m.id}">
          <span class="machine-dot" style="background:${escapeHtml(m.couleur||'#888')}"></span>${escapeHtml(m.nom)}
        </label>`).join('')}
      <button class="ghost small" data-action="kanban-machines-all">Tout</button>
      <button class="ghost small" data-action="kanban-machines-none">Aucun</button>
    </div>
    <div class="kanban-limit-toolbar">
      <label for="kanban-done-limit-select">Limiter "À faire" et "Terminée" à</label>
      <select class="small kanban-done-limit-select" id="kanban-done-limit-select" data-action="set-kanban-done-limit" title="Nombre de tâches affichées dans ces deux colonnes">
        ${[5,10,15,20,50].map(n=>`<option value="${n}" ${kanbanDoneLimit===n?'selected':''}>${n}</option>`).join('')}
        <option value="all" ${kanbanDoneLimit===Infinity?'selected':''}>Tout</option>
      </select>
      <label class="statut-chip" style="margin-left:14px;">
        <input type="checkbox" ${kanbanGroupedView?'checked':''} data-action="toggle-kanban-grouped-view">
        🔗 Vue groupée des pièces fusionnées
      </label>
    </div>
    <div class="kanban-board">${colsHtml}</div>
    <div class="footer-note" style="text-align:left; padding-top:10px;">Cliquez sur une carte pour isoler sa commande ; clic droit pour ouvrir le menu (Démarrer / Mettre en pause / Terminer). "À faire" garde en priorité les tâches les plus proches dans le temps ; "Terminée" garde les plus récentes et respecte aussi le filtre de période choisi dans le tableau des tâches terminées. "En cours" et "En pause" ne sont jamais limitées (bornées naturellement par votre nombre de postes).</div>
  </div>`;
}

function renderListeView(schedule){
  let allOps = [];
  schedule.forEach(c => c.pieces.forEach(o => {
    if(o.statut==='termine') return; // déjà couvert par le tableau des tâches terminées
    allOps.push({ ...o, commandeNom:c.nom, cid:c.id, urgence:c.urgence||'normale', dateBesoin:c.dateBesoin });
  }));
  allOps = allOps.filter(o => matchesSearch({ nom:o.commandeNom, pieces:[o] }, searchQuery));
  allOps.sort((a,b) => {
    const ta = a.start ? a.start.getTime() : Infinity;
    const tb = b.start ? b.start.getTime() : Infinity;
    return ta - tb;
  });

  if(allOps.length === 0){
    return `<div class="gantt-empty">Aucune tâche planifiée à afficher.</div>`;
  }

  const rows = allOps.map(o => {
    const mi = state.machines.findIndex(m=>m.id===o.machineId);
    const m = mi>=0 ? state.machines[mi] : null;
    const color = machineColor(m, mi<0?0:mi);
    const meta = barStatusMeta(o, color, !!(o.manualStart || o.dureeOverrideH));
    const statutLabel = { a_faire:'À faire', en_cours:'En cours', en_pause:'En pause' }[o.statut] || o.statut;
    const hlOnL = highlightActive();
    const hlL = isHighlighted(o.cid, o.commandeNom, o.piece);
    const hlClsL = hlOnL ? (hlL ? 'spotlight' : 'dimmed') : '';
    return `<tr class="liste-row ${hlClsL}" data-action="card-isolate" data-cid="${o.cid}" data-oid="${o.id}" title="Clic : isoler la commande — clic droit : menu de statut">
      <td><span class="machine-swatch" style="background:${color}"></span>${m?escapeHtml(m.nom):'—'}</td>
      <td>${escapeHtml(o.commandeNom)}</td>
      <td>${escapeHtml([o.piece,o.etape].filter(Boolean).join(' · ') || '—')}</td>
      <td><span class="urgency-select" style="pointer-events:none;${(()=>{const uCol=urgencyColorFor(o.urgence); return uCol?`background:${hexToRgba(uCol,0.12)};color:${uCol};border-color:${uCol};`:'';})()}">${o.urgence==='urgente'?'Urgente':o.urgence==='importante'?'Importante':'Normale'}</span></td>
      <td>${o.start?formatDT(o.start):'—'}</td>
      <td>${o.end?formatDT(o.end):'—'}</td>
      <td class="liste-due">${o.dateBesoin?escapeHtml(new Date(o.dateBesoin+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})):'—'}</td>
      <td>${meta.prefix}${statutLabel}</td>
    </tr>`;
  }).join('');

  return `<div class="panel-body">
    <div class="liste-toolbar">
      <button class="small" data-action="print-liste">🖨 Imprimer (A4)</button>
    </div>
    <div class="print-area">
      <div class="print-header">
        ${state.config.logoDataUrl ? `<img src="${escapeHtml(state.config.logoDataUrl)}" alt="" class="print-logo">` : ''}
        <h1>${escapeHtml(state.config.appTitle||'Planning atelier')} — Liste des tâches</h1>
        <div class="print-meta">Édité le ${formatDT(new Date())}${searchQuery?` — filtré sur « ${escapeHtml(searchQuery)} »`:''}</div>
      </div>
      <table class="ops-table liste-table">
        <thead><tr><th>Poste</th><th>Commande</th><th>Pièce / Étape</th><th>Urgence</th><th>Début</th><th>Fin</th><th>Échéance</th><th>Statut</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${state.config.copyright ? `<div class="print-footer">${escapeHtml(state.config.copyright)}</div>` : ''}
    </div>
    <div class="footer-note" style="text-align:left; padding-top:10px;">Triée par heure de début. Cliquez sur une ligne pour isoler sa commande ; clic droit pour ouvrir le menu (Démarrer / Mettre en pause / Terminer). Les tâches terminées ne sont pas listées ici — retrouvez-les dans le tableau dédié plus bas.</div>
  </div>`;
}

          <option value="normale" ${draft.urgence==='normale'?'selected':''}>Normale</option>

          <option value="urgente" ${draft.urgence==='urgente'?'selected':''}>Urgente</option>

      </div>

      </div>
    </div>
  </section>`;
}

function renderOpsRow(o, c){
  const done = o.statut==='termine';
  const running = o.statut==='en_cours' || o.statut==='en_pause';
  const dureeH = (o.dureeOverrideH!=null && o.dureeOverrideH>0) ? o.dureeOverrideH : (o.tempsUnitaire*o.quantite)/60;
  const overridden = o.manualStart || o.dureeOverrideH;
  const elapsedNote = running
    ? `<div class="elapsed-note">${durationLabel(opElapsedHours(o, state))} écoulé${o.statut==='en_pause'?(o.autoPaused?' (pause déjeuner)':' (en pause)'):''}</div>`
    : (done && dureePasseeH(o, state) ? `<div class="elapsed-note">${durationLabel(dureePasseeH(o, state))} réellement passé</div>` : '');
  const datesCell = o.sousTraitance
    ? (done
        ? (o.finReel ? `<span class="dates-val">🏭 <span class="lbl">Revenue le</span> ${formatDT(new Date(o.finReel))}</span>` : `<span class="dates-val" style="color:var(--text-faint)">🏭 Sous-traitée — revenue</span>`)
        : `<span class="dates-val" style="color:var(--text-faint)">🏭 Sous-traitée — ${running?'en cours chez le sous-traitant':'en attente d\'envoi'}</span>`)
    : done
    ? (o.finReel ? `<span class="dates-val"><span class="lbl">Terminée le</span> ${formatDT(new Date(o.finReel))}</span>` : `<span class="dates-val" style="color:var(--text-faint)">Réalisée</span>`)
    : (o.start ? `<span class="dates-val"><span class="lbl">Début</span> ${formatDT(o.start)} <button class="ghost icon-btn date-pin-btn" data-action="open-date-picker" data-target="ms-${o.id}" title="Modifier et figer la date de départ">📅</button><input type="datetime-local" id="ms-${o.id}" class="hidden-date-input" data-action="set-manual-start" data-cid="${c.id}" data-oid="${o.id}" value="${o.manualStart || toInputValue(o.start)}"><br><span class="lbl">Fin</span> ${formatDT(o.end)}<br><span class="pin-badge ${overridden?'pinned':'floating'}">${overridden?'📌 Figée':'〰️ Volante'}</span>${overridden?` <button class="ghost small" data-action="reset-op-override" data-cid="${c.id}" data-oid="${o.id}" style="padding:2px 6px;">↺ Libérer</button>`:''}</span>` : '—');
  const phaseCell = `<input type="number" min="1" step="1" class="phase-input" value="${o.phase||1}" data-action="op-phase" data-cid="${c.id}" data-oid="${o.id}" title="Cette pièce démarre une fois terminées toutes les pièces de phase inférieure de la même commande">
    <input type="date" class="phase-input" style="margin-top:4px;" value="${o.dateDebutPossible||''}" data-action="op-date-debut-possible" data-cid="${c.id}" data-oid="${o.id}" title="Départ possible au plus tôt (optionnel) — ex : en attente d'une matière qui arrive à cette date">`;
  const machinePourPiece = state.machines.find(mm=>mm.id===o.machineId);
  // Les champs Matière/Épaisseur ne servent qu'à la détection automatique par matière/épaisseur :
  // ils disparaissent quand ce réglage global est désactivé (Paramètres → Postes). L'indicateur
  // "fusionnée" reste visible dans tous les cas, puisqu'une pièce peut être regroupée autrement
  // (case "Regrouper" à l'import, ou bouton manuel en création de commande).
  const showMatiereFields = state.config.matiereFusionActive && machinePourPiece && machinePourPiece.fusionnable;
  const fusionBadge = o.fusionGroupId ? `<div class="footer-note" style="margin:2px 0 0;">🔗 fusionnée</div>` : '';
  const matiereCell = showMatiereFields
    ? `<input placeholder="Matière" value="${escapeHtml(o.matiere||'')}" data-action="op-field" data-cid="${c.id}" data-oid="${o.id}" data-field="matiere" style="margin-bottom:4px;">
       <input placeholder="Épaisseur" value="${escapeHtml(o.epaisseur||'')}" data-action="op-field" data-cid="${c.id}" data-oid="${o.id}" data-field="epaisseur">
       ${fusionBadge}`
    : (fusionBadge || `<span class="footer-note">—</span>`);
  return `
  <tr>
    <td class="col-piece"><input value="${escapeHtml(o.piece)}" data-action="op-field" data-cid="${c.id}" data-oid="${o.id}" data-field="piece" placeholder="Pièce"></td>
    <td class="col-etape"><input value="${escapeHtml(o.etape)}" data-action="op-field" data-cid="${c.id}" data-oid="${o.id}" data-field="etape" placeholder="Étape"></td>
    <td class="col-machine"><select data-action="op-field" data-cid="${c.id}" data-oid="${o.id}" data-field="machineId">${machineOptions(o.machineId)}</select>
      <select class="op-operator-select" data-action="op-field" data-cid="${c.id}" data-oid="${o.id}" data-field="operatorUserId" title="Opérateur assigné — sa pause déjeuner (si réglée) remplace celle du poste">${operatorOptions(o.operatorUserId)}</select>
      <label class="statut-chip" style="font-size:10px; margin-top:4px; display:flex; align-items:center; gap:4px;" title="Cette pièce n'est jamais planifiée sur un poste — elle garde son statut normalement, et peut toujours bloquer une phase suivante tant qu'elle n'est pas marquée Terminée.">
        <input type="checkbox" ${o.sousTraitance?'checked':''} data-action="toggle-op-sous-traitance" data-cid="${c.id}" data-oid="${o.id}"> 🏭 Sous-traité

    <td class="col-tu"><input type="number" min="0" step="0.5" value="${o.tempsUnitaire}" data-action="op-field" data-cid="${c.id}" data-oid="${o.id}" data-field="tempsUnitaire">
      <button class="ghost small" data-action="corriger-temps-theorique" data-cid="${c.id}" data-oid="${o.id}" title="Corriger une erreur de saisie initiale : remplace directement le temps théorique de référence (et le temps unitaire) par la valeur donnée" style="display:block; width:100%; margin-top:2px; font-size:9px; padding:2px 4px;">✎ Corriger le théorique</button></td>
    <td class="col-qte"><input type="number" min="1" step="1" value="${o.quantite}" data-action="op-field" data-cid="${c.id}" data-oid="${o.id}" data-field="quantite"></td>

    <td class="col-deps">${phaseCell}</td>
    <td class="col-matiere">${matiereCell}</td>
    <td class="col-statut"><select class="statut-select" data-action="op-statut-select" data-cid="${c.id}" data-oid="${o.id}">

      <option value="en_cours" ${o.statut==='en_cours'?'selected':''}>En cours</option>
      <option value="en_pause" ${o.statut==='en_pause'?'selected':''}>En pause</option>

    </select>${elapsedNote}</td>
    <td class="col-dates">${datesCell}</td>
    <td class="col-del"><button class="danger-ghost icon-btn" data-action="remove-op" data-cid="${c.id}" data-oid="${o.id}">✕</button></td>
  </tr>`;

const OPS_TABLE_HEAD = `<thead><tr><th>Pièce</th><th>Étape</th><th>Poste</th><th>T. unit. (min)</th><th>Qté</th><th>Durée</th><th>Phase</th><th>Matière / Ép.</th><th>Statut</th><th>Planifié</th><th></th></tr></thead>`;

function renderCommandeCard(c, idx, total){
  let badge = `<span class="badge neutral">Fin est. ${c.finEstimee ? formatDT(c.finEstimee) : '—'}</span>`;
  if(c.dateBesoin && c.finEstimee){
    const due = effectiveDueDate(c.dateBesoin);
    if(c.finEstimee > due){
      const deltaDays = Math.ceil((c.finEstimee-due)/86400000);
      badge = `<span class="badge red">Retard estimé ~${deltaDays} j</span>`;
    } else badge = `<span class="badge green">Dans les temps</span>`;
  }
  const allDone = c.pieces.length>0 && c.pieces.every(o=>o.statut==='termine');
  if(allDone) badge = `<span class="badge done">Terminée</span>`;

  const activePieces = c.pieces.filter(o=>o.statut!=='termine');
  const donePieces = c.pieces.filter(o=>o.statut==='termine');

  const activeBlock = `
    <div class="ops-subhead">Tâches en cours <span class="ops-subcount">(${activePieces.length})</span></div>
    ${activePieces.length ? `<table class="ops-table">${OPS_TABLE_HEAD}<tbody>${activePieces.map(o=>renderOpsRow(o,c)).join('')}</tbody></table>` : `<div class="ops-empty">Aucune ligne en cours.</div>`}`;

  const doneBlock = donePieces.length ? `
    <div class="ops-subhead ops-subhead-done">Tâches terminées <span class="ops-subcount">(${donePieces.length})</span></div>
    <table class="ops-table">${OPS_TABLE_HEAD}<tbody>${donePieces.map(o=>renderOpsRow(o,c)).join('')}</tbody></table>` : '';

  const cardUCol = urgencyColorFor(c.urgence);
  const cardBorderStyle = cardUCol ? `border-left-color:${cardUCol};` : '';
  const selectUCol = urgencyColorFor(c.urgence);
  const selectStyle = selectUCol ? `background:${hexToRgba(selectUCol,0.12)};color:${selectUCol};border-color:${selectUCol};` : '';
  return `
  <div class="commande-card ${selectedCommandeId===c.id?'commande-selected':''}" style="${cardBorderStyle}">
    <div class="chead">
      <div class="prio-controls">
        <button class="ghost" data-action="move-commande" data-dir="-1" data-id="${c.id}" ${idx===0?'disabled':''} title="Monter en priorité">▲</button>
        <button class="ghost" data-action="move-commande" data-dir="1" data-id="${c.id}" ${idx===total-1?'disabled':''} title="Descendre en priorité">▼</button>
      </div>
      <button class="commande-rank mono ${selectedCommandeId===c.id?'selected':''}" data-action="toggle-select-commande" data-id="${c.id}" title="Mettre en évidence cette commande dans le planning visuel">#${idx+1}</button>
      <input class="commande-name" value="${escapeHtml(c.nom)}" data-action="commande-field" data-cid="${c.id}" data-field="nom">
      <select class="urgency-select" style="${selectStyle}" data-action="commande-field" data-cid="${c.id}" data-field="urgence" title="Niveau d'urgence">
        <option value="normale" ${c.urgence==='normale'?'selected':''}>Normale</option>
        <option value="importante" ${c.urgence==='importante'?'selected':''}>Importante</option>
        <option value="urgente" ${c.urgence==='urgente'?'selected':''}>Urgente</option>
      </select>
      <div class="due-field">Échéance <input type="date" required value="${c.dateBesoin}" data-action="commande-field" data-cid="${c.id}" data-field="dateBesoin"></div>
      ${badge}
    </div>
    ${activeBlock}
    ${doneBlock}
    <div class="commande-footer">
      <button class="small add-op-btn" data-action="add-op" data-cid="${c.id}">+ Ajouter une ligne pièce / étape</button>
      <button class="danger-ghost small delete-cmd" data-action="delete-commande" data-id="${c.id}">Supprimer la commande</button>
    </div>
  </div>`;
}

function renderCommandes(schedule){
  const filtered = schedule.filter(c => matchesSearch(c, searchQuery) && (!selectedCommandeId || c.id===selectedCommandeId));
  const active = filtered.filter(c => c.pieces.length===0 || !c.pieces.every(o=>o.statut==='termine'));
  const doneAll = filtered.filter(c => c.pieces.length>0 && c.pieces.every(o=>o.statut==='termine'));
  const doneCutoff = doneFilterCutoff(doneFilterRange);
  const done = !doneCutoff ? doneAll : doneAll.filter(c => {
    const d = commandeCompletionDate(c);
    return !d || d >= doneCutoff; // pas de date connue -> on la garde par prudence
  });

  const isolatedCommande = selectedCommandeId ? schedule.find(c=>c.id===selectedCommandeId) : null;
  const searchBar = `
  <div class="search-bar">
    <input type="text" id="commande-search-input" placeholder="Rechercher une commande ou une pièce…" value="${escapeHtml(searchQuery)}">
    ${searchQuery ? `<button class="ghost small" data-action="clear-search">✕ Effacer</button>` : ''}
  </div>
  ${isolatedCommande ? `<div class="isolate-banner">Commande isolée : <strong>${escapeHtml(isolatedCommande.nom)}</strong><button class="ghost small" data-action="clear-isolate">✕ Afficher toutes les commandes</button></div>` : ''}`;

  let activeBody;
  if(active.length){
    activeBody = active.map((c,idx)=>renderCommandeCard(c, idx, active.length)).join('');
  } else if(schedule.length===0){
    activeBody = `<div class="empty-state"><strong>Aucune commande en cours</strong>Ajoutez votre première commande ci-dessous pour démarrer le planning.</div>`;
  } else if(searchQuery){
    activeBody = `<div class="empty-state"><strong>Aucun résultat</strong>Aucune commande en cours ne correspond à votre recherche.</div>`;
  } else {
    activeBody = `<div class="empty-state"><strong>Toutes les commandes sont terminées</strong>Retrouvez-les dans la section ci-dessous.</div>`;
  }

  const activeSection = `
  <section class="panel">
    <div class="panel-head">
      <h2><span class="n">${active.length}</span>Tâches en cours — priorité de haut en bas</h2>
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="small" data-action="sort-by-priority" title="Urgence d'abord (Urgente > Importante > Normale), puis échéance la plus proche">Trier par priorité</button>
        <button class="ghost icon-btn collapse-chevron ${panelCollapsed.active?'collapsed':''}" data-action="toggle-panel-collapse" data-key="active" title="${panelCollapsed.active?'Déplier':'Replier'}">▾</button>
      </div>
    </div>
    ${panelCollapsed.active ? '' : `<div class="panel-body" style="padding:12px;">${activeBody}</div>`}
  </section>`;

  const doneFilterControl = `
    <select class="small done-filter-select" data-action="set-done-filter" title="Limiter l'affichage à une période récente">
      <option value="all" ${doneFilterRange==='all'?'selected':''}>Tout afficher</option>
      <option value="w1" ${doneFilterRange==='w1'?'selected':''}>1 semaine</option>
      <option value="w2" ${doneFilterRange==='w2'?'selected':''}>2 semaines</option>
      <option value="w3" ${doneFilterRange==='w3'?'selected':''}>3 semaines</option>
      <option value="m1" ${doneFilterRange==='m1'?'selected':''}>Dernier mois</option>
      <option value="m2" ${doneFilterRange==='m2'?'selected':''}>2 derniers mois</option>
      <option value="m3" ${doneFilterRange==='m3'?'selected':''}>3 derniers mois</option>
      <option value="m6" ${doneFilterRange==='m6'?'selected':''}>6 derniers mois</option>
    </select>`;
  const doneCountLabel = (doneFilterRange!=='all' && done.length!==doneAll.length)
    ? `<span class="n">${done.length}</span>Tâches terminées <span class="footer-note" style="display:inline; margin:0;">(sur ${doneAll.length} au total)</span>`
    : `<span class="n">${done.length}</span>Tâches terminées`;
  const doneChevron = `<button class="ghost icon-btn collapse-chevron ${panelCollapsed.done?'collapsed':''}" data-action="toggle-panel-collapse" data-key="done" title="${panelCollapsed.done?'Déplier':'Replier'}">▾</button>`;

  const doneSection = doneAll.length ? `
  <section class="panel">
    <div class="panel-head"><h2>${doneCountLabel}</h2><div style="display:flex; align-items:center; gap:8px;">${doneFilterControl}${doneChevron}</div></div>
    ${panelCollapsed.done ? '' : `<div class="panel-body" style="padding:12px;">${done.length ? done.map((c,idx)=>renderCommandeCard(c, idx, done.length)).join('') : `<div class="empty-state">Aucune commande terminée sur cette période.</div>`}</div>`}
  </section>` : (searchQuery && schedule.some(c=>c.pieces.length>0 && c.pieces.every(o=>o.statut==='termine')) ? `
  <section class="panel">
    <div class="panel-head"><h2><span class="n">0</span>Tâches terminées</h2></div>
    <div class="panel-body"><div class="empty-state">Aucune commande terminée ne correspond à votre recherche.</div></div>
  </section>` : `
  <section class="panel">
    <div class="panel-head"><h2><span class="n">0</span>Tâches terminées</h2></div>
    <div class="panel-body"><div class="empty-state">Aucune commande terminée pour le moment.</div></div>
  </section>`);

  return searchBar + `<div class="commandes-columns" id="commandes-columns" style="grid-template-columns:minmax(0,${columnsRatio}fr) 9px minmax(0,${100-columnsRatio}fr);">${activeSection}<div class="columns-resize-handle" id="columns-resize-handle" title="Glisser pour ajuster la largeur — double-clic pour réinitialiser à 50/50"><div class="columns-resize-grip"></div></div>${doneSection}</div>`;
}

function renderToast(){
  if(!toastMessage) return '';
  return `<div class="toast">
    <span>${escapeHtml(toastMessage)}</span>
    <button class="ghost icon-btn" data-action="dismiss-toast" title="Fermer">✕</button>

function render(){
  applyDocumentPersonalization();
  const appEl = document.getElementById('app');
  appEl.className = (state.config && state.config.density==='compact') ? 'density-compact' : '';
  // Une pop-up (Paramètres, résultat d'import Excel) redessinée perd sinon systématiquement sa
  // position de défilement à chaque validation — on la mémorise juste avant, on la réapplique juste après.
  const openModal = document.querySelector('.modal-box');
  const modalScrollTop = openModal ? openModal.scrollTop : null;
  // Même principe pour le focus : un champ (ex. un horaire "hh:mm") peut déclencher son événement
  // de changement dès la première partie saisie (heures) sur certains navigateurs — sans cette
  // restauration, le redessin qui s'ensuit fait perdre le focus au milieu de la saisie.
  const focusRef = captureFocusRef();
  if(currentPage === 'conges'){
    appEl.innerHTML = [
      renderHeader(),
      renderCongesPage(),
      renderSettingsModal(),
      renderEditLeaveRequestModal(),
      renderLeaveRequestPreviewModal(),
      renderToast()
    ].join('');
    restoreModalScroll(modalScrollTop);
    restoreFocusRef(focusRef);
    return;
  }
  const schedule = computeSchedule(state);
  const html = [
    renderHeader(),
    renderStats(schedule),
    renderPlanningSection(schedule),
    renderFusionPanel(),
    renderActiveFusionGroupsPanel(),
    renderNewForm(),
    renderCommandes(schedule),
    `<div class="footer-note">Les dates sont recalculées automatiquement à chaque modification — décalez un poste ou une échéance pour voir l'effet en cascade.</div>`,
    renderSettingsModal(),
    renderExcelImportModal(),
    renderCustomImportModal(),
    renderFusionGroupDetailModal(),
    renderContextMenu(),
    renderToast()
  ].join('');
  appEl.innerHTML = html;
  restoreModalScroll(modalScrollTop);
  restoreFocusRef(focusRef);
}
function captureFocusRef(){
  const el = document.activeElement;
  if(!el || el===document.body) return null;
  if(!['INPUT','SELECT','TEXTAREA'].includes(el.tagName)) return null;
  const attrs = ['data-action','data-field','data-id','data-cid','data-oid','data-user-id','data-type-id','data-machine-id','data-conge-id','id'];
  let selector = el.tagName.toLowerCase();
  attrs.forEach(a => { const v = el.getAttribute(a); if(v!=null) selector += `[${a}="${v.replace(/"/g,'\\"')}"]`; });
  if(selector === el.tagName.toLowerCase()) return null; // aucun attribut identifiant : impossible de le retrouver après coup
  let selectionStart = null, selectionEnd = null;
  try{ selectionStart = el.selectionStart; selectionEnd = el.selectionEnd; }catch(e){ /* pas pris en charge sur ce type de champ (ex. time) */ }
  return { selector, selectionStart, selectionEnd };
}
function restoreFocusRef(ref){
  if(!ref) return;
  let el;
  try{ el = document.querySelector(ref.selector); }catch(e){ return; }
  if(!el) return;
  el.focus();
  if(typeof ref.selectionStart === 'number' && el.setSelectionRange){
    try{ el.setSelectionRange(ref.selectionStart, ref.selectionEnd); }catch(e){ /* pas pris en charge sur ce type de champ */ }
  }
}
function restoreModalScroll(scrollTop){
  if(scrollTop === null) return;
  const modal = document.querySelector('.modal-box');
  if(modal) modal.scrollTop = scrollTop;
}

/* ---------------- délégation d'événements : clics & changements ---------------- */
document.addEventListener('click', (e) => {
  if(e.target.classList && e.target.classList.contains('modal-overlay')){
    excelImportResult = null; pendingLeaveRequestDraft = null; customImportState = null; fusionDetailModalGroupId = null; closeSettingsModal(); return;
  }
  if(contextMenu && !e.target.closest('.context-menu')){
    contextMenu = null; render();
  }
  // Tâche non draggable (terminée / en cours / en pause) : un clic simple ne passe jamais par le
  // mécanisme de glisser, donc on peut l'utiliser directement pour isoler sa commande.
  const staticBar = e.target.closest('.gantt-bar.done, .gantt-bar.running, .gantt-bar.paused, .month-chip[draggable="false"]');
  if(staticBar && staticBar.dataset.cid){ toggleIsolateCommande(staticBar.dataset.cid); return; }
  // Puce de la vue Mois pour une tâche "à faire" volante : elle utilise le glisser HTML5 natif
  // (pas le système de glisser personnalisé des barres Jour/Semaine), donc un simple clic dessus
  // n'est jamais intercepté ailleurs — on peut l'utiliser directement aussi.
  const monthChip = e.target.closest('.month-chip[draggable="true"]');
  if(monthChip && monthChip.dataset.cid){ scheduleIsolate(monthChip.dataset.cid); return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  // Si un champ vient tout juste d'être validé (son traitement est différé d'un instant, voir le
  // gestionnaire 'change'), un clic sur un bouton juste après pourrait s'exécuter AVANT cette mise à
  // jour et lire une valeur pas encore à jour (ex: un nom de profil tout juste tapé). On patiente
  // le temps que ce battement se termine, avant de traiter le clic.
  if(changeProcessingInFlight){
    setTimeout(() => dispatchClickAction(action, el), 0);
    return;
  }

document.addEventListener('pointerdown', (e) => {
  if(e.button === 2) return; // le clic droit ne doit déclencher que le menu contextuel, jamais un glisser
  const bar = e.target.closest('.gantt-bar');
  if(!bar) return;
  if(bar.classList.contains('done') || bar.classList.contains('running') || bar.classList.contains('paused')) return; // seule une tâche "à faire" reste modifiable au glisser
  const handle = e.target.closest('.resize-handle');
  const track = bar.closest('.gantt-track');
  if(!track) return;
  const trackRect = track.getBoundingClientRect();
  const trackWidthPx = trackRect.width;
  const rows = Array.from(document.querySelectorAll('.gantt-row')).map(r=>{
    const rect = r.getBoundingClientRect();
    return { machineId: r.dataset.machineId, top: rect.top, bottom: rect.bottom };
  });
  const origLeft = (parseFloat(bar.style.left)/100) * trackWidthPx;
  const origWidth = (parseFloat(bar.style.width)/100) * trackWidthPx;
  dragCtx = {
    type: handle ? 'resize' : 'move',
    cid: bar.dataset.cid, oid: bar.dataset.oid,
    bar, startClientX: e.clientX, startClientY: e.clientY,
    lastClientX: e.clientX, lastClientY: e.clientY,

const EDGE_ZONE_PX = 36;
const EDGE_HOVER_MS = 550;
function setEdgeGlow(side){
  document.querySelectorAll('.edge-glow').forEach(el => el.classList.remove('active'));
  if(side){
    const el = document.querySelector('.edge-glow.'+side);
    if(el) el.classList.add('active');
  }
}
// Fait "porter" la tâche par un élément flottant indépendant du planning, pour qu'elle survive
// au redessin complet de la page quand on change de jour/semaine — puis on la dépose où on veut.
function beginContinuedDrag(side){
  if(!dragCtx || dragCtx.edgeHoverSide !== side) return; // le curseur a quitté le bord entre-temps : on annule
  const bar = dragCtx.bar;
  const rect = bar.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  const labelEl = bar.querySelector('span');
  ghost.textContent = labelEl ? labelEl.textContent : '';
  ghost.style.left = rect.left+'px';
  ghost.style.top = rect.top+'px';
  ghost.style.width = rect.width+'px';
  ghost.style.height = rect.height+'px';
  ghost.style.background = getComputedStyle(bar).backgroundColor;
  document.body.appendChild(ghost);
  continuedDrag = {
    cid: dragCtx.cid, oid: dragCtx.oid, ghost,
    grabOffsetX: dragCtx.lastClientX - rect.left, grabOffsetY: dragCtx.lastClientY - rect.top,
    edgeHoverSide: null, edgeHoverTimer: null
  };
  setEdgeGlow(null);
  dragCtx = null;
  const dir = side==='left' ? -1 : 1;
  navView(dir); // bascule la vue ; le relais flottant survit au redessin
}
function continueEdgeHop(side){
  if(!continuedDrag || continuedDrag.edgeHoverSide !== side) return;
  setEdgeGlow(null);
  continuedDrag.edgeHoverSide = null;
  if(continuedDrag.edgeHoverTimer) clearTimeout(continuedDrag.edgeHoverTimer);
  continuedDrag.edgeHoverTimer = null;
  navView(side==='left' ? -1 : 1); // permet d'enchaîner plusieurs sauts de suite
}
function cancelContinuedDrag(){
  if(!continuedDrag) return;
  if(continuedDrag.edgeHoverTimer) clearTimeout(continuedDrag.edgeHoverTimer);

document.addEventListener('pointermove', (e) => {
  if(continuedDrag){
    continuedDrag.ghost.style.left = (e.clientX - continuedDrag.grabOffsetX)+'px';
    continuedDrag.ghost.style.top = (e.clientY - continuedDrag.grabOffsetY)+'px';
    const track = document.querySelector('.gantt-track'); // n'importe quelle piste donne les bornes horizontales de la vue actuelle
    if(track){
      const trect = track.getBoundingClientRect();
      const nearLeft = e.clientX <= trect.left + EDGE_ZONE_PX;
      const nearRight = e.clientX >= trect.right - EDGE_ZONE_PX;
      const side = nearLeft ? 'left' : (nearRight ? 'right' : null);
      if(side !== continuedDrag.edgeHoverSide){
        if(continuedDrag.edgeHoverTimer) clearTimeout(continuedDrag.edgeHoverTimer);
        continuedDrag.edgeHoverSide = side;
        setEdgeGlow(side);
        continuedDrag.edgeHoverTimer = side ? setTimeout(() => continueEdgeHop(side), EDGE_HOVER_MS) : null;
      }
    }
    return;
  }
  if(!dragCtx) return;
  dragCtx.lastClientX = e.clientX; dragCtx.lastClientY = e.clientY;
  const dx = e.clientX - dragCtx.startClientX;
  if(Math.abs(dx) > 2) dragCtx.moved = true;
  if(!dragCtx.moved) return; // ignore les micro-mouvements involontaires d'un simple clic
  if(dragCtx.type==='move'){
    dragCtx.currentLeftPx = Math.max(0, dragCtx.origLeft + dx);
    dragCtx.bar.style.left = dragCtx.currentLeftPx+'px';
    const nearLeft = e.clientX <= dragCtx.trackLeft + EDGE_ZONE_PX;
    const nearRight = e.clientX >= dragCtx.trackRight - EDGE_ZONE_PX;

    if(side !== dragCtx.edgeHoverSide){

      dragCtx.edgeHoverSide = side;
      setEdgeGlow(side);

    }
  } else {

    dragCtx.bar.style.width = dragCtx.currentWidthPx+'px';

  if(continuedDrag){
    if(continuedDrag.edgeHoverTimer) clearTimeout(continuedDrag.edgeHoverTimer);
    setEdgeGlow(null);
    const rows = Array.from(document.querySelectorAll('.gantt-row'));
    const hitRow = rows.find(r=>{ const rc=r.getBoundingClientRect(); return e.clientY>=rc.top && e.clientY<=rc.bottom; });
    if(hitRow){
      const track = hitRow.querySelector('.gantt-track');
      const trect = track.getBoundingClientRect();
      let fracX = trect.width>0 ? (e.clientX - trect.left)/trect.width : 0;
      fracX = Math.max(0, Math.min(1, fracX));
      const rawStart = dateFromX(fracX, weekRenderCtx.days);
      const c = state.commandes.find(c=>c.id===continuedDrag.cid);
      const op = c && c.pieces.find(o=>o.id===continuedDrag.oid);
      if(op){
        const newMachineId = hitRow.dataset.machineId;
        const targetCfg = configForPiece({ ...op, machineId: newMachineId }, state);
        const newStart = nextWorkingInstant(rawStart, targetCfg); // calé sur le calendrier du poste ciblé (jamais pendant sa pause)
        op.manualStart = toInputValue(newStart);
        op.machineId = newMachineId;
        propagateFusionGroupFields(op, { manualStart: op.manualStart, machineId: op.machineId });
        commit();
      }
    }
    // sinon : déposée en dehors de toute ligne -> on annule sans rien changer
    continuedDrag.ghost.remove();
    continuedDrag = null;
    return;
  }
  if(!dragCtx) return;
  if(dragCtx.edgeHoverTimer) clearTimeout(dragCtx.edgeHoverTimer);
  setEdgeGlow(null);
  dragCtx.bar.classList.remove('dragging');
  if(!dragCtx.moved){
    if(dragCtx.resizeLabel) dragCtx.resizeLabel.remove();
    const clickedCid = dragCtx.cid, clickedOid = dragCtx.oid; dragCtx = null;
    // Une barre fusionnée ouvre le détail du regroupement plutôt que d'isoler une seule commande
    // (qui n'aurait de sens que pour l'un des membres du groupe).
    const loc = findPieceLocation(clickedOid);
    const clickedPiece = loc ? state.commandes.find(c=>c.id===loc.cid).pieces.find(o=>o.id===loc.oid) : null;
    if(clickedPiece && clickedPiece.fusionGroupId){ scheduleFusionDetail(clickedPiece.fusionGroupId); return; }
    scheduleIsolate(clickedCid); return; // simple clic sans glisser réel : isole la commande (différé, pour laisser filtrer un éventuel double-clic)
  }
  const c = state.commandes.find(c=>c.id===dragCtx.cid);
  const op = c && c.pieces.find(o=>o.id===dragCtx.oid);
  if(op){
    if(dragCtx.type==='move'){
      if(dragCtx.resizeLabel) dragCtx.resizeLabel.remove();
      const fracX = dragCtx.currentLeftPx / dragCtx.trackWidthPx;
      const rawStart = dateFromX(fracX, weekRenderCtx.days);
      let newMachineId = op.machineId;
      const hitRow = dragCtx.rows.find(r => e.clientY >= r.top && e.clientY <= r.bottom);
      if(hitRow) newMachineId = hitRow.machineId;
      const targetCfg = configForPiece({ ...op, machineId: newMachineId }, state);
      const newStart = nextWorkingInstant(rawStart, targetCfg); // calé sur le calendrier du poste ciblé (jamais pendant sa pause)
      op.manualStart = toInputValue(newStart);
      op.machineId = newMachineId;
      propagateFusionGroupFields(op, { manualStart: op.manualStart, machineId: op.machineId });
    } else {
      const fracEndX = (dragCtx.origLeft+dragCtx.currentWidthPx) / dragCtx.trackWidthPx;
      const newEnd = dateFromX(fracEndX, weekRenderCtx.days);
      const startDate = new Date(dragCtx.bar.dataset.start);
      const targetCfg = configForPiece(op, state);
      let newDur = workingHoursBetween(startDate, newEnd, targetCfg);
      if(newDur < 0.25) newDur = 0.25;
      newDur = Math.round(newDur*4)/4; // arrondi au quart d'heure
      if(op.fusionGroupId){
        // pièce fusionnée : la durée saisie s'applique telle quelle à tout le groupe (durée partagée),
        // pas de recalcul de temps unitaire individuel qui romprait la synchronisation.
        op.dureeOverrideH = newDur;
        propagateFusionGroupFields(op, { dureeOverrideH: newDur });
      } else {
        if(op.quantite > 0) op.tempsUnitaire = (newDur*60) / op.quantite; // le temps unitaire se recalcule automatiquement
        op.dureeOverrideH = null;
      }
      // Laisse l'étiquette affichée un court instant après le relâchement, en confirmation, avant de la retirer.
      if(dragCtx.resizeLabel){
        const lbl = dragCtx.resizeLabel;
        lbl.textContent = `Nouvelle durée : ${durationLabel(newDur)} ✓`;
        lbl.classList.add('confirmed');
        setTimeout(() => lbl.remove(), 1800);
      }
    }
    commit();
  } else if(dragCtx.resizeLabel){
    dragCtx.resizeLabel.remove();
  }
  dragCtx = null;
});
document.addEventListener('dblclick', (e) => {
  const el = e.target.closest('.gantt-bar') || e.target.closest('.month-chip');
  if(!el || el.classList.contains('done') || el.classList.contains('running') || el.classList.contains('paused')) return;
  cancelScheduledIsolate(); // annule l'isolement en attente déclenché par le premier clic du double-clic
  resetOpOverride(el.dataset.cid, el.dataset.oid);
});

/* ---------------- glisser-déposer (vue mois) ---------------- */
document.addEventListener('dragstart', (e) => {
  const chip = e.target.closest('.month-chip');
  if(!chip) return;
  e.dataTransfer.setData('text/plain', JSON.stringify({ cid: chip.dataset.cid, oid: chip.dataset.oid, time: chip.dataset.time }));
  e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', (e) => {
  const cell = e.target.closest('.month-daycell');
  if(!cell) return;
  e.preventDefault();
  cell.classList.add('drop-hover');
});
document.addEventListener('dragleave', (e) => {
  const cell = e.target.closest('.month-daycell');
  if(cell) cell.classList.remove('drop-hover');
});
document.addEventListener('drop', (e) => {
  const cell = e.target.closest('.month-daycell');
  if(!cell) return;
  e.preventDefault();
  cell.classList.remove('drop-hover');
  let data;
  try{ data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch(err){ return; }
  const c = state.commandes.find(c=>c.id===data.cid);
  const op = c && c.pieces.find(o=>o.id===data.oid);
  if(!op) return;
  const cfg = state.config;
  const [hh,mm] = (data.time||'08:00').split(':').map(Number);
  const newStart = new Date(cell.dataset.date+'T'+pad(hh)+':'+pad(mm));
  op.manualStart = toInputValue(nextWorkingInstant(newStart, cfg));
  propagateFusionGroupFields(op, { manualStart: op.manualStart });
  commit();
});

document.addEventListener('input', (e) => {
  // Le formulaire "Nouvelle commande" est mémorisé au fil de la frappe (et non seulement en sortant
  // du champ) : ainsi, même si la page se redessine pour une raison quelconque, le texte déjà tapé
  // est conservé. Pas de render() ici — l'affichage est déjà à jour, l'utilisateur tape dedans.
  const draftEl = e.target.closest ? e.target.closest('[data-action="draft-field"], [data-action="draft-op"]') : null;
  if(draftEl && draft){
    if(draftEl.dataset.action === 'draft-field'){
      draft[draftEl.dataset.field] = draftEl.value;
    } else {
      const idx = Number(draftEl.dataset.idx);
      if(draft.pieces && draft.pieces[idx]) draft.pieces[idx][draftEl.dataset.field] = draftEl.value;
    }
    return;
  }
  if(e.target.id === 'commande-search-input'){
    searchQuery = e.target.value;
    if(searchQuery) selectedCommandeId = null; // évite de cumuler recherche et sélection manuelle
    if(searchQuery) maybeJumpToHighlight();
    render();
    const el = document.getElementById('commande-search-input');
    if(el){ el.focus(); const pos = el.value.length; el.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && showSettingsModal){ closeSettingsModal(); }
  if(e.key === 'Escape' && excelImportResult){ excelImportResult = null; render(); }
  if(e.key === 'Escape' && continuedDrag){ cancelContinuedDrag(); }
});

/* ---------------- init ---------------- */
function scheduleNextPoll(){
  const sec = (state && state.config && state.config.syncIntervalSec) || 4;
  const ms = Math.max(2000, Math.round(sec*1000)); // jamais moins de 2s, pour ne pas surcharger le serveur
  setTimeout(async () => {
    await pollRemoteState();
    scheduleNextPoll(); // se replanifie avec la valeur actuelle du réglage à chaque cycle
  }, ms);
}
let currentUsername = null;
let currentUser = null; // { id, username, role }

// Identité visuelle récupérée avant connexion (route publique) — mémorisée pour que l'écran de
// connexion puisse l'afficher sans attendre, y compris après une déconnexion.
let loginBranding = { appTitle: null, logoDataUrl: null, copyright: '' };
async function loadLoginBranding(){
  try{
    const res = await fetch('/api/branding');
    if(!res.ok) return;
    loginBranding = await res.json();
    // Si l'écran de connexion est déjà affiché, on le redessine avec le logo une fois reçu.
    if(document.querySelector('.login-screen')) renderLoginScreen(document.querySelector('.login-error')?.textContent || '');
  }catch(e){ /* sans logo, l'écran reste parfaitement utilisable */ }
}
function renderLoginScreen(errorMsg){
  const cfg = (state && state.config) ? state.config : {};
  const title = cfg.appTitle || loginBranding.appTitle || 'Planning Atelier';
  const logo = cfg.logoDataUrl || loginBranding.logoDataUrl || '';
  const copyright = cfg.copyright || loginBranding.copyright || '';
  document.getElementById('app').innerHTML = `
  <div class="login-screen">
    <div class="login-box">
      ${logo ? `<img src="${escapeHtml(logo)}" alt="" class="login-logo">` : ''}
      <h1 class="login-title">${escapeHtml(title)}</h1>
      <div class="login-sub">Connexion requise</div>
      ${errorMsg ? `<div class="login-error">${escapeHtml(errorMsg)}</div>` : ''}
      <form id="login-form">
        <label class="field">Identifiant</label>
        <input type="text" id="login-username" autocomplete="username" required autofocus>
        <label class="field" style="margin-top:10px;">Mot de passe</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
        <button type="submit" class="primary" style="width:100%; margin-top:16px; padding:10px;">Se connecter</button>
      </form>
      <button class="ghost small" style="width:100%; margin-top:10px;" data-action="show-forgot-password">Mot de passe oublié ?</button>
      ${copyright ? `<div class="login-copyright">${escapeHtml(copyright)}</div>` : ''}
    </div>
  </div>`;
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    try{
      const res = await fetch('/api/login', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const json = await res.json();
      if(res.ok && json.ok){
        currentUsername = json.username;
        currentUser = { id: json.userId, username: json.username, role: json.role };
        startApp();
      } else {
        renderLoginScreen(json.error || 'Connexion refusée.');
      }
    }catch(err){
      renderLoginScreen("Impossible de contacter le serveur.");
    }
  });
  const forgotBtn = document.querySelector('[data-action="show-forgot-password"]');
  if(forgotBtn) forgotBtn.addEventListener('click', () => renderForgotPasswordScreen());
}

function renderForgotPasswordScreen(infoMsg){
  document.getElementById('app').innerHTML = `
  <div class="login-screen">
    <div class="login-box">
      <h1 class="login-title">Mot de passe oublié</h1>
      <div class="login-sub">Un lien de réinitialisation vous sera envoyé par e-mail, si une adresse est enregistrée sur votre compte.</div>
      ${infoMsg ? `<div class="login-info">${escapeHtml(infoMsg)}</div>` : ''}
      <form id="forgot-form">
        <label class="field">Identifiant</label>
        <input type="text" id="forgot-username" autocomplete="username" required autofocus>
        <button type="submit" class="primary" style="width:100%; margin-top:16px; padding:10px;">Envoyer le lien</button>
      </form>
      <button class="ghost small" style="width:100%; margin-top:10px;" data-action="back-to-login">← Retour à la connexion</button>
    </div>
  </div>`;
  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('forgot-username').value;
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Envoi en cours…';
    try{
      const res = await fetch('/api/forgot-password', {
        method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      const json = await res.json();
      renderForgotPasswordScreen(json.message || "Si ce compte existe, un lien vient d'être envoyé.");
    }catch(err){
      renderForgotPasswordScreen("Impossible de contacter le serveur.");
    }
  });
  const backBtn = document.querySelector('[data-action="back-to-login"]');
  if(backBtn) backBtn.addEventListener('click', () => renderLoginScreen());
}

function renderResetPasswordScreen(token, errorMsg){
  document.getElementById('app').innerHTML = `
  <div class="login-screen">
    <div class="login-box">
      <h1 class="login-title">Nouveau mot de passe</h1>
      <div class="login-sub">Choisissez un nouveau mot de passe (8 caractères minimum).</div>
      ${errorMsg ? `<div class="login-error">${escapeHtml(errorMsg)}</div>` : ''}
      <form id="reset-form">
        <label class="field">Nouveau mot de passe</label>
        <input type="password" id="reset-password" autocomplete="new-password" required minlength="8">
        <label class="field" style="margin-top:10px;">Confirmer le mot de passe</label>
        <input type="password" id="reset-password-confirm" autocomplete="new-password" required minlength="8">
        <button type="submit" class="primary" style="width:100%; margin-top:16px; padding:10px;">Valider</button>
      </form>
    </div>
  </div>`;
  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwd = document.getElementById('reset-password').value;
    const pwd2 = document.getElementById('reset-password-confirm').value;
    if(pwd !== pwd2){ renderResetPasswordScreen(token, 'Les deux mots de passe ne correspondent pas.'); return; }
    if(pwd.length < 8){ renderResetPasswordScreen(token, 'Le mot de passe doit contenir au moins 8 caractères.'); return; }
    try{
      const res = await fetch('/api/reset-password', {
        method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pwd })
      });
      const json = await res.json();
      if(!res.ok){ renderResetPasswordScreen(token, json.error || 'Impossible de réinitialiser ce mot de passe.'); return; }
      // Nettoie le jeton de l'URL pour ne pas le laisser traîner dans l'historique du navigateur.
      window.history.replaceState({}, '', window.location.pathname);
      renderLoginScreen(`Mot de passe modifié pour "${json.username}" — vous pouvez vous connecter.`);
    }catch(err){
      renderResetPasswordScreen(token, "Impossible de contacter le serveur.");
    }
  });
}

// Page de confirmation d'un congé attribué par un administrateur, accessible via le lien reçu par
// e-mail — aucune connexion requise. La décision (accepter/refuser) exige toujours un vrai clic sur
// un bouton : jamais une action automatique au simple chargement de la page, pour ne pas risquer
// qu'un antivirus ou un scanner de sécurité qui pré-charge les liens d'un e-mail ne déclenche la
// décision à la place de la personne.
async function renderLeaveConfirmScreen(token){
  document.getElementById('app').innerHTML = `
  <div class="login-screen"><div class="login-box"><div class="login-sub">Chargement…</div></div></div>`;
  let info;
  try{
    const res = await fetch('/api/leave-confirm-info/'+token);
    info = await res.json();
    if(!res.ok) throw new Error(info.error || 'Lien invalide.');
  }catch(err){
    document.getElementById('app').innerHTML = `
    <div class="login-screen"><div class="login-box">
      <h1 class="login-title">Lien invalide</h1>
      <div class="login-error">${escapeHtml(err.message || "Ce lien n'est plus valide.")}</div>
    </div></div>`;
    return;
  }
  document.getElementById('app').innerHTML = `
  <div class="login-screen"><div class="login-box">
    <h1 class="login-title">Congé proposé</h1>
    <div class="login-sub">Bonjour ${escapeHtml(info.username)}, un administrateur vous propose ce congé :</div>
    <div class="leave-confirm-banner" style="margin-top:14px;">
      <strong>${escapeHtml(info.typeNom)}</strong><br>
      Du <strong>${escapeHtml(formatDateFr(info.debut))}</strong> au <strong>${escapeHtml(formatDateFr(info.fin))}</strong>${info.motif?`<br>Motif : ${escapeHtml(info.motif)}`:''}
    </div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="primary" id="leave-confirm-accept" style="flex:1; padding:10px;">✅ Oui, j'accepte</button>
      <button class="danger-ghost" id="leave-confirm-refuse" style="flex:1; padding:10px;">❌ Non, je refuse</button>
    </div>
  </div></div>`;
  const act = async (decision) => {
    document.getElementById('leave-confirm-accept').disabled = true;
    document.getElementById('leave-confirm-refuse').disabled = true;
    try{
      const res = await fetch('/api/leave-confirm', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token, decision })
      });
      const json = await res.json();
      window.history.replaceState({}, '', window.location.pathname);
      if(!res.ok){
        document.getElementById('app').innerHTML = `<div class="login-screen"><div class="login-box"><h1 class="login-title">Erreur</h1><div class="login-error">${escapeHtml(json.error||'Impossible de traiter cette confirmation.')}</div></div></div>`;
        return;
      }
      const msg = decision==='accept'
        ? `Congé "${escapeHtml(json.typeNom)}" accepté — merci !`
        : `Congé "${escapeHtml(json.typeNom)}" refusé.`;
      document.getElementById('app').innerHTML = `<div class="login-screen"><div class="login-box"><h1 class="login-title">C'est noté</h1><div class="login-info">${msg}</div></div></div>`;
    }catch(err){
      document.getElementById('leave-confirm-accept').disabled = false;
      document.getElementById('leave-confirm-refuse').disabled = false;
      alert("Impossible de contacter le serveur.");
    }
  };
  document.getElementById('leave-confirm-accept').addEventListener('click', () => act('accept'));
  document.getElementById('leave-confirm-refuse').addEventListener('click', () => act('refuse'));
}

async function logout(){
  try{ await fetch('/api/logout', { method:'POST', credentials:'include' }); }catch(e){}
  currentUsername = null;
  currentUser = null;
  state = null;
  renderLoginScreen();
}

async function startApp(){
  loadLoginBranding(); // en tâche de fond : alimente l'écran de connexion si la session a expiré
  loadSettingsUIPrefs();
  loadDoneFilterPref();
  loadKanbanDoneLimitPref();
  loadKanbanMachineFilters();
  loadKanbanGroupedViewPref();
  loadPanelCollapsePref();
  loadColumnsRatioPref();
  state = await loadState();
  draft = newDraft();
  loadUsersList(); // nécessaire pour le sélecteur d'opérateur, pas seulement pour la pop-up Paramètres
  if(applyAutoPauseResume(state)) silentSave(); // rattrape le cas où la page est ouverte en pleine pause déjeuner
  if(justRanImplicitDepsMigration) silentSave(); // fige la migration des dépendances implicites côté serveur, pour tous les postes
  render();
  setInterval(() => {
    // Mêmes précautions que pollRemoteState : un redessin ici ne doit jamais couper une saisie en
    // cours (ce timer tourne toutes les 60s, y compris pendant qu'on tape dans n'importe quel champ
    // de l'appli, pas seulement dans la pop-up Paramètres).
    if(showSettingsModal || isTypingInField() || dragCtx || changeProcessingInFlight) return;
    const changed = applyAutoPauseResume(state);
    render(); // rafraîchit aussi l'horloge / l'indicateur de poste
    if(changed) silentSave();
  }, 60000);
  scheduleNextPoll(); // récupère les modifications des autres utilisateurs
}

(async function init(){
  const urlParams = new URLSearchParams(window.location.search);
  const resetToken = urlParams.get('reset');
  if(resetToken){
    renderResetPasswordScreen(resetToken);
    return; // pas besoin de vérifier la session : ce lien fonctionne même sans être connecté
  }
  const leaveConfirmToken = urlParams.get('leave-confirm');
  if(leaveConfirmToken){
    renderLeaveConfirmScreen(leaveConfirmToken);
    return; // idem : accessible sans connexion
  }
  try{
    const res = await fetch('/api/session', { credentials: 'include' });
    const json = await res.json();
    if(json.authenticated){
      currentUsername = json.username;
      currentUser = { id: json.userId, username: json.username, role: json.role };
      startApp();
    } else {
      renderLoginScreen();
    }
  }catch(e){
    renderLoginScreen("Impossible de contacter le serveur.");
  }
})();
</script>
