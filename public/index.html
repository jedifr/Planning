let syncStatus = 'ok'; // 'ok' | 'saving' | 'error' | 'conflict'
let lastSyncAt = null;

/* ---------------- persistence (API + base de données serveur) ---------------- */
function migrateState(st){
  if(!st.config) st.config = { ...DEFAULT_CONFIG };
  if(st.config.pauseActive === undefined) st.config.pauseActive = DEFAULT_CONFIG.pauseActive;
  if(!st.config.pauseDebut) st.config.pauseDebut = DEFAULT_CONFIG.pauseDebut;
  if(!st.config.pauseFin) st.config.pauseFin = DEFAULT_CONFIG.pauseFin;
  if(!st.config.backup) st.config.backup = { destinataire:'', motDePasse:'', heure:'02:00', actif:false, dernierEnvoi:null };
  if(!st.config.urgencyColors) st.config.urgencyColors = { importante:'#a06d1a', urgente:'#b23a30' };
  if(st.config.logoDataUrl === undefined) st.config.logoDataUrl = null;
  if(!st.config.appTitle) st.config.appTitle = 'Planning Atelier';
  if(!st.config.accentColor) st.config.accentColor = '#d9531e';
  if(!st.config.density) st.config.density = 'confortable';
  if(st.config.faviconDataUrl === undefined) st.config.faviconDataUrl = null;
  if(!st.config.syncIntervalSec) st.config.syncIntervalSec = 4;
  if(!st.machines) st.machines = [];
  st.machines.forEach((m,i) => {
    if(m.horairesActifs === undefined) m.horairesActifs = false;
    if(!m.horaires) m.horaires = { ...DEFAULT_CONFIG };
    if(!m.couleur) m.couleur = MACHINE_COLORS[i%MACHINE_COLORS.length];
    if(!Array.isArray(m.indisponibilites)) m.indisponibilites = [];
    if(m.fusionnable === undefined) m.fusionnable = false;
    // Temps de transfert : exprimés en MINUTES (plus lisibles à l'usage que des fractions d'heure).
    // Conversion automatique depuis l'ancien réglage en heures, s'il avait été renseigné.
    if(m.transfertFixeMin === undefined) m.transfertFixeMin = (Number(m.transfertFixeH) || 0) * 60;
    if(m.transfertParPieceMin === undefined) m.transfertParPieceMin = (Number(m.transfertParPieceH) || 0) * 60;
    delete m.transfertFixeH; delete m.transfertParPieceH;
  });
  if(!st.config.margeEcheanceJours && st.config.margeEcheanceJours !== 0) st.config.margeEcheanceJours = 0;
  if(!st.userMachines) st.userMachines = {}; // { [userId]: [machineId, ...] } — lien plusieurs-à-plusieurs
  if(!st.userLunch) st.userLunch = {}; // { [userId]: {pauseActive, pauses:[{id,debut,fin}]} } — pause(s) propre(s) à la personne, affecte(nt) réellement le calcul
  Object.keys(st.userLunch).forEach(uid_ => {
    const lunch = st.userLunch[uid_];
    if(!Array.isArray(lunch.pauses)){
      // Ancien format à une seule pause (pauseDebut/pauseFin) : reprise comme première (et pour
      // l'instant unique) pause de la personne, une seule fois.
      lunch.pauses = (lunch.pauseDebut && lunch.pauseFin) ? [{ id: uid('pause'), debut: lunch.pauseDebut, fin: lunch.pauseFin }] : [];
      delete lunch.pauseDebut;
      delete lunch.pauseFin;
    }
  });
  if(!st.config.modules) st.config.modules = { conges: true }; // interrupteur du module Congés
  if(st.config.matiereFusionActive === undefined) st.config.matiereFusionActive = false; // détection par matière/épaisseur désactivée par défaut
  if(st.config.copyright === undefined) st.config.copyright = ''; // mention de l'écran de connexion
  if(!st.leaveTypes) st.leaveTypes = [
    { id:'lt-cp', nom:'Congés payés', couleur:'#4c8fbd' },
    { id:'lt-rtt', nom:'RTT', couleur:'#a06d1a' }
  ];
  if(!st.userLeaveAllocations) st.userLeaveAllocations = {}; // { [userId]: { [typeId]: joursParAn } }
  if(!st.leaveRequests) st.leaveRequests = []; // [{id, userId, typeId, debut, fin, motif, statut, demandeLe, traiteParUserId, traiteLe, commentaireValidation}]
  // Migration ponctuelle : l'ancienne liste de congés (purement informative) devient des demandes
  // déjà approuvées, pour ne perdre aucune donnée déjà saisie et ne rien changer au comportement
  // du blocage automatique des postes qui en dépendait déjà.
  if(!st.config._leaveRequestsMigrated){
    if(st.userLeaves){
      Object.keys(st.userLeaves).forEach(userId => {
        (st.userLeaves[userId]||[]).forEach(p => {
          st.leaveRequests.push({
            id: p.id || uid('conge'), userId, typeId: 'lt-cp', debut: p.debut, fin: p.fin,
            motif: p.motif || '', statut: 'approuve', demandeLe: new Date().toISOString(),
            traiteParUserId: null, traiteLe: new Date().toISOString(), commentaireValidation: ''
          });
        });
      });
    }
    st.config._leaveRequestsMigrated = true;
  }
  if(!st.commandes) st.commandes = [];
  // Migration ponctuelle (une seule fois) : l'ancien moteur faisait implicitement dépendre
  // chaque pièce sans dépendance choisie de la précédente dans la liste, même sur une autre
  // machine — ce qui créait des "trous" de planning inattendus. On fige ce comportement
  // existant dans les données pour ne rien changer aux plannings déjà en place, puis on
  // arrête cette logique implicite pour de bon : à partir de maintenant, aucune dépendance
  // choisie = aucune contrainte, la pièce démarre dès que sa machine est libre.
  if(!st.config._implicitDepsMigrated){
    st.commandes.forEach(c => {
      (c.pieces||[]).forEach((p, idx) => {
        const hasExplicit = Array.isArray(p.dependances) && p.dependances.length > 0;
        if(!hasExplicit && idx > 0) p.dependances = [c.pieces[idx-1].id];
      });
    });
    st.config._implicitDepsMigrated = true;
  }
  // Migration ponctuelle (une seule fois) : la notion de dépendances (choix libre parmi les
  // autres pièces) est remplacée par un simple numéro de phase, plus simple à utiliser. On
  // convertit le graphe de dépendances existant en numéros de phase équivalents (phase =
  // 1 + la phase la plus élevée parmi ses dépendances), pour ne rien changer aux plannings
  // déjà en place.
  if(!st.config._phaseMigrated){
    st.commandes.forEach(c => {
      const depsOf = {};
      (c.pieces||[]).forEach(p => { depsOf[p.id] = Array.isArray(p.dependances) ? p.dependances : []; });
      const cache = {};
      function computePhase(id, guard){
        if(cache[id] !== undefined) return cache[id];
        if(guard > 200) return 1; // sécurité anti-boucle en cas de cycle résiduel
        const deps = depsOf[id] || [];
        if(deps.length === 0){ cache[id] = 1; return 1; }
        let maxDepPhase = 0;
        deps.forEach(depId => { if(depsOf[depId] !== undefined) maxDepPhase = Math.max(maxDepPhase, computePhase(depId, guard+1)); });
        const val = maxDepPhase + 1;
        cache[id] = val;
        return val;
      }
      (c.pieces||[]).forEach(p => { p.phase = computePhase(p.id, 0); });
    });
    st.config._phaseMigrated = true;
  }
  st.commandes.forEach(c => {
    if(!c.pieces) c.pieces = [];
    if(!c.urgence) c.urgence = 'normale';
    c.pieces.forEach(o => {
      if(o.manualStart === undefined) o.manualStart = null;
      if(o.dureeOverrideH === undefined) o.dureeOverrideH = null;
      if(o.debutReel === undefined) o.debutReel = null;
      if(o.finReel === undefined) o.finReel = null;
      if(!o.sessions) o.sessions = [];
      if(o.autoPaused === undefined) o.autoPaused = false;
      if(!Array.isArray(o.dependances)) o.dependances = [];
      if(o.phase === undefined || o.phase === null || isNaN(Number(o.phase))) o.phase = 1;
      if(o.tempsUnitaireTheorique === undefined || o.tempsUnitaireTheorique === null) o.tempsUnitaireTheorique = o.tempsUnitaire; // référence figée une seule fois (migration : valeur actuelle prise comme référence)
      if(o.operatorUserId === undefined) o.operatorUserId = null;
      if(o.dateDebutPossible === undefined) o.dateDebutPossible = null;
      if(o.sousTraitance === undefined) o.sousTraitance = false;
      if(o.matiere === undefined) o.matiere = '';
      if(o.epaisseur === undefined) o.epaisseur = '';
      if(o.fusionGroupId === undefined) o.fusionGroupId = null;
      if(o.dureeReelleH === undefined) o.dureeReelleH = null; // temps réellement passé (secours quand aucune session n'existe) — voir applySingleStatusChange
    });
  });
  if(!st.importProfiles) st.importProfiles = []; // profils de correspondance de colonnes pour l'import personnalisé (autres logiciels)
  return st;
}
async function loadState(){
  try{
    const res = await fetch('/api/state', { credentials: 'include' });
    if(res.status === 401){ renderLoginScreen('Votre session a expiré — reconnectez-vous.'); throw new Error('401'); }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    stateVersion = json.version;
    lastSyncAt = new Date();
    const wasAlreadyMigrated = !!(json.data && json.data.config && json.data.config._implicitDepsMigrated);
    const wasPhaseMigrated = !!(json.data && json.data.config && json.data.config._phaseMigrated);
    const migrated = migrateState(json.data);
    justRanImplicitDepsMigration = !wasAlreadyMigrated || !wasPhaseMigrated;
    return migrated;
  }catch(e){
    console.error('Impossible de contacter le serveur', e);
    syncStatus = 'error';
    return migrateState(defaultState());
  }
}
async function saveState(){
  syncStatus = 'saving';
  try{
    const res = await fetch('/api/state', {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: state, expectedVersion: stateVersion })
    });
    if(res.status === 401){ renderLoginScreen('Votre session a expiré — reconnectez-vous.'); return; }
    if(res.status === 409){
      const json = await res.json();
      syncStatus = 'conflict';
      alert("Quelqu'un d'autre vient de modifier le planning entre-temps. Votre dernière action n'a pas été enregistrée — la version la plus récente va être rechargée.");
      state = migrateState(json.data);
      stateVersion = json.version;
      lastSyncAt = new Date();
      render();
      return;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    stateVersion = json.version;
    syncStatus = 'ok';
    lastSyncAt = new Date();
  }catch(e){
    console.error('Erreur de sauvegarde', e);
    syncStatus = 'error';
    render();
  }
}
// Sauvegarde "intelligente" pour les actions où perdre l'information en cas de conflit serait
// dommage (ex. création d'une nouvelle commande) : si quelqu'un d'autre a sauvegardé entre-temps,
// on ne l'écrase pas et on ne l'abandonne pas non plus — on rejoue la même action sur la version
// fraîche du serveur, puis on retente. `applyFn(cibleState)` doit appliquer EXACTEMENT la même
// modification (mêmes identifiants, mêmes valeurs) sur l'état qu'on lui donne, pour que rejouer sur
// une version différente produise un résultat cohérent plutôt que des identifiants différents à
// chaque tentative.
async function saveStateWithReapply(applyFn, maxRetries){
  let attempt = 0;
  while(true){
    syncStatus = 'saving';
    try{
      const res = await fetch('/api/state', {
        method: 'PUT', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: state, expectedVersion: stateVersion })
      });
      if(res.status === 401){ renderLoginScreen('Votre session a expiré — reconnectez-vous.'); return; }
      if(res.status === 409){
        const json = await res.json();
        attempt++;
        if(attempt > maxRetries){
          syncStatus = 'conflict';
          alert("Quelqu'un d'autre modifie le planning en même temps que vous, et votre action n'a malgré tout pas pu être réappliquée automatiquement après plusieurs tentatives. Merci de vérifier ci-dessous si elle est bien présente, et de la resaisir sinon.");
          state = migrateState(json.data);
          stateVersion = json.version;
          lastSyncAt = new Date();
          render();
          return;
        }
        // On repart de la version fraîche du serveur, on y rejoue la même action, puis on retente.
        const freshState = migrateState(json.data);
        applyFn(freshState);
        state = freshState;
        stateVersion = json.version;
        continue;
      }
      if(!res.ok) throw new Error('HTTP '+res.status);
      const json = await res.json();
      stateVersion = json.version;
      syncStatus = 'ok';
      lastSyncAt = new Date();
      render();
      return;
    }catch(e){
      console.error('Erreur de sauvegarde', e);
      syncStatus = 'error';
      render();
      return;
    }
  }
}
// Variante silencieuse pour les changements déclenchés automatiquement (pas par un clic de l'utilisateur) :
// en cas de conflit, on recharge simplement la version la plus récente sans interrompre l'utilisateur avec une alerte.
async function silentSave(){
  try{
    const res = await fetch('/api/state', {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: state, expectedVersion: stateVersion })
    });
    if(res.status === 401) return; // session expirée : la prochaine action de l'utilisateur le détectera
    if(res.status === 409){
      const json = await res.json();
      state = migrateState(json.data);
      stateVersion = json.version;
      lastSyncAt = new Date();
      // Même précaution que pollRemoteState : silentSave() est déclenché en tâche de fond (auto-pause
      // déjeuner, migration...), potentiellement pendant qu'un champ est en cours de saisie ailleurs
      // dans l'appli — ne jamais le couper pour ça, le prochain redessin naturel suffira.
      if(!(isTypingInField() || dragCtx || showSettingsModal || changeProcessingInFlight)) render();
      return;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    stateVersion = json.version;
    syncStatus = 'ok';
    lastSyncAt = new Date();
  }catch(e){
    console.error('Erreur de sauvegarde automatique', e);
  }
}
function closeSettingsModal(){
  showSettingsModal = false;
  render();
  pollRemoteState(); // rattrape immédiatement les changements éventuels des autres postes, sans attendre le prochain cycle
}
async function pollRemoteState(){
  if(dragCtx) return; // ne pas interrompre un glisser en cours
  if(showSettingsModal) return; // ne pas écraser une saisie en cours dans la pop-up Paramètres
  if(changeProcessingInFlight) return; // un champ vient d'être validé, son traitement différé n'a pas encore eu lieu
  if(isTypingInField()) return; // ne pas couper une saisie en cours
  try{
    const res = await fetch('/api/state', { credentials: 'include' });
    if(res.status === 401) return; // session expirée : la prochaine action de l'utilisateur le détectera
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    // Re-vérification APRÈS l'attente réseau : l'utilisateur a pu cliquer dans un champ et commencer
    // à taper pendant l'aller-retour. Redessiner à ce moment-là recrée le champ et efface ce qui
    // vient d'être saisi — c'est la cause du champ "Référence" qui se vidait aléatoirement.
    if(isTypingInField() || dragCtx || showSettingsModal || changeProcessingInFlight) return;
    if(json.version !== stateVersion){
      state = migrateState(json.data);
      stateVersion = json.version;
      syncStatus = 'ok';
      lastSyncAt = new Date();
      render();
    }
  }catch(e){
    syncStatus = 'error';
    if(!isTypingInField()) render(); // même précaution en cas d'erreur réseau
  }
}
// Vrai si l'utilisateur a le curseur dans un champ de saisie : dans ce cas, aucun redessin
// automatique ne doit avoir lieu, sous peine de perdre le texte en cours de frappe.
function isTypingInField(){
  const active = document.activeElement;
  return !!(active && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName));
}

/* ---------------- date / calendrier de travail ---------------- */
function pad(n){ return String(n).padStart(2,'0'); }
function toInputValue(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toDateInputValue(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
// Convertit une date stockée au format AAAA-MM-JJ en JJ/MM/AAAA pour l'affichage — le stockage et
// les champs <input type="date"> restent en AAAA-MM-JJ (format non ambigu), seul l'affichage change.
function formatDateFr(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function nextDayStart(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+1, 0,0,0,0); }
function prevDayMarker(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()-1, 23,59,0,0); }
function dayHoursFor(dow, cfg){ return dow===5 ? cfg.friHours : cfg.monThuHours; }
function dayStartFor(d, cfg){ return new Date(d.getFullYear(), d.getMonth(), d.getDate(), cfg.startHour, cfg.startMinute, 0, 0); }
function startOfWeek(d){ const dow=d.getDay(); const diff = dow===0 ? -6 : 1-dow; return new Date(d.getFullYear(), d.getMonth(), d.getDate()+diff); }

// Toutes les pauses effectives pour ce cfg à cette date, triées et fusionnées si elles se chevauchent
// (protège contre une saisie d'horaires qui se recouvrent par erreur). cfg.pauses (tableau
// {debut,fin}) prime s'il est présent et non vide — c'est le cas d'une personne ayant plusieurs
// pauses (déjeuner + pause l'après-midi, par ex.) ; sinon on retombe sur l'ancien format à une
// seule pause (pauseActive/pauseDebut/pauseFin), utilisé par la config globale et les horaires de poste.
function pauseWindowsFor(date, cfg){
  const defs = (cfg.pauses && cfg.pauses.length) ? cfg.pauses
    : (cfg.pauseActive && cfg.pauseDebut && cfg.pauseFin ? [{ debut: cfg.pauseDebut, fin: cfg.pauseFin }] : []);
  const raw = [];
  defs.forEach(p => {
    if(!p.debut || !p.fin) return;
    const [ph,pm] = p.debut.split(':').map(Number);
    const [qh,qm] = p.fin.split(':').map(Number);
    if(isNaN(ph) || isNaN(qh)) return;
    const start = new Date(date.getFullYear(), date.getMonth(), date.getDate(), ph, pm||0, 0, 0);
    const end = new Date(date.getFullYear(), date.getMonth(), date.getDate(), qh, qm||0, 0, 0);
    if(end > start) raw.push({ start, end });
  });
  raw.sort((a,b) => a.start - b.start);
  const merged = [];
  raw.forEach(w => {
    const last = merged[merged.length-1];
    if(last && w.start <= last.end){ if(w.end > last.end) last.end = w.end; }
    else merged.push({ start: w.start, end: w.end });
  });
  return merged;
}
// Pause active à cet instant précis, s'il y en a une (pour l'auto-pause des tâches en cours).
function pauseWindowFor(date, cfg){
  return pauseWindowsFor(date, cfg).find(w => date >= w.start && date < w.end) || null;
}
// Segments de travail d'une journée (1 segment, ou plus si une ou plusieurs pauses la traversent).
// La journée est automatiquement prolongée de la durée totale des pauses pour que le total
// d'heures travaillées reste bien égal à monThuHours / friHours.
function dayIntervals(date, cfg){
  const dow = date.getDay();
  const dh = dayHoursFor(dow, cfg);
  const dStart = dayStartFor(date, cfg);
  const nominalEnd = new Date(dStart.getTime() + dh*3600000);
  const pauses = pauseWindowsFor(date, cfg).filter(p => p.end > dStart && p.start < nominalEnd);
  if(!pauses.length) return [[dStart, nominalEnd]];
  let dEnd = new Date(nominalEnd.getTime() + pauses.reduce((s,p) => s + (p.end.getTime()-p.start.getTime()), 0));
  let cursor = dStart;
  const segs = [];
  pauses.forEach(pause => {
    const pStart = pause.start < cursor ? cursor : pause.start;
    const pauseMs = pause.end.getTime() - pause.start.getTime();
    const pEnd = new Date(pStart.getTime() + pauseMs);
    if(pStart > cursor) segs.push([new Date(cursor.getTime()), pStart]);
    cursor = pEnd;
  });
  if(cursor < dEnd) segs.push([cursor, dEnd]);
  return segs.length ? segs : [[dStart, dEnd]];
}
function dayWindow(date, cfg){
  const segs = dayIntervals(date, cfg);
  return { start: segs[0][0], end: segs[segs.length-1][1] };
}

function isDateBlocked(date, cfg){
  const list = cfg.indisponibilites;
  if(!list || !list.length) return false;
  const ds = toDateInputValue(date);
  return list.some(p => p.debut && p.fin && ds >= p.debut && ds <= p.fin);
}
function nextWorkingInstant(date, cfg){
  let cursor = new Date(date.getTime());
  let guard = 0;
  while(guard++ < 5000){
    const dow = cursor.getDay();
    if(dow===0 || dow===6 || isDateBlocked(cursor, cfg)){ cursor = nextDayStart(cursor); continue; }
    const segs = dayIntervals(cursor, cfg);
    let advanced = false;
    for(const [segStart, segEnd] of segs){
      if(cursor < segStart){ cursor = new Date(segStart.getTime()); advanced = true; break; }
      if(cursor >= segStart && cursor < segEnd){ return cursor; }
    }
    if(advanced) continue;
    cursor = nextDayStart(cursor);
  }
  return cursor;
}
function addWorkingDuration(start, hours, cfg){
  let cursor = nextWorkingInstant(start, cfg);
  let remaining = hours;
  let guard = 0;
  while(remaining > 1e-9 && guard++ < 5000){
    cursor = nextWorkingInstant(cursor, cfg);
    const segs = dayIntervals(cursor, cfg);
    const seg = segs.find(([s,e]) => cursor >= s && cursor < e);
    if(!seg){ cursor = nextDayStart(cursor); continue; }
    const [segStart, segEnd] = seg;
    const availMs = segEnd.getTime() - cursor.getTime();
    const neededMs = remaining*3600000;
    if(neededMs <= availMs){ cursor = new Date(cursor.getTime()+neededMs); remaining = 0; }
    else { remaining -= availMs/3600000; cursor = new Date(segEnd.getTime()); }
  }
  return cursor;
}
// Symétrique d'addWorkingDuration : recule dans le calendrier de travail depuis une échéance donnée.
function subtractWorkingDuration(end, hours, cfg){
  let cursor = new Date(end.getTime());
  let remaining = hours;
  let guard = 0;
  while(remaining > 1e-9 && guard++ < 5000){
    const dow = cursor.getDay();
    if(dow===0 || dow===6 || isDateBlocked(cursor, cfg)){ cursor = prevDayMarker(cursor); continue; }
    const segs = dayIntervals(cursor, cfg);
    let seg = null;
    for(let i=segs.length-1; i>=0; i--){
      if(segs[i][0] < cursor){ seg = segs[i]; break; }
    }
    if(!seg){ cursor = prevDayMarker(cursor); continue; }
    const [segStart, segEnd] = seg;
    const effectiveEnd = cursor < segEnd ? cursor : segEnd;
    const availMs = effectiveEnd.getTime() - segStart.getTime();
    const neededMs = remaining*3600000;
    if(neededMs <= availMs){ cursor = new Date(effectiveEnd.getTime()-neededMs); remaining = 0; }
    else { remaining -= availMs/3600000; cursor = new Date(segStart.getTime()); }
  }
  return cursor;
}
function workingHoursBetween(start, end, cfg){
  if(end <= start) return 0;
  let cursor = nextWorkingInstant(start, cfg);
  let total = 0;
  let guard = 0;
  while(cursor < end && guard++ < 5000){
    cursor = nextWorkingInstant(cursor, cfg);
    if(cursor >= end) break;
    const segs = dayIntervals(cursor, cfg);
    const seg = segs.find(([s,e]) => cursor >= s && cursor < e);
    if(!seg){ cursor = nextDayStart(cursor); continue; }
    const [segStart, segEnd] = seg;
    const segEndClamped = segEnd < end ? segEnd : end;
    if(segEndClamped > cursor){ total += (segEndClamped-cursor)/3600000; cursor = new Date(segEndClamped.getTime()); }
    else { cursor = new Date(segEnd.getTime()); }
  }
  return total;
}
function dateFromX(fracX, days){
  fracX = Math.max(0, Math.min(0.999999, fracX));
  let idx = Math.floor(fracX*days.length);
  idx = Math.max(0, Math.min(days.length-1, idx));
  const day = days[idx];
  const win = combinedDayWindow(day, state);
  const spanMs = win.end.getTime() - win.start.getTime();
  let fracInDay = fracX*days.length - idx;
  fracInDay = Math.max(0, Math.min(1, fracInDay));
  let ms = fracInDay*spanMs;
  ms = Math.round(ms/900000)*900000; // arrondi au 1/4 d'heure
  return new Date(win.start.getTime()+ms); // heure d'horloge brute — le calage sur le calendrier du poste ciblé se fait à l'usage
}
function lunchBandsHtml(days, posFn, cfg){
  if(!cfg.pauseActive) return '';
  return days.map(d => {
    const dow = d.getDay();
    if(dow===0 || dow===6) return '';
    const segs = dayIntervals(d, cfg);
    if(segs.length < 2) return '';
    const leftPct = posFn(segs[0][1])*100;
    const widthPct = Math.max((posFn(segs[1][0]) - posFn(segs[0][1]))*100, 0.3);
    return `<div class="gantt-lunch-band" style="left:${leftPct}%;width:${widthPct}%" title="Pause déjeuner"></div>`;
  }).join('');
}
// Bandes visuelles couvrant les journées bloquées (congés, maintenance...) pour ce poste précis.
function indispoBandsHtml(days, posFn, cfg){
  if(!cfg.indisponibilites || !cfg.indisponibilites.length) return '';
  return days.map(d => {
    const dow = d.getDay();
    if(dow===0 || dow===6) return ''; // déjà visuellement exclu (week-end), pas la peine de superposer
    if(!isDateBlocked(d, cfg)) return '';
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
    const dayEnd = nextDayStart(d);
    const leftPct = posFn(dayStart)*100;
    const widthPct = Math.max((posFn(dayEnd) - posFn(dayStart))*100, 0.3);
    const ds = toDateInputValue(d);
    const period = cfg.indisponibilites.find(p => p.debut && p.fin && ds>=p.debut && ds<=p.fin);
    const label = (period && period.motif) ? period.motif : 'Indisponible';
    return `<div class="gantt-indispo-band" style="left:${leftPct}%;width:${widthPct}%" title="${escapeHtml(label)}"></div>`;
  }).join('');
}

function formatDT(d){ return d.toLocaleString('fr-FR', {weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}).replace('.',''); }
function formatD(d){ return d.toLocaleDateString('fr-FR', {weekday:'short', day:'2-digit', month:'short'}).replace('.',''); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function durationLabel(hours){
  if(hours < 1) return Math.round(hours*60) + ' min';
  if(hours < 8.75) return (Math.round(hours*10)/10) + ' h';
  const days = hours/8.75;
  return (Math.round(days*10)/10) + ' j';
}
function hexToRgba(hex, alpha){
  hex = String(hex||'').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  if(isNaN(r)||isNaN(g)||isNaN(b)) return `rgba(107,113,120,${alpha})`;
  return `rgba(${r},${g},${b},${alpha})`;
}
function effectiveDueDate(dateBesoin){
  // Date de besoin réelle, moins la marge configurée — c'est cette date effective qui sert
  // à détecter un retard, pas la date de besoin brute.
  const marge = (state.config && state.config.margeEcheanceJours) || 0;
  const d = new Date(dateBesoin+'T23:59:59');
  if(marge > 0) d.setDate(d.getDate() - marge);
  return d;
}
function urgencyColorFor(u){
  const uc = (state.config && state.config.urgencyColors) || {};
  if(u==='urgente') return uc.urgente || '#b23a30';
  if(u==='importante') return uc.importante || '#a06d1a';
  return null; // Normale : reste neutre, non colorée
}
function urgencyBorderColor(u){
  return urgencyColorFor(u) || 'transparent';
}
// Adoucit une couleur en la mélangeant vers le blanc — les barres du Gantt occupent de grandes
// surfaces, où une couleur pleine fatigue l'œil. La couleur choisie par poste reste reconnaissable,
// mais la saturation forte est réservée aux signaux (bordure d'urgence, retard, tâche en cours).
function softenColor(hex, ratio){
  const h = String(hex||'').replace('#','');
  if(h.length !== 6) return hex;
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  const mix = (c) => Math.round(c + (255 - c) * ratio);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}
function machineColor(m, mi){
  return (m && m.couleur) ? m.couleur : MACHINE_COLORS[mi%MACHINE_COLORS.length];
}
function ganttBarTooltipHtml(o, label){
  const dueLine = o.dateBesoin ? `<div class="tooltip-due">Échéance : ${escapeHtml(new Date(o.dateBesoin+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}))}</div>` : '';
  return `<div class="gantt-bar-tooltip">
    <div>${escapeHtml(label)}</div>
    <div>${formatDT(o.start)} → ${formatDT(o.end)}</div>
    ${dueLine}
  </div>`;
}
function barStatusMeta(o, baseColor, overridden){
  // Une tâche en cours garde une couleur soutenue (c'est le signal important du planning) ; les
  // tâches à faire sont nettement adoucies, puisqu'elles occupent l'essentiel de la surface.
  const strong = softenColor(baseColor, 0.18);
  const soft = softenColor(baseColor, 0.55);
  if(o.statut==='termine') return { prefix:'✓ ', cls:'done', color:'#dcdfdb', urgBorder:'transparent', note:' (terminée)', draggable:false };
  if(o.statut==='en_cours') return { prefix:'▶ ', cls:'running', color:strong, urgBorder:urgencyBorderColor(o.urgence), note:' (en cours — clic droit pour changer)', draggable:false };
  if(o.statut==='en_pause') return { prefix:'⏸ ', cls:'paused', color:softenColor(baseColor, 0.38), urgBorder:urgencyBorderColor(o.urgence), note:' (en pause — clic droit pour changer)', draggable:false };
  return {
    prefix: overridden ? '📌 ' : '',
    cls: overridden ? 'overridden' : '',
    color: soft, urgBorder: urgencyBorderColor(o.urgence),
    note: overridden ? ' (figée manuellement — double-clic pour la rendre à nouveau volante)' : ' (volante — se recale automatiquement selon la priorité)',
    draggable: true
  };
}
function matchesSearch(c, query){
  if(!query) return true;
  const q = query.toLowerCase();
  if(c.nom && c.nom.toLowerCase().includes(q)) return true;
  return c.pieces.some(p => p.piece && p.piece.toLowerCase().includes(q));
}
let selectedCommandeId = null;
function toggleIsolateCommande(cid){
  if(!cid) return;
  selectedCommandeId = (selectedCommandeId === cid) ? null : cid; // reclique sur la même commande = désisole
  searchQuery = ''; // évite de cumuler recherche et sélection
  render();
}
// Sur les éléments où un double-clic déclenche une AUTRE action (réinitialiser une tâche figée), on
// diffère légèrement l'isolement pour laisser la fenêtre de détection du double-clic du navigateur
// s'exécuter en premier — sinon le premier clic isole (et redessine toute la page) avant que le
// second clic n'ait pu être reconnu comme faisant partie d'un double-clic.
let isolateClickTimer = null;
function scheduleIsolate(cid){
  if(isolateClickTimer) clearTimeout(isolateClickTimer);
  isolateClickTimer = setTimeout(() => { isolateClickTimer = null; toggleIsolateCommande(cid); }, 300);
}
// La pop-up de regroupement suit le même différé que l'isolement : sinon, un double-clic la fait
// apparaître au premier clic puis disparaître au second, ce qui est déroutant.
function scheduleFusionDetail(groupId){
  if(isolateClickTimer) clearTimeout(isolateClickTimer);
  isolateClickTimer = setTimeout(() => { isolateClickTimer = null; showFusionGroupDetail(groupId); }, 300);
}
function cancelScheduledIsolate(){
  if(isolateClickTimer){ clearTimeout(isolateClickTimer); isolateClickTimer = null; }
}
let justRanImplicitDepsMigration = false;
const COLUMNS_RATIO_KEY = 'planning-atelier-columns-ratio';
let columnsRatio = 50; // % de largeur pour "Tâches en cours" ; le reste va à "Tâches terminées"
function loadColumnsRatioPref(){
  try{ const v = Number(localStorage.getItem(COLUMNS_RATIO_KEY)); if(v>=20 && v<=80) columnsRatio = v; }
  catch(e){ /* préférence absente ou indisponible */ }
}
function saveColumnsRatioPref(){
  try{ localStorage.setItem(COLUMNS_RATIO_KEY, String(Math.round(columnsRatio))); }catch(e){}
}
function highlightActive(){ return !!(selectedCommandeId || searchQuery); }
function isHighlighted(cid, commandeNom, piece){
  if(selectedCommandeId) return cid === selectedCommandeId;
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    if(commandeNom && commandeNom.toLowerCase().includes(q)) return true;
    if(piece && piece.toLowerCase().includes(q)) return true;
    return false;
  }
  return false;
}
function dateInCurrentView(d){
  if(currentView==='jour') return toDateInputValue(d)===toDateInputValue(viewAnchor);
  if(currentView==='semaine'){
    const ws = startOfWeek(viewAnchor);
    const we = new Date(ws); we.setDate(we.getDate()+5); // exclusif après vendredi
    return d>=ws && d<we;
  }
  if(currentView==='mois') return d.getFullYear()===viewAnchor.getFullYear() && d.getMonth()===viewAnchor.getMonth();
  if(currentView==='annee') return d.getFullYear()===viewAnchor.getFullYear();
  return true; // kanban / liste : pas de notion de période, rien à vérifier
}
// Si l'élément mis en évidence (recherche ou sélection) n'est pas déjà visible dans la
// période actuellement affichée, saute automatiquement à sa période la plus proche.
function maybeJumpToHighlight(){
  if(!highlightActive()) return;
  if(currentView!=='jour' && currentView!=='semaine' && currentView!=='mois' && currentView!=='annee') return;
  const schedule = computeSchedule(state);
  let matches = [];
  schedule.forEach(c => c.pieces.forEach(o => {
    if(!o.start) return;
    if(isHighlighted(c.id, c.nom, o.piece)) matches.push(o.start);
  }));
  if(matches.length === 0) return;
  matches.sort((a,b) => a - b);
  if(matches.some(d => dateInCurrentView(d))) return; // déjà visible : ne rien bousculer
  viewAnchor = new Date(matches[0].getTime());
}
// Calcule les jours où TOUS les opérateurs liés à un poste sont en congé en même temps — s'il n'y a
// qu'un seul opérateur lié (ou si tous ceux qui le sont sont simultanément absents), le poste devient
// indisponible ces jours-là. Si un opérateur lié n'a aucun congé déclaré, on ne peut jamais conclure
// que "tout le monde est absent" (il est présumé disponible), donc rien n'est bloqué automatiquement.
function operatorLeaveIntersection(operatorIds, st){
  if(!operatorIds.length) return [];
  if(!(st.config.modules && st.config.modules.conges)) return []; // module désactivé : aucun impact sur le planning
  const leaveLists = operatorIds.map(uid_ => (st.leaveRequests||[]).filter(r => r.userId===uid_ && r.statut==='approuve'));
  if(leaveLists.some(list => list.length === 0)) return [];
  function datesOf(list){
    const set = new Set();
    list.forEach(p => {
      if(!p.debut || !p.fin) return;
      let d = new Date(p.debut+'T00:00:00');
      const end = new Date(p.fin+'T00:00:00');
      let guard = 0;
      while(d <= end && guard++ < 400){
        set.add(toDateInputValue(d));
        d.setDate(d.getDate()+1);
      }
    });
    return set;
  }
  const dateSets = leaveLists.map(datesOf);
  const [first, ...rest] = dateSets;
  const common = [...first].filter(d => rest.every(s => s.has(d)));
  common.sort();
  // Noms des opérateurs concernés, pour que le survol dise clairement QUI est absent plutôt
  // qu'une formule générique.
  const knownUsers = (typeof usersList !== 'undefined') ? usersList : [];
  const names = operatorIds.map(uid_ => { const u = knownUsers.find(u=>String(u.id)===String(uid_)); return u ? u.username : null; }).filter(Boolean);
  const namesLabel = names.length ? names.join(', ') : 'opérateur(s) lié(s)';
  const motifLabel = `Congé — ${namesLabel} absent${names.length>1?'s':''}`;
  const ranges = [];
  common.forEach(d => {
    const last = ranges[ranges.length-1];
    if(last){
      const nextExpected = new Date(last.fin+'T00:00:00'); nextExpected.setDate(nextExpected.getDate()+1);
      if(toDateInputValue(nextExpected) === d){ last.fin = d; return; }
    }
    ranges.push({ id: 'auto-'+d, debut: d, fin: d, motif: motifLabel });
  });
  return ranges;
}
function effectiveConfig(machine, st){
  const merged = (machine && machine.horairesActifs && machine.horaires) ? { ...st.config, ...machine.horaires } : { ...st.config };
  const own = (machine && Array.isArray(machine.indisponibilites)) ? machine.indisponibilites : [];
  const linkedOps = machine ? Object.keys(st.userMachines||{}).filter(uid => (st.userMachines[uid]||[]).includes(machine.id)) : [];
  const autoRanges = machine ? operatorLeaveIntersection(linkedOps, st) : [];
  merged.indisponibilites = [...own, ...autoRanges];
  return merged;
}
function configForMachineId(machineId, st){
  const m = st.machines.find(mm=>mm.id===machineId);
  return effectiveConfig(m, st);
}
// Comme configForMachineId, mais si la pièce a un opérateur assigné avec une pause déjeuner qui
// lui est propre, cette pause remplace celle du poste — le reste (horaires, indisponibilités...)
// continue de venir du poste.
function configForPiece(op, st){
  const cfg = configForMachineId(op.machineId, st);
  const userLunch = op.operatorUserId && st.userLunch ? st.userLunch[op.operatorUserId] : null;
  if(userLunch && userLunch.pauseActive){
    // Une ou plusieurs pauses propres à cette personne remplacent entièrement celle(s) du poste
    // (jamais un mélange des deux) — pauses:[] avec pauseActive coché revient à travailler sans
    // aucune pause plutôt qu'à hériter de celle du poste, ce qui est le comportement attendu si
    // l'admin a explicitement coché "pause propre à cette personne" puis tout supprimé.
    return { ...cfg, pauseActive: true, pauses: userLunch.pauses || [], pauseDebut: undefined, pauseFin: undefined };
  }
  return cfg;
}

function findOverlap(start, end, intervals, ignoreFusionGroupId){
  return intervals.find(iv => start < iv.end && end > iv.start && !(ignoreFusionGroupId && iv.fusionGroupId && iv.fusionGroupId === ignoreFusionGroupId));
}
// Résout un chevauchement en calant le créneau souhaité sur le point libre le plus proche (avant ou après le bloc qui gêne).
// ignoreFusionGroupId : les pièces fusionnées ensemble doivent au contraire pouvoir occuper exactement
// le même créneau — ce n'est pas un vrai conflit entre elles, seulement avec tout le reste.
function resolveOverlap(desiredStart, dureeH, intervals, cfg, minBound, ignoreFusionGroupId){
  const desiredEnd = addWorkingDuration(desiredStart, dureeH, cfg);
  const overlap = findOverlap(desiredStart, desiredEnd, intervals, ignoreFusionGroupId);
  if(!overlap) return desiredStart;

  // candidat "après" : pousser après le bloc, en boucle tant qu'un autre bloc gêne encore
  let afterStart = nextWorkingInstant(overlap.end, cfg);
  let afterEnd = addWorkingDuration(afterStart, dureeH, cfg);
  let conflictA = findOverlap(afterStart, afterEnd, intervals, ignoreFusionGroupId);
  let guardA = 0;
  while(conflictA && guardA++ < 50){
    afterStart = nextWorkingInstant(conflictA.end, cfg);
    afterEnd = addWorkingDuration(afterStart, dureeH, cfg);
    conflictA = findOverlap(afterStart, afterEnd, intervals, ignoreFusionGroupId);
  }

  // candidat "avant" : reculer avant le bloc, en boucle, sans descendre sous la borne minimale (dispo machine)
  let beforeEnd = overlap.start;
  let beforeStart = subtractWorkingDuration(beforeEnd, dureeH, cfg);
  let validBefore = !(minBound && beforeStart < minBound);
  let guardB = 0;
  while(validBefore){
    const conflictB = findOverlap(beforeStart, beforeEnd, intervals, ignoreFusionGroupId);
    if(!conflictB) break;
    beforeEnd = conflictB.start;
    beforeStart = subtractWorkingDuration(beforeEnd, dureeH, cfg);
    if(minBound && beforeStart < minBound){ validBefore = false; break; }
    if(guardB++ > 50){ validBefore = false; break; }
  }

  if(validBefore){
    const distBefore = Math.abs(desiredStart.getTime() - beforeStart.getTime());
    const distAfter = Math.abs(afterStart.getTime() - desiredStart.getTime());
    if(distBefore <= distAfter) return beforeStart;
  }
  return afterStart;
}

/* ---------------- moteur de planification ---------------- */
// Dépendances effectives d'une pièce au sein de sa commande : celles explicitement choisies
// si renseignées, sinon la pièce précédente dans la liste (comportement historique, inchangé
// pour toute commande qui n'utilise pas la fonctionnalité).
// Les dépendances effectives sont désormais toujours celles explicitement choisies (tableau
// vide = aucune dépendance, la pièce démarre dès que sa propre machine est libre). Il n'y a
// plus de dépendance implicite sur la pièce précédente de la liste — ce comportement invisible
// créait des blocages inattendus entre pièces de machines différentes.
// Une pièce dépend de TOUTES les pièces de sa commande dont le numéro de phase est strictement
// inférieur au sien. Plusieurs pièces peuvent partager la même phase : elles n'ont alors aucune
// contrainte entre elles et peuvent tourner en parallèle (sur des postes différents).
// Dépendances implicites de phase. Elles s'appliquent PIÈCE PAR PIÈCE : deux pièces différentes
// d'une même commande suivent chacune leur propre cycle et n'ont pas à s'attendre mutuellement.
// Exception : une pièce regroupée (fusionnée) est traitée physiquement avec ses partenaires, donc
// la phase suivante attend l'ensemble du bloc, pas seulement sa propre ligne.
function resolveEffectiveDeps(pieces){
  const map = {};
  const pieceKey = (p) => String(p.piece||'').trim().toLowerCase();
  // Pour chaque groupe fusionné, les noms de pièce qu'il couvre : une phase inférieure appartenant
  // au groupe compte comme prédécesseur de toutes les pièces concernées par ce groupe.
  const groupPieceNames = {};
  pieces.forEach(p => {
    if(!p.fusionGroupId) return;
    (groupPieceNames[p.fusionGroupId] = groupPieceNames[p.fusionGroupId] || new Set()).add(pieceKey(p));
  });
  pieces.forEach(p => {
    const myPhase = Number(p.phase) || 1;
    const myKey = pieceKey(p);
    map[p.id] = pieces.filter(other => {
      if(other.id === p.id) return false;
      if((Number(other.phase) || 1) >= myPhase) return false;
      if(pieceKey(other) === myKey) return true; // même pièce : cycle normal des phases
      // Pièce différente : ne compte que si elle est fusionnée avec une ligne de ma propre pièce
      // (le bloc est découpé en un seul passage, il doit donc être terminé en entier).
      if(other.fusionGroupId && groupPieceNames[other.fusionGroupId] && groupPieceNames[other.fusionGroupId].has(myKey)) return true;
      return false;
    }).map(o => o.id);
  });
  return map;
}
// Tri topologique simple ; une dépendance circulaire est coupée silencieusement au point de
// cycle plutôt que de bloquer le calcul (la pièce concernée retombe alors sans contrainte
// pour cette branche-là, mais rien ne plante).
function topoOrderPieces(pieces, depsMap){
  const byId = {}; pieces.forEach(p => byId[p.id] = p);
  const order = [];
  const visited = new Set();
  const visiting = new Set();
  function visit(p){
    if(visited.has(p.id) || visiting.has(p.id)) return;
    visiting.add(p.id);
    (depsMap[p.id]||[]).forEach(depId => { if(byId[depId]) visit(byId[depId]); });
    visiting.delete(p.id);
    visited.add(p.id);
    order.push(p);
  }
  pieces.forEach(p => visit(p));
  return order;
}

function comparePriorityItems(itemA, itemB){
  const ra = URGENCY_RANK[itemA.cmd.urgence] !== undefined ? URGENCY_RANK[itemA.cmd.urgence] : 2;
  const rb = URGENCY_RANK[itemB.cmd.urgence] !== undefined ? URGENCY_RANK[itemB.cmd.urgence] : 2;
  if(ra !== rb) return ra - rb; // l'urgence prime sur le délai — même critère que "Trier par priorité"
  const da = itemA.cmd.dateBesoin, db = itemB.cmd.dateBesoin;
  if(!da && !db){ /* pas d'échéance des deux côtés : on départage plus bas */ }
  else if(!da) return 1;
  else if(!db) return -1;
  else if(da !== db) return da.localeCompare(db);
  return (itemA.op.phase||1) - (itemB.op.phase||1); // à égalité stricte, phase la plus basse d'abord
}
// Une tâche "en cours" dont le temps théorique est déjà écoulé (dépassement en direct) doit
// continuer de s'afficher comme active jusqu'à maintenant, plutôt que de sembler figée dans le
// passé — elle n'est étirée que si elle tourne réellement (pas "en pause"), et seulement jusqu'à
// l'instant présent, jamais plus loin.
function stretchIfOverdueRunning(op, end){
  if(op.statut !== 'en_cours') return end;
  const now = new Date();
  return end < now ? now : end;
}
// Temps de transfert après une opération : fixe (le déplacement lui-même) + proportionnel à la
// quantité (la manutention). Réglé en MINUTES sur le poste de DÉPART, c'est-à-dire celui qui vient
// de terminer. Appliqué aussi quand la phase suivante reste sur le même poste (dépose, contrôle).
// Renvoie une durée en heures, unité utilisée par le moteur de planification.
function transferHoursAfter(op, st){
  const m = (st.machines||[]).find(mm => mm.id === op.machineId);
  if(!m) return 0;
  const fixeMin = Number(m.transfertFixeMin) || 0;
  const parPieceMin = Number(m.transfertParPieceMin) || 0;
  const qte = Number(op.quantite) || 0;
  const totalMin = fixeMin + parPieceMin * qte;
  return totalMin > 0 ? totalMin / 60 : 0;
}
function computeSchedule(st){
  const machineFree = {};
  const machineIntervals = {};
  const machineDispoFloor = {}; // plancher fixe (jamais modifié ensuite) : le poste n'existe simplement pas avant cette date
  st.machines.forEach(m => {
    machineFree[m.id] = nextWorkingInstant(new Date(m.dispo), effectiveConfig(m, st));
    machineDispoFloor[m.id] = machineFree[m.id];
    machineIntervals[m.id] = [];
  });

  // Phase 1 : verrouiller la position des tâches réellement démarrées (en cours / en pause) —
  // elles occupent le poste pour de vrai et ne doivent jamais être déplacées par la résolution de conflit.
  st.commandes.forEach(cmd => {
    cmd.pieces.forEach(op => {
      if((op.statut==='en_cours' || op.statut==='en_pause') && op.manualStart && op.machineId && !op.sousTraitance){
        const cfg = configForPiece(op, st);
        const dureeH = (op.dureeOverrideH!=null && op.dureeOverrideH>0) ? op.dureeOverrideH : (op.tempsUnitaire*op.quantite)/60;
        const start = nextWorkingInstant(new Date(op.manualStart), cfg);
        const end = stretchIfOverdueRunning(op, addWorkingDuration(start, dureeH, cfg));
        machineIntervals[op.machineId].push({ start, end, fusionGroupId: op.fusionGroupId || null });
        const cur = machineFree[op.machineId];
        machineFree[op.machineId] = (cur && cur > end) ? cur : end;
      }
    });
  });

  const computedEnd = {}; // id de pièce -> Date de fin calculée (toutes commandes confondues), pour les dépendances
  const opsById = {};     // id de pièce -> résultat final {...op, start, end, dureeH}
  const pendingVolante = []; // tâches "à faire" non figées : planifiées par la phase 3 (remplissage des trous)

  // Phase 2 : verrouiller tout ce qui a une position déjà déterminée sans ambiguïté — tâches
  // terminées (horaires réels) et tâches figées manuellement (position choisie par l'utilisateur,
  // toujours respectée même si elle ne satisfait pas une dépendance : c'est le principe du figeage).
  // Les tâches "à faire" non figées sont mises de côté : ce sont les seules que la phase 3 peut
  // librement replacer pour combler un poste inactif.
  st.commandes.forEach(cmd => {
    const depsMap = resolveEffectiveDeps(cmd.pieces);
    const processOrder = topoOrderPieces(cmd.pieces, depsMap);
    processOrder.forEach(op => {
      const cfg = configForPiece(op, st);
      if(op.sousTraitance){
        // Une pièce sous-traitée ne réserve jamais aucun poste, quel que soit son statut — elle
        // garde ses dates réelles pour information, et n'alimente les dépendances des phases
        // suivantes qu'une fois réellement marquée "Terminée" (comme n'importe quelle autre pièce).
        const dureeHst = (op.dureeOverrideH!=null && op.dureeOverrideH>0) ? op.dureeOverrideH : (op.tempsUnitaire * op.quantite) / 60;
        const s = op.debutReel ? new Date(op.debutReel) : (op.manualStart ? new Date(op.manualStart) : null);
        const e = op.statut === 'termine' ? (op.finReel ? new Date(op.finReel) : null) : null;
        opsById[op.id] = { ...op, start: s, end: e, dureeH: dureeHst };
        if(e) computedEnd[op.id] = e;
        return;
      }
      if(op.statut === 'termine'){
        const s = op.debutReel ? new Date(op.debutReel) : null;
        const e = op.finReel ? new Date(op.finReel) : null;
        opsById[op.id] = { ...op, start: s, end: e, dureeH: (op.tempsUnitaire*op.quantite)/60 };
        if(e) computedEnd[op.id] = e;
        return;
      }
      const dureeH = (op.dureeOverrideH!=null && op.dureeOverrideH>0) ? op.dureeOverrideH : (op.tempsUnitaire * op.quantite) / 60;
      // Une tâche réellement démarrée occupe physiquement le poste MAINTENANT : elle est toujours
      // verrouillée sur son horaire de démarrage, même sans départ figé manuellement (cas d'une
      // tâche libérée après coup, ou démarrée sans que manualStart ait été posé). Sans ça, elle
      // retombait dans la file d'attente et pouvait être classée après des tâches pas encore
      // commencées — une contradiction avec la réalité de l'atelier.
      const isRunning = (op.statut==='en_cours' || op.statut==='en_pause');
      const runningAnchor = op.manualStart || op.debutReel || (op.sessions && op.sessions.length ? op.sessions[0].debut : null);
      const alreadyLocked = isRunning && runningAnchor;
      if(alreadyLocked){
        const start = nextWorkingInstant(new Date(runningAnchor), cfg);
        const end = stretchIfOverdueRunning(op, addWorkingDuration(start, dureeH, cfg));
        computedEnd[op.id] = end;
        opsById[op.id] = { ...op, start, end, dureeH };
        return;
      }
      if(op.manualStart){
        // tâche figée manuellement : comportement strictement inchangé, jamais concernée par le
        // remplissage des trous — ni comme tâche à décaler, ni comme candidate pour boucher un trou.
        const machineObj = st.machines.find(m=>m.id===op.machineId);
        const dispoBound = machineObj ? nextWorkingInstant(new Date(machineObj.dispo), cfg) : null;
        const nowBound = nextWorkingInstant(new Date(), cfg);
        const minBound = dispoBound && dispoBound > nowBound ? dispoBound : nowBound;
        let desiredStart = nextWorkingInstant(new Date(op.manualStart), cfg);
        if(desiredStart < minBound) desiredStart = minBound;
        const start = resolveOverlap(desiredStart, dureeH, machineIntervals[op.machineId] || [], cfg, minBound, op.fusionGroupId);
        const end = addWorkingDuration(start, dureeH, cfg);
        if(op.machineId){
          machineIntervals[op.machineId].push({ start, end, fusionGroupId: op.fusionGroupId || null });
          const cur = machineFree[op.machineId];
          machineFree[op.machineId] = (cur && cur > end) ? cur : end;
        }
        computedEnd[op.id] = end;
        opsById[op.id] = { ...op, start, end, dureeH };
        return;
      }
      if(isRunning){
        // En cours mais sans aucun horodatage de démarrage : on la place à l'instant présent plutôt
        // que de la laisser concourir avec les tâches à faire (elle tourne déjà, elle ne peut pas
        // être planifiée dans le futur).
        const start = nextWorkingInstant(new Date(), cfg);
        const end = stretchIfOverdueRunning(op, addWorkingDuration(start, dureeH, cfg));
        if(op.machineId){
          machineIntervals[op.machineId].push({ start, end, fusionGroupId: op.fusionGroupId || null });
          const cur = machineFree[op.machineId];
          machineFree[op.machineId] = (cur && cur > end) ? cur : end;
        }
        computedEnd[op.id] = end;
        opsById[op.id] = { ...op, start, end, dureeH };
        return;
      }
      // "à faire", volante : planifiée par la phase 3.
      pendingVolante.push({ op, cmd, cfg, dureeH, deps: depsMap[op.id]||[] });
    });
  });

// Recherche, en avançant, le premier créneau réellement libre dans le calendrier du poste (à
// partir d'un plancher donné) — contrairement à un simple curseur "libre à partir de...", ceci
// détecte correctement un trou même si une tâche figée occupe un poste plus tard, loin devant.
function findNextFreeSlot(floor, dureeH, intervals, cfg){
  let start = nextWorkingInstant(floor, cfg);
  let end = addWorkingDuration(start, dureeH, cfg);
  let conflict = findOverlap(start, end, intervals);
  let guard = 0;
  while(conflict && guard++ < 200){
    start = nextWorkingInstant(conflict.end, cfg);
    end = addWorkingDuration(start, dureeH, cfg);
    conflict = findOverlap(start, end, intervals);
  }
  return start;
}
  // Phase 3 : planification des tâches volantes, poste par poste. À chaque étape, chaque poste
  // choisit la tâche prête (dépendances déjà satisfaites) la plus prioritaire parmi TOUTES les
  // commandes — pas seulement celle qui aurait été "la prochaine" dans son propre ordre. C'est ce
  // qui permet de combler automatiquement un poste resté inactif en attendant une dépendance :
  // une autre tâche prête, sur ce même poste, prend la place en attendant, avec les mêmes règles
  // de priorité que "Trier par priorité" (urgence puis échéance). Une fois démarrée, une tâche va
  // jusqu'au bout sans être interrompue, même si la dépendance qui bloquait l'autre tâche se libère
  // entre-temps. La disponibilité du poste est toujours recherchée dans son calendrier réel
  // (findNextFreeSlot), jamais supposée à partir d'un simple curseur — sinon une tâche figée placée
  // loin dans le futur masquerait à tort tout le temps resté libre avant elle.
  let remaining = pendingVolante;
  let guardRounds = 0;
  while(remaining.length > 0 && guardRounds++ < 200){
    let scheduledSomething = false;
    st.machines.forEach(m => {
      let more = true;
      while(more){
        more = false;
        const cfgM = configForMachineId(m.id, st);
        const nowFloor = nextWorkingInstant(new Date(), cfgM);
        // On classe d'abord les candidats "prêts" (dépendances déjà résolues) en deux groupes :
        // ceux dont le créneau réel le plus proche démarre exactement à leur plancher (donc sans
        // aucune attente supplémentaire due au poste), et ceux qui devraient de toute façon
        // patienter (dépendance résolue mais plus tardive, ou poste occupé entre-temps). Le poste
        // choisit toujours en priorité parmi le premier groupe s'il n'est pas vide — c'est ce qui
        // empêche une tâche "prioritaire mais encore en attente" de faire inutilement patienter le
        // poste alors qu'une autre tâche, moins prioritaire mais réellement prête, pourrait tourner
        // tout de suite.
        const candidates = [];
        remaining.forEach((item, idx) => {
          if(item.op.machineId !== m.id) return;
          const depsResolved = item.deps.every(depId => computedEnd[depId] !== undefined);
          if(!depsResolved) return;
          let depsFloor = null;
          item.deps.forEach(depId => {
            const de = computedEnd[depId];
            if(!de) return;
            // Le transfert s'écoule sur le temps de travail du poste qui vient de terminer : une
            // pièce sortie à 16h50 avec 1h de transfert n'est pas disponible à 17h50 si l'atelier
            // ferme à 17h — elle le sera le lendemain matin.
            const depOp = opsById[depId];
            const th = depOp ? transferHoursAfter(depOp, st) : 0;
            const dispo = th > 0 ? addWorkingDuration(de, th, configForPiece(depOp, st)) : de;
            if(!depsFloor || dispo > depsFloor) depsFloor = dispo;
          });
          let floor = depsFloor && depsFloor > nowFloor ? depsFloor : nowFloor;
          const dispoFloor = machineDispoFloor[m.id];
          if(dispoFloor && dispoFloor > floor) floor = dispoFloor;
          if(item.op.dateDebutPossible){
            const materialFloor = nextWorkingInstant(new Date(item.op.dateDebutPossible+'T00:00:00'), item.cfg);
            if(materialFloor > floor) floor = materialFloor;
          }
          const alignedFloor = nextWorkingInstant(floor, item.cfg); // le plancher, simplement calé sur le calendrier (week-end/pause), sans tenir compte des autres tâches
          const earliestStart = findNextFreeSlot(floor, item.dureeH, machineIntervals[m.id], item.cfg);
          candidates.push({ idx, item, floor, alignedFloor, earliestStart });
        });
        if(candidates.length === 0) return;
        // "Prêt maintenant" = le premier créneau réellement libre tombe exactement sur le plancher
        // calé sur le calendrier — autrement dit, rien d'autre ne bloque déjà ce poste à cet instant.
        const readyNow = candidates.filter(c => c.earliestStart.getTime() === c.alignedFloor.getTime());
        let chosen;
        if(readyNow.length > 0){
          chosen = readyNow.reduce((best, c) => comparePriorityItems(best.item, c.item) > 0 ? c : best);
        } else {
          // personne ne peut démarrer sans délai supplémentaire : on prend celui dont le créneau
          // libre le plus proche arrive en premier, la priorité ne servant qu'à départager une
          // égalité exacte.
          chosen = candidates.reduce((best, c) => {
            if(c.earliestStart < best.earliestStart) return c;
            if(c.earliestStart > best.earliestStart) return best;
            return comparePriorityItems(best.item, c.item) > 0 ? c : best;
          });
        }
        const bestIdx = chosen.idx;
        const item = remaining[bestIdx];
        const { op, cfg, dureeH } = item;
        const start = chosen.earliestStart;
        const end = addWorkingDuration(start, dureeH, cfg);
        machineIntervals[m.id].push({ start, end });
        const cur = machineFree[m.id];
        machineFree[m.id] = (cur && cur > end) ? cur : end;
        computedEnd[op.id] = end;
        opsById[op.id] = { ...op, start, end, dureeH };
        remaining.splice(bestIdx, 1);
        scheduledSomething = true;
        more = true; // ce poste enchaîne peut-être tout de suite avec une autre tâche prête
      }
    });
    if(!scheduledSomething) break; // sécurité anti-boucle infinie : dépendance orpheline, plus aucun progrès possible
  }
  // Sécurité : une pièce qui n'aurait pas pu être planifiée (dépendance cassée) reste visible sans
  // horaire plutôt que de disparaître silencieusement.
  remaining.forEach(item => { opsById[item.op.id] = { ...item.op, start: null, end: null, dureeH: item.dureeH }; });

  const results = [];
  st.commandes.forEach(cmd => {
    // on restitue les pièces dans leur ordre d'affichage d'origine, même si le calcul interne
    // s'est fait dans un ordre différent (topologique, puis par priorité inter-commandes).
    const opsOut = cmd.pieces.map(p => opsById[p.id]);
    const lastWithEnd = [...opsOut].reverse().find(o => o.end);
    results.push({ ...cmd, pieces: opsOut, finEstimee: lastWithEnd ? lastWithEnd.end : null });
  });
  return results;
}

/* ---------------- actions d'état ---------------- */
function commit(){ saveState(); render(); }

function addMachine(){
  const defaultColor = MACHINE_COLORS[state.machines.length % MACHINE_COLORS.length];
  state.machines.push({ id: uid('m'), nom: 'Nouveau poste', dispo: toInputValue(new Date()), horairesActifs: false, horaires: { ...DEFAULT_CONFIG }, couleur: defaultColor, fusionnable: false, transfertFixeMin: 0, transfertParPieceMin: 0 });
  commit();
}
function removeMachine(id){
  if(state.machines.length <= 1) return;
  if(!confirm('Supprimer ce poste ? Les opérations qui lui étaient affectées resteront mais devront être réaffectées.')) return;
  state.machines = state.machines.filter(m => m.id !== id);
  commit();
}
function updateMachine(id, field, value){ const m = state.machines.find(m => m.id===id); if(!m) return; m[field] = value; commit(); }
function addMachineIndispo(machineId){
  const m = state.machines.find(m=>m.id===machineId); if(!m) return;
  const debutEl = document.getElementById('indispo-debut-'+machineId);
  const finEl = document.getElementById('indispo-fin-'+machineId);
  const motifEl = document.getElementById('indispo-motif-'+machineId);
  const debut = debutEl ? debutEl.value : '';
  const fin = finEl ? finEl.value : '';
  if(!debut || !fin){ alert('Merci de renseigner une date de début et une date de fin.'); return; }
  if(fin < debut){ alert('La date de fin doit être postérieure ou égale à la date de début.'); return; }
  if(!m.indisponibilites) m.indisponibilites = [];
  m.indisponibilites.push({ id: uid('ind'), debut, fin, motif: motifEl ? motifEl.value.trim() : '' });

function triggerLogoUpload(){ document.getElementById('logo-upload-input').click(); }

function handleLogoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Merci de choisir un fichier image (PNG, JPG, SVG...).'); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 160, maxH = 60;
      const ratio = Math.min(maxW/img.width, maxH/img.height, 1); // ne jamais agrandir, seulement réduire si besoin
      const w = Math.max(1, Math.round(img.width*ratio));
      const h = Math.max(1, Math.round(img.height*ratio));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      state.config.logoDataUrl = canvas.toDataURL('image/png');
      commit();
    };
    img.onerror = () => alert("Impossible de lire cette image.");
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function handleFaviconUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Merci de choisir un fichier image.'); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const size = 64;
      const side = Math.min(img.width, img.height);
      const sx = (img.width-side)/2, sy = (img.height-side)/2; // recadrage centré en carré
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
      state.config.faviconDataUrl = canvas.toDataURL('image/png');
      commit();
    };
    img.onerror = () => alert("Impossible de lire cette image.");
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

/* ---------------- Module Congés : types, soldes, demandes ---------------- */
// Calcule le dimanche de Pâques pour une année donnée (algorithme de Meeus/Jones/Butcher,
// calendrier grégorien) — sert de base aux jours fériés mobiles (Lundi de Pâques, Ascension,
// Lundi de Pentecôte), qui ne tombent jamais à date fixe.
function computeEasterSunday(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const month = Math.floor((h + l - 7*m + 114) / 31);
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(year, month-1, day);
}
const _frenchHolidaysCache = {};
// Les 11 jours fériés légaux en France, pour une année donnée — calculés une fois puis mis en
// cache. Renvoie un Set de dates au format AAAA-MM-JJ, pour une vérification rapide.
function frenchPublicHolidays(year){
  if(_frenchHolidaysCache[year]) return _frenchHolidaysCache[year];
  const easter = computeEasterSunday(year);
  const addDays = (d,n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  const dates = [
    new Date(year,0,1),    // 1er janvier
    addDays(easter,1),     // Lundi de Pâques
    new Date(year,4,1),    // 1er mai
    new Date(year,4,8),    // 8 mai
    addDays(easter,39),    // Ascension
    addDays(easter,50),    // Lundi de Pentecôte
    new Date(year,6,14),   // 14 juillet
    new Date(year,7,15),   // 15 août
    new Date(year,10,1),   // 1er novembre
    new Date(year,10,11),  // 11 novembre
    new Date(year,11,25)   // 25 décembre
  ];
  const set = new Set(dates.map(toDateInputValue));
  _frenchHolidaysCache[year] = set;
  return set;
}
function isFrenchPublicHoliday(d){
  return frenchPublicHolidays(d.getFullYear()).has(toDateInputValue(d));
}
function countWorkingDaysInRange(debut, fin){
  let d = new Date(debut+'T00:00:00');
  const end = new Date(fin+'T00:00:00');
  let count = 0, guard = 0;
  while(d <= end && guard++ < 400){
    const day = d.getDay(); // 0=dimanche, 6=samedi — jours ouvrés lun-ven, indépendant du calendrier des postes
    if(day !== 0 && day !== 6 && !isFrenchPublicHoliday(d)) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}

// Solde = allocation annuelle - jours déjà comptabilisés (approuvés) - jours actuellement en attente
// (pour ne pas laisser quelqu'un demander plus que ce qu'il lui reste, même avant validation).
function computeLeaveBalance(userId, typeId, year, excludeId){
  const allocated = (state.userLeaveAllocations[userId] && state.userLeaveAllocations[userId][typeId]) || 0;
  const requests = state.leaveRequests.filter(r => r.userId===userId && r.typeId===typeId && r.id!==excludeId && r.debut && r.debut.startsWith(String(year)));
  const used = requests.filter(r=>r.statut==='approuve').reduce((s,r)=>s+countWorkingDaysInRange(r.debut,r.fin),0);
  const pending = requests.filter(r=>r.statut==='en_attente').reduce((s,r)=>s+countWorkingDaysInRange(r.debut,r.fin),0);
  return { allocated, used, pending, remaining: allocated - used - pending };
}

  const link = `${window.location.origin}${window.location.pathname}?leave-confirm=${req_.confirmToken}`;
  const subject = `Un congé vous est proposé — confirmation nécessaire`;
  const text = `Un administrateur souhaite vous attribuer un congé de "${type?type.nom:'congé'}" du ${formatDateFr(req_.debut)} au ${formatDateFr(req_.fin)}${req_.motif?` (motif : ${req_.motif})`:''}.\n\nMerci de confirmer votre accord en cliquant sur ce lien :\n${link}\n\nVous pourrez y accepter ou refuser en un clic, sans avoir besoin de vous connecter.`;
  try{ await fetch('/api/notify-user/'+req_.userId, { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ subject, text }) }); }catch(e){ /* non bloquant */ }
}
// Congé imposé (case "Imposer" cochée) : simple information, rien à confirmer — contrairement à
// notifyUserOfAssignmentProposal, pas de lien d'action.
async function notifyUserOfImposedLeave(req_){
  const type = leaveTypeById(req_.typeId);
  const subject = `Un congé a été enregistré sur votre planning`;
  const text = `Un administrateur a enregistré un congé de "${type?type.nom:'congé'}" du ${formatDateFr(req_.debut)} au ${formatDateFr(req_.fin)}${req_.motif?` (motif : ${req_.motif})`:''}.\n\nCe congé est déjà approuvé, aucune action de votre part n'est nécessaire.`;
  try{ await fetch('/api/notify-user/'+req_.userId, { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ subject, text }) }); }catch(e){ /* non bloquant */ }
}
// Confirmation depuis l'appli (personne déjà connectée) — équivalent du clic sur le lien de l'e-mail.
function confirmMyLeaveAssignment(reqId, decision){
  const req_ = state.leaveRequests.find(r=>r.id===reqId);
  if(!req_ || req_.statut!=='a_confirmer') return;
  req_.statut = decision === 'accept' ? 'approuve' : 'refuse';
  req_.traiteLe = new Date().toISOString();
  req_.commentaireValidation = decision === 'accept' ? 'Confirmé par la personne concernée.' : 'Refusé par la personne concernée.';
  delete req_.confirmToken;
  commit();
  showToast(decision==='accept' ? 'Congé accepté.' : 'Congé refusé.');
}
function startLeaveRequestSubmission(userId, typeId, debut, fin, motif){
  if(!typeId){ alert('Merci de choisir un type de congé.'); return; }
  if(!debut || !fin){ alert('Merci de renseigner une date de début et une date de fin.'); return; }
  if(fin < debut){ alert('La date de fin doit être postérieure ou égale à la date de début.'); return; }
  pendingLeaveRequestDraft = { userId, typeId, debut, fin, motif: (motif||'').trim(), mode: 'salarie' };
  render();
}
function confirmLeaveRequestSubmission(){
  if(!pendingLeaveRequestDraft) return;
  const { id, userId, typeId, debut, fin, motif, mode } = pendingLeaveRequestDraft;
  const year = new Date(debut+'T00:00:00').getFullYear();
  const bal = computeLeaveBalance(userId, typeId, year, id); // exclut le congé lui-même en mode édition, sinon il se compterait deux fois
  const demanded = countWorkingDaysInRange(debut, fin);
  if(demanded > bal.remaining){
    const msg = mode==='edit'
      ? `Attention : il ne reste que ${bal.remaining} jour(s) disponible(s) pour ce type de congé sur ${year} (cette période en compte ${demanded}). Enregistrer quand même ?`
      : mode==='admin'
      ? `Attention : il ne reste que ${bal.remaining} jour(s) disponible(s) pour ce type de congé sur ${year} (cette période en compte ${demanded}). Attribuer quand même ?`
      : `Attention : il ne reste que ${bal.remaining} jour(s) disponible(s) pour ce type de congé sur ${year} (cette demande en compte ${demanded}). Soumettre quand même ?`;
    if(!confirm(msg)) return;
  }
  if(mode === 'edit'){
    const req_ = state.leaveRequests.find(r=>r.id===id);
    if(!req_){ pendingLeaveRequestDraft = null; render(); return; }
    const oldReq = { ...req_ };
    req_.typeId = typeId; req_.debut = debut; req_.fin = fin; req_.motif = motif;
    pendingLeaveRequestDraft = null;
    commit();
    notifyUserOfModification(oldReq, req_);
    showToast('Congé modifié.');
    return;
  }
  if(mode === 'admin'){
    const imposed = !!pendingLeaveRequestDraft.imposer;
    const req_ = {
      id: uid('leavereq'), userId, typeId, debut, fin, motif,
      statut: imposed ? 'approuve' : 'a_confirmer', demandeLe: new Date().toISOString(),
      traiteParUserId: currentUser ? String(currentUser.id) : null,
      traiteLe: imposed ? new Date().toISOString() : null,
      commentaireValidation: '', confirmToken: secureToken()
    };
    state.leaveRequests.push(req_);
    pendingLeaveRequestDraft = null;
    commit();
    if(imposed){
      notifyUserOfImposedLeave(req_);
      showToast('Congé imposé — enregistré directement comme approuvé.');
    } else {
      notifyUserOfAssignmentProposal(req_);
      showToast('Proposition envoyée — en attente de confirmation par la personne concernée.');
    }
    ['assign-leave-user','assign-leave-debut','assign-leave-fin','assign-leave-motif'].forEach(id => {
      const el = document.getElementById(id); if(el) el.value = '';
    });
    const imposerEl = document.getElementById('assign-leave-imposer'); if(imposerEl) imposerEl.checked = false;
    return;
  }
  const req_ = {
    id: uid('leavereq'), userId, typeId, debut, fin, motif,
    statut: 'en_attente', demandeLe: new Date().toISOString(),
    traiteParUserId: null, traiteLe: null, commentaireValidation: ''
  };
  state.leaveRequests.push(req_);
  pendingLeaveRequestDraft = null;
  commit();
  notifyAdminsOfRequest(req_);
  showToast('Demande envoyée — en attente de validation.');
}

// Détecte les congés d'une même personne qui chevauchent une période donnée — quel que soit leur
// type (un RTT posé au milieu d'un congé payé reste un doublon). Les congés refusés ne comptent pas.
function findLeaveConflicts(userId, debut, fin, excludeId){
  return (state.leaveRequests||[]).filter(r =>
    String(r.userId) === String(userId) &&
    r.id !== excludeId &&
    r.statut !== 'refuse' &&
    r.debut <= fin && r.fin >= debut   // chevauchement, même partiel
  );
}
// Cherche la plus longue période demandée qui reste réellement libre, pour pouvoir la proposer
// en remplacement plutôt que de laisser l'utilisateur recalculer les dates lui-même.
function suggestFreeRange(userId, debut, fin, excludeId){
  const conflicts = findLeaveConflicts(userId, debut, fin, excludeId);
  if(conflicts.length === 0) return null;
  const busy = new Set();
  conflicts.forEach(r => {
    let d = new Date(r.debut + 'T00:00');
    const end = new Date(r.fin + 'T00:00');
    while(d <= end){ busy.add(toDateInputValue(d)); d.setDate(d.getDate()+1); }
  });
  // Parcourt la période demandée et retient la plus longue plage continue non occupée.
  let best = null, cur = null;
  let d = new Date(debut + 'T00:00');
  const end = new Date(fin + 'T00:00');
  while(d <= end){
    const key = toDateInputValue(d);
    if(busy.has(key)){ cur = null; }
    else {
      if(!cur) cur = { debut: key, fin: key };
      else cur.fin = key;
      if(!best || countWorkingDaysInRange(cur.debut, cur.fin) > countWorkingDaysInRange(best.debut, best.fin)) best = { ...cur };
    }
    d.setDate(d.getDate()+1);
  }
  return (best && countWorkingDaysInRange(best.debut, best.fin) > 0) ? best : null;
}
function applySuggestedLeaveRange(){
  const d = pendingLeaveRequestDraft; if(!d) return;
  const suggestion = suggestFreeRange(d.userId, d.debut, d.fin, d.id);
  if(!suggestion) return;
  d.debut = suggestion.debut; d.fin = suggestion.fin;
  render();
}

function withdrawLeaveRequest(reqId){
  const req_ = state.leaveRequests.find(r=>r.id===reqId);
  if(!req_ || req_.statut!=='en_attente') return;
  if(!confirm('Retirer cette demande ?')) return;
  state.leaveRequests = state.leaveRequests.filter(r=>r.id!==reqId);
  commit();
}
// Simule "et si ce congé était approuvé ?" sans rien changer réellement : compare le planning
// actuel à un planning hypothétique où cette demande précise est déjà approuvée, et relève toutes
// les pièces dont l'horaire de départ changerait. Permet de voir les conséquences avant de décider.
// Simule l'impact d'une demande de congé — qu'elle existe déjà (reprise par son id, ex. dans "À
// valider") ou qu'elle ne soit encore qu'un brouillon jamais enregistré (ex. avant même de valider
// une nouvelle demande). `reqLike` : { id?, userId, typeId, debut, fin }.
function simulateLeaveImpactForRequest(reqLike){
  const TOLERANCE_MS = 60000; // 1 minute — ignore le bruit d'arrondi des calculs de durée, pas un vrai décalage
  const scheduleBefore = computeSchedule(state);
  const hypothetical = JSON.parse(JSON.stringify(state));
  if(!hypothetical.leaveRequests) hypothetical.leaveRequests = [];
  const existingIdx = reqLike.id ? hypothetical.leaveRequests.findIndex(r=>r.id===reqLike.id) : -1;
  if(existingIdx >= 0){
    hypothetical.leaveRequests[existingIdx] = { ...hypothetical.leaveRequests[existingIdx], statut: 'approuve' };
  } else {
    hypothetical.leaveRequests.push({
      id: reqLike.id || 'preview', userId: reqLike.userId, typeId: reqLike.typeId,
      debut: reqLike.debut, fin: reqLike.fin, motif: reqLike.motif || '', statut: 'approuve'
    });
  }
  const scheduleAfter = computeSchedule(hypothetical);
  const beforeById = {};
  const cmdInfoBefore = {}; // id de commande -> { finEstimee } dans le planning actuel
  scheduleBefore.forEach(c => {
    cmdInfoBefore[c.id] = { finEstimee: c.finEstimee };
    c.pieces.forEach(p => { if(p && p.id) beforeById[p.id] = { ...p, commandeNom: c.nom }; });
  });
  const afterById = {};
  const cmdInfoAfter = {}; // id de commande -> { dateBesoin, finEstimee } dans le planning hypothétique
  scheduleAfter.forEach(c => {
    cmdInfoAfter[c.id] = { dateBesoin: c.dateBesoin, finEstimee: c.finEstimee };
    c.pieces.forEach(p => { if(p && p.id) afterById[p.id] = { ...p, commandeNom: c.nom, cid: c.id }; });
  });
  const affected = [];
  Object.keys(afterById).forEach(id => {
    const b = beforeById[id], a = afterById[id];
    if(!b || !a || !b.start || !a.start) return;
    if(!b.end || !a.end) return;
    const startDiff = Math.abs(b.start.getTime() - a.start.getTime());
    const endDiff = Math.abs(b.end.getTime() - a.end.getTime());
    if(startDiff > TOLERANCE_MS || endDiff > TOLERANCE_MS){
      const infoAfter = cmdInfoAfter[a.cid] || {};
      const infoBefore = cmdInfoBefore[a.cid] || {};
      const dateBesoinLimite = infoAfter.dateBesoin ? new Date(infoAfter.dateBesoin+'T23:59:59') : null;
      const enRetard = !!(dateBesoinLimite && infoAfter.finEstimee && infoAfter.finEstimee > dateBesoinLimite);
      const livraisonInchangee = !!(infoBefore.finEstimee && infoAfter.finEstimee
        && Math.abs(infoBefore.finEstimee.getTime() - infoAfter.finEstimee.getTime()) <= TOLERANCE_MS);
      affected.push({
        id, commandeNom: a.commandeNom, piece: a.piece, etape: a.etape, machineId: a.machineId,
        oldStart: b.start, oldEnd: b.end, newStart: a.start, newEnd: a.end,
        dateBesoin: infoAfter.dateBesoin || null, enRetard, livraisonInchangee
      });
    }
  });
  affected.sort((x,y) => x.newStart - y.newStart);
  return affected;
}
function simulateLeaveImpact(reqId){
  const req_ = state.leaveRequests.find(r=>r.id===reqId);
  if(!req_) return [];
  return simulateLeaveImpactForRequest(req_);
}
function decideLeaveRequest(reqId, statut){
  const req_ = state.leaveRequests.find(r=>r.id===reqId);
  if(!req_) return;
  let commentaire = '';
  if(statut==='refuse'){
    commentaire = prompt('Motif du refus (optionnel) :') || '';
  }
  req_.statut = statut;
  req_.traiteParUserId = currentUser ? String(currentUser.id) : null;
  req_.traiteLe = new Date().toISOString();
  req_.commentaireValidation = commentaire;
  commit();
  notifyUserOfDecision(req_);
  showToast(statut==='approuve' ? 'Demande approuvée.' : 'Demande refusée.');
}
// Révocation d'un congé déjà approuvé, réservée aux administrateurs. Toujours un avertissement
// clair sur les conséquences (suppression définitive, solde libéré, personne notifiée). Si la
// période est déjà passée, une SECONDE confirmation est exigée — supprimer un congé déjà pris
// revient à réécrire l'historique, ce qui mérite une vigilance supplémentaire.
async function notifyUserOfRevocation(req_){
  const type = leaveTypeById(req_.typeId);
  const subject = `Un congé approuvé a été révoqué`;
  const text = `Votre congé de "${type?type.nom:'congé'}" du ${formatDateFr(req_.debut)} au ${formatDateFr(req_.fin)}, précédemment approuvé, a été révoqué par un administrateur. Votre solde correspondant redevient disponible.`;
  try{ await fetch('/api/notify-user/'+req_.userId, { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ subject, text }) }); }catch(e){ /* non bloquant */ }
}
function revokeLeaveRequest(reqId){
  const req_ = state.leaveRequests.find(r=>r.id===reqId);
  if(!req_ || req_.statut!=='approuve') return;
  const t = leaveTypeById(req_.typeId);
  const requester = usersList.find(u=>String(u.id)===req_.userId);
  const nomPersonne = requester ? requester.username : 'cette personne';
  const nomType = t ? t.nom : 'congé';
  if(!confirm(`Révoquer le congé de "${nomType}" de ${nomPersonne} du ${formatDateFr(req_.debut)} au ${formatDateFr(req_.fin)} ?\n\nCette action est définitive : le congé sera entièrement supprimé et son solde redeviendra disponible. ${nomPersonne} sera notifié(e) par e-mail.`)) return;
  const today = toDateInputValue(new Date());
  if(req_.fin < today){
    if(!confirm(`⚠️ Attention : ce congé est déjà passé (terminé le ${formatDateFr(req_.fin)}).\n\nLe supprimer revient à réécrire un historique déjà consommé — assurez-vous que c'est bien volontaire.\n\nConfirmez une seconde fois pour continuer.`)) return;
  }
  notifyUserOfRevocation(req_);
  state.leaveRequests = state.leaveRequests.filter(r=>r.id!==reqId);
  commit();
  showToast('Congé révoqué.');
}
