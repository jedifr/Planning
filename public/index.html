  const subject = `Votre congé a été modifié`;
  const text = `Un administrateur a corrigé votre congé de "${oldType?oldType.nom:'congé'}" du ${formatDateFr(oldReq.debut)} au ${formatDateFr(oldReq.fin)}.\n\nIl est désormais enregistré comme "${newType?newType.nom:'congé'}" du ${formatDateFr(newReq.debut)} au ${formatDateFr(newReq.fin)}${newReq.motif?` (motif : ${newReq.motif})`:''}.`;
  try{ await fetch('/api/notify-user/'+newReq.userId, { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ subject, text }) }); }catch(e){ /* non bloquant */ }
}

// Un administrateur peut attribuer directement un congé à quelqu'un (déjà approuvé, sans passer
// par une demande) — utile pour enregistrer un accord donné oralement, ou poser un congé pour une
// personne qui n'a pas accès à l'appli.
function adminAssignLeave(){
  const uEl = document.getElementById('assign-leave-user');
  const tEl = document.getElementById('assign-leave-type');
  const dEl = document.getElementById('assign-leave-debut');
  const fEl = document.getElementById('assign-leave-fin');
  const mEl = document.getElementById('assign-leave-motif');
  const iEl = document.getElementById('assign-leave-imposer');
  if(!uEl || !tEl || !dEl || !fEl) return;
  const userId = uEl.value, typeId = tEl.value, debut = dEl.value, fin = fEl.value, motif = mEl?mEl.value.trim():'';
  const imposer = iEl ? !!iEl.checked : false;
  if(!userId){ alert('Merci de choisir une personne.'); return; }
  if(!typeId){ alert('Merci de choisir un type de congé.'); return; }
  if(!debut || !fin){ alert('Merci de renseigner une date de début et une date de fin.'); return; }
  if(fin < debut){ alert('La date de fin doit être postérieure ou égale à la date de début.'); return; }
  pendingLeaveRequestDraft = { userId, typeId, debut, fin, motif, mode: 'admin', imposer };
  render();
}
function addLeaveType(){
  const nom = prompt('Nom du nouveau type de congé (ex. "Congé sans solde") :');
  if(!nom || !nom.trim()) return;
  state.leaveTypes.push({ id: uid('lt'), nom: nom.trim(), couleur: '#6b7280' });
  commit();
}
function removeLeaveType(typeId){
  const usedElsewhere = state.leaveRequests.some(r=>r.typeId===typeId);
  if(usedElsewhere && !confirm('Ce type est déjà utilisé par des demandes existantes — les demandes resteront mais afficheront un type inconnu. Continuer ?')) return;
  state.leaveTypes = state.leaveTypes.filter(t=>t.id!==typeId);
  commit();
}
function updateLeaveTypeField(typeId, field, value){
  const t = leaveTypeById(typeId); if(!t) return;
  t[field] = value;
  commit();
}
function updateUserLeaveAllocation(userId, typeId, value){
  if(!state.userLeaveAllocations[userId]) state.userLeaveAllocations[userId] = {};
  state.userLeaveAllocations[userId][typeId] = Math.max(0, Number(value)||0);
  commit();
}
function toggleModuleConges(active){
  state.config.modules.conges = !!active;
  commit();
}

function submitNewCommande(){
  if(!draft.nom || !draft.nom.trim()){ alert("Merci d'indiquer une référence ou un nom de commande."); return; }
  if(!draft.dateBesoin){ alert("La date d'échéance est obligatoire."); return; }
  const incompleteQte = draft.pieces.filter(o => o.machineId && Number(o.tempsUnitaire) > 0 && !(Number(o.quantite) > 0));
  if(incompleteQte.length > 0){
    alert(`La quantité est obligatoire. Merci de la renseigner pour : ${incompleteQte.map(o=>o.piece.trim()||'(ligne sans nom)').join(', ')}.`);
    return;
  }
  const validOps = draft.pieces.filter(o => o.machineId && Number(o.tempsUnitaire) > 0 && Number(o.quantite) > 0);
  if(validOps.length === 0){ alert('Ajoutez au moins une ligne pièce/étape valide (machine, temps unitaire et quantité).'); return; }

  // Déduplique les lignes identiques saisies dans le même formulaire (même pièce + même étape)
  const seenInDraft = new Set();
  const dedupedOps = [];
  let skippedInDraft = 0;
  validOps.forEach(o => {
    const key = pieceDupKey(o.piece, o.etape);
    if(seenInDraft.has(key)){ skippedInDraft++; return; }
    seenInDraft.add(key);
    dedupedOps.push(o);
  });

  const nomTrim = draft.nom.trim();
  const existing = state.commandes.find(c => c.nom.trim().toLowerCase() === nomTrim.toLowerCase());

  if(existing){
    const seenExisting = new Set(existing.pieces.map(p => pieceDupKey(p.piece, p.etape)));
    const existingMaxPhase = existing.pieces.reduce((mx,p) => Math.max(mx, Number(p.phase)||1), 1);
    const toAdd = [];
    const skippedNames = [];
    dedupedOps.forEach(o => {
      const key = pieceDupKey(o.piece, o.etape);
      if(seenExisting.has(key)){ skippedNames.push([o.piece.trim(), o.etape.trim()].filter(Boolean).join(' / ')); return; }
      seenExisting.add(key);
      toAdd.push({
        id: o.id, piece: o.piece.trim(), etape: o.etape.trim(), machineId: o.machineId,
        tempsUnitaire: Number(o.tempsUnitaire), quantite: Number(o.quantite), statut: 'a_faire',
        manualStart: null, dureeOverrideH: null, debutReel: null, finReel: null, sessions: [], autoPaused: false,
        dependances: [], phase: (Number(o.phase)||1) + existingMaxPhase, // s'ajoute strictement après les phases déjà en place
        operatorUserId: o.operatorUserId || null, tempsUnitaireTheorique: Number(o.tempsUnitaire),
        dateDebutPossible: o.dateDebutPossible || null, dureeReelleH: null
      });
    });
    if(toAdd.length === 0){
      alert(`Toutes les lignes saisies existent déjà sur la commande "${existing.nom}" — rien à ajouter.`);
      return;
    }
    let msg = `Une commande "${existing.nom}" existe déjà.\n\n${toAdd.length} nouvelle(s) ligne(s) seront ajoutées à cette commande existante (rien n'est dupliqué).`;
    if(skippedNames.length) msg += `\n${skippedNames.length} ligne(s) déjà présente(s), ignorée(s) : ${skippedNames.join(', ')}.`;
    msg += `\n\nConfirmer ?`;
    if(!confirm(msg)) return;
    // Rejouable telle quelle sur une version fraîche de l'état en cas de conflit d'enregistrement :
    // on retrouve la commande par son nom, et on n'ajoute que les lignes qui n'y seraient pas déjà
    // (protège aussi contre une double-application si une tentative précédente avait déjà réussi).
    const applyFn = (targetState) => {
      const target = targetState.commandes.find(c => c.nom.trim().toLowerCase() === nomTrim.toLowerCase());
      if(target){
        const already = new Set(target.pieces.map(p=>p.id));
        toAdd.forEach(p => { if(!already.has(p.id)) target.pieces.push(p); });
      } else {
        targetState.commandes.push({ id: uid('c'), nom: nomTrim, dateBesoin: draft.dateBesoin, urgence: draft.urgence || 'normale', pieces: toAdd.slice() });
      }
    };
    applyFn(state);
    const fusionGroupsToApply = draft._fusionGroups || [];
    applyDraftFusionGroups(fusionGroupsToApply);
    draft = newDraft(); showNewForm = false;
    render();
    saveStateWithReapply(applyFn, 3);
    return;
  }

  const newCmd = {
    id: uid('c'), nom: nomTrim, dateBesoin: draft.dateBesoin, urgence: draft.urgence || 'normale',
    pieces: dedupedOps.map(o => ({
      id: o.id, piece: o.piece.trim(), etape: o.etape.trim(), machineId: o.machineId,
      tempsUnitaire: Number(o.tempsUnitaire), quantite: Number(o.quantite), statut: 'a_faire',
      manualStart: null, dureeOverrideH: null, debutReel: null, finReel: null, sessions: [], autoPaused: false,
      dependances: [], phase: Number(o.phase) || 1, operatorUserId: o.operatorUserId || null,
      tempsUnitaireTheorique: Number(o.tempsUnitaire), dateDebutPossible: o.dateDebutPossible || null,
      dureeReelleH: null
    }))
  };
  // Rejouable telle quelle sur une version fraîche en cas de conflit. Si, entre-temps, quelqu'un
  // d'autre a créé une commande du même nom, on fusionne nos lignes dedans (même règle de décalage
  // de phase que pour une fusion "normale") plutôt que de créer un doublon.
  const applyFn = (targetState) => {
    const already = targetState.commandes.find(c => c.id===newCmd.id || c.nom.trim().toLowerCase()===nomTrim.toLowerCase());
    if(already && already.id !== newCmd.id){
      const seenNow = new Set(already.pieces.map(p=>pieceDupKey(p.piece,p.etape)));
      const maxPhaseNow = already.pieces.reduce((mx,p)=>Math.max(mx,Number(p.phase)||1),1);
      newCmd.pieces.forEach(p => {
        const key = pieceDupKey(p.piece, p.etape);
        if(seenNow.has(key)) return;
        seenNow.add(key);
        already.pieces.push({ ...p, phase: (Number(p.phase)||1) + maxPhaseNow });
      });
    } else if(!already){
      targetState.commandes.push(newCmd);
    }
  };
  applyFn(state);
  const fusionGroupsToApply = draft._fusionGroups || [];
  applyDraftFusionGroups(fusionGroupsToApply);
  draft = newDraft(); showNewForm = false;
  render();
  saveStateWithReapply(applyFn, 3);
  if(skippedInDraft) showToast(`${skippedInDraft} ligne(s) en double dans le formulaire ont été ignorée(s).`);
}
// Applique réellement, une fois les pièces créées, les regroupements décidés dans le formulaire de
// nouvelle commande (bouton "Regrouper les lignes du même poste") — réutilise exactement le même
// mécanisme de fusion que le reste de l'application.
function applyDraftFusionGroups(groups){
  if(!groups || groups.length === 0) return;
  groups.forEach(ids => {
    const items = ids.map(findPieceLocation).filter(Boolean);
    if(items.length >= 2) performFusion(items, true); // l'enregistrement est fait par submitNewCommande
  });
}

function deleteCommande(id){
  const c = state.commandes.find(c=>c.id===id); if(!c) return;
  const hasDone = c.pieces.some(o=>o.statut==='termine');
  const message = hasDone
    ? `La commande "${c.nom}" contient des lignes TERMINÉES — la supprimer effacera aussi leur historique réel (temps passé, dates de fin). Confirmer la suppression ?`
    : `Supprimer la commande "${c.nom}" du planning ?`;
  if(!confirm(message)) return;
  state.commandes = state.commandes.filter(c => c.id !== id); commit();
}
function moveCommande(id, dir){
  const idx = state.commandes.findIndex(c => c.id===id);
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= state.commandes.length) return;
  const [item] = state.commandes.splice(idx,1);
  state.commandes.splice(newIdx,0,item);
  commit();
}
function updateCommandeField(cid, field, value){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  if(field==='dateBesoin' && !value){ alert("La date d'échéance est obligatoire — elle ne peut pas être vidée."); render(); return; }
  c[field] = value; commit();
}
function addOpToCommande(cid){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  const prev = c.pieces[c.pieces.length-1];
  c.pieces.push({ id: uid('op'), piece:'', etape:'', machineId: state.machines[0]?state.machines[0].id:'', tempsUnitaire:0, quantite:1, statut:'a_faire', manualStart:null, dureeOverrideH:null, debutReel:null, finReel:null, sessions:[], autoPaused:false, dependances:[], phase: prev ? (Number(prev.phase)||1)+1 : 1, tempsUnitaireTheorique:0, dureeReelleH:null });
  commit();
}
function removeOpFromCommande(cid, oid){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  if(c.pieces.length<=1){ alert('Une commande doit conserver au moins une ligne. Supprimez plutôt la commande entière si besoin.'); return; }
  const o = c.pieces.find(o=>o.id===oid); if(!o) return;
  const label = [o.piece, o.etape].filter(Boolean).join(' — ') || 'cette ligne';
  const message = o.statut==='termine'
    ? `"${label}" est marquée TERMINÉE — la supprimer effacera aussi son historique réel (temps passé, date de fin). Confirmer la suppression ?`
    : `Supprimer la ligne "${label}" ? Cette action est irréversible.`;
  if(!confirm(message)) return;
  c.pieces = c.pieces.filter(o=>o.id!==oid); commit();
}
function updateOpField(cid, oid, field, value){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  const o = c.pieces.find(o=>o.id===oid); if(!o) return;
  if(field==='operatorUserId'){ o.operatorUserId = value || null; commit(); return; }
  o[field] = (field==='tempsUnitaire'||field==='quantite') ? Number(value) : value;
  if(field==='tempsUnitaire' || field==='quantite') o.dureeOverrideH = null;
  if(field==='tempsUnitaire' && !(o.tempsUnitaireTheorique > 0)){
    // toute première vraie saisie sur une ligne encore vide : elle devient la référence théorique,
    // ce n'est pas encore une "modification".
    o.tempsUnitaireTheorique = Number(value);
  }
  if(field==='piece' || field==='etape'){
    const key = pieceDupKey(o.piece, o.etape);
    const dup = c.pieces.some(other => other.id!==o.id && pieceDupKey(other.piece, other.etape)===key);
    if(dup) showToast(`⚠ "${o.piece}"${o.etape?' / '+o.etape:''} existe déjà sur cette commande — vérifiez qu'il ne s'agit pas d'un doublon.`);
  }
  commit();
}
function updateOpPhase(cid, oid, value){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  const o = c.pieces.find(o=>o.id===oid); if(!o) return;
  const val = Math.max(1, Math.round(Number(value)) || 1);
  o.phase = val;
  commit();
}
function updateOpDateDebutPossible(cid, oid, value){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  const o = c.pieces.find(o=>o.id===oid); if(!o) return;
  o.dateDebutPossible = value || null;
  commit();
}
function toggleOpSousTraitance(cid, oid, checked){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  const o = c.pieces.find(o=>o.id===oid); if(!o) return;
  o.sousTraitance = !!checked;
  commit();
}
function updateOpDuree(cid, oid, value){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  const o = c.pieces.find(o=>o.id===oid); if(!o) return;
  const val = Number(String(value).replace(',','.'));
  if(!isNaN(val) && val > 0 && o.quantite > 0){
    o.tempsUnitaire = (val*60) / o.quantite; // le temps unitaire (min) se recalcule automatiquement
    o.dureeOverrideH = null;
  }
  commit();
}
// Répercute un changement sur toutes les pièces d'un même groupe fusionné (sauf la pièce d'origine,
// déjà modifiée par l'appelant) — utilisé par le glisser-déposer et le redimensionnement, pour que
// le groupe reste toujours parfaitement synchronisé (même horaire, même durée, même poste).
function propagateFusionGroupFields(o, fields){
  if(!o.fusionGroupId) return;
  state.commandes.forEach(cc => cc.pieces.forEach(oo => {
    if(oo.id !== o.id && oo.fusionGroupId === o.fusionGroupId) Object.assign(oo, fields);
  }));
}
function opElapsedHours(o, st){
  if(!o.sessions || o.sessions.length===0) return 0;
  const cfg = configForPiece(o, st);
  const now = new Date();
  let total = 0;
  o.sessions.forEach(s => {
    const start = new Date(s.debut);
    const end = s.fin ? new Date(s.fin) : now;
    if(end > start) total += workingHoursBetween(start, end, cfg); // n'accumule que le temps de travail réel (hors nuits/week-ends/pause)
  });
  return total;
}
// Temps réellement passé (heures, pour la quantité totale) : dérivé des sessions quand elles existent
// (toujours à jour, y compris tant que la tâche est en cours) ; sinon, valeur secours saisie manuellement
// à la clôture (o.dureeReelleH — cas d'une tâche jamais passée par Démarrer/Reprendre, ex. import déjà
// terminé). Renvoie null si le temps passé n'a jamais été mesuré ni saisi.
function dureePasseeH(o, st){
  const elapsedH = opElapsedHours(o, st);
  if(elapsedH > 1e-6) return elapsedH;
  return (o.dureeReelleH!=null && o.dureeReelleH>0) ? o.dureeReelleH : null;
}
function isInPauseWindow(op, now, st){
  const cfg = configForPiece(op, st);
  const pause = pauseWindowFor(now, cfg);
  return !!(pause && now >= pause.start && now < pause.end);
}
// Bascule automatiquement en pause les tâches en cours dont le poste entre en pause déjeuner,
// et reprend automatiquement celles qui avaient été mises en pause de cette façon (jamais les pauses manuelles).
function applyAutoPauseResume(st){
  let changed = false;
  const now = new Date();
  st.commandes.forEach(c => {
    c.pieces.forEach(o => {
      if(!o.machineId) return;
      const inPause = isInPauseWindow(o, now, st);
      if(o.statut === 'en_cours' && inPause){
        const cfg = configForPiece(o, st);
        const pause = pauseWindowFor(now, cfg);
        const open = (o.sessions||[]).find(s => !s.fin);
        if(open) open.fin = toInputValue(pause.start);
        o.statut = 'en_pause';
        o.autoPaused = true;
        changed = true;
      } else if(o.statut === 'en_pause' && o.autoPaused && !inPause){
        if(!o.sessions) o.sessions = [];
        o.sessions.push({ debut: toInputValue(now), fin: null });
        o.statut = 'en_cours';
        o.autoPaused = false;
        changed = true;
      }
    });
  });
  return changed;
}
// Applique un changement de statut à UNE pièce précise (logique inchangée, extraite pour pouvoir
// être rejouée sur chaque pièce d'un groupe fusionné). `plannedEndBefore` sert uniquement à détecter
// une fin en avance ; passé pré-calculé par l'appelant.
function applySingleStatusChange(c, o, newStatut, nowStr, plannedEndBefore){
  const prev = o.statut;
  if(!o.sessions) o.sessions = [];

  if(newStatut === 'en_cours'){
    if(prev === 'a_faire'){
      o.debutReel = nowStr;
      o.manualStart = nowStr; // la tâche démarre réellement maintenant : on fige son début
    }
    if(o.machineId && isInPauseWindow(o, new Date(), state)){
      // on démarre/reprend en pleine pause déjeuner : elle part directement en pause automatique
      o.statut = 'en_pause';
      o.autoPaused = true;
    } else {
      o.sessions.push({ debut: nowStr, fin: null }); // ouvre une session (démarrage ou reprise après pause)
      o.statut = 'en_cours';
      o.autoPaused = false;
    }
  } else if(newStatut === 'en_pause'){
    const open = o.sessions.find(s => !s.fin);
    if(open) open.fin = nowStr; // ferme la session en cours ; le temps de pause ne sera jamais comptabilisé
    o.statut = 'en_pause';
    o.autoPaused = false; // pause déclenchée manuellement : ne sera pas reprise automatiquement
  } else if(newStatut === 'termine'){
    const open = o.sessions.find(s => !s.fin);
    if(open) open.fin = nowStr;

    // Le temps prévu (tempsUnitaire) n'est plus jamais modifié ici — seul le temps réellement passé
    // est enregistré à part (voir dureePasseeH), pour que "prévu" et "passé" restent deux valeurs
    // distinctes même une fois la tâche terminée.
    if(opElapsedHours(o, state) <= 1e-6){
      // jamais démarrée via Démarrer/Reprendre (ex. import déjà terminé, sans session) : on demande
      // la saisie manuelle du temps réellement passé, faute de pouvoir le déduire des sessions.
      const plannedTotal = (o.dureeOverrideH!=null && o.dureeOverrideH>0) ? o.dureeOverrideH*60 : (o.tempsUnitaire*o.quantite);
      const input = prompt(`Temps réellement passé pour "${[o.piece,o.etape].filter(Boolean).join(' / ')}" (en minutes, pour la quantité totale) :`, Math.round(plannedTotal));
      if(input !== null){
        const val = Number(String(input).replace(',','.'));
        if(!isNaN(val) && val > 0){
          o.dureeReelleH = val / 60;
        }
      }
    }
    const m = state.machines.find(m=>m.id===o.machineId);
    if(!o.debutReel){ o.debutReel = m ? m.dispo : null; }
    o.finReel = nowStr;
    if(m){
      const now = new Date();
      const currentDispo = new Date(m.dispo);
      if(now > currentDispo) m.dispo = toInputValue(now);
    }
    o.statut = 'termine';
    if(plannedEndBefore){
      const now = new Date();
      const diffH = (plannedEndBefore - now) / 3600000;
      if(diffH > 0.05) return diffH; // au moins quelques minutes d'avance — remonté à l'appelant pour le toast
    }
  } else if(newStatut === 'a_faire'){
    o.statut = 'a_faire';
    o.debutReel = null;
    o.finReel = null;
    o.sessions = [];
    o.autoPaused = false;
  }
  return null;
}
function setOpStatut(cid, oid, newStatut){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  const o = c.pieces.find(o=>o.id===oid); if(!o) return;
  const prev = o.statut;
  if(newStatut === prev) return;

  // Une pièce fusionnée (découpée en même temps que d'autres, parfois d'autres commandes) change de
  // statut EN MÊME TEMPS que tout son groupe — physiquement, c'est une seule et même opération.
  const group = [];
  if(o.fusionGroupId){
    state.commandes.forEach(cc => cc.pieces.forEach(oo => { if(oo.fusionGroupId === o.fusionGroupId) group.push({ cc, oo }); }));
  } else {
    group.push({ cc: c, oo: o });
  }

  if(newStatut === 'en_cours' && prev === 'a_faire'){
    // Avertit si une pièce de phase inférieure n'est pas encore terminée — un seul message
    // consolidé pour tout le groupe, sans bloquer : il peut arriver qu'on démarre quand même.
    const messages = [];
    group.forEach(({cc, oo}) => {
      const depsMap = resolveEffectiveDeps(cc.pieces);
      const unfinishedDeps = (depsMap[oo.id]||[]).map(depId => cc.pieces.find(p=>p.id===depId)).filter(dep => dep && dep.statut !== 'termine');
      if(unfinishedDeps.length > 0){
        const noms = unfinishedDeps.map(dep => [dep.piece, dep.etape].filter(Boolean).join(' / ') || '(sans nom)').join(', ');
        messages.push(`"${[oo.piece,oo.etape].filter(Boolean).join(' / ')}" (${cc.nom}) : ${noms}`);
      }
    });
    if(messages.length > 0){
      if(!confirm(`Attention : certaines pièces de phase inférieure ne sont pas encore terminées :\n${messages.join('\n')}\n\nDémarrer quand même ?`)) return;
    }
  }

  const plannedEndsBefore = {};
  if(newStatut === 'termine'){
    const scheduleBefore = computeSchedule(state);
    group.forEach(({cc, oo}) => {
      if(oo.statut === 'en_cours' || oo.statut === 'en_pause'){
        const cBefore = scheduleBefore.find(x=>x.id===cc.id);
        const opBefore = cBefore && cBefore.pieces.find(p=>p.id===oo.id);
        if(opBefore && opBefore.end) plannedEndsBefore[oo.id] = opBefore.end;
      }
    });
  }

  const nowStr = toInputValue(new Date());
  let maxAdvanceH = 0;
  group.forEach(({cc, oo}) => {
    const diffH = applySingleStatusChange(cc, oo, newStatut, nowStr, plannedEndsBefore[oo.id]);
    if(diffH && diffH > maxAdvanceH) maxAdvanceH = diffH;
  });
  if(maxAdvanceH > 0){
    showToast(`Terminée ${durationLabel(maxAdvanceH)} en avance — les tâches non figées viennent de se recaler automatiquement.`);
  }
  commit();
}
function setManualStartValue(cid, oid, value){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  const o = c.pieces.find(o=>o.id===oid); if(!o) return;
  if(!value) return;
  o.manualStart = value; // déjà au format attendu (YYYY-MM-DDTHH:mm)
  propagateFusionGroupFields(o, { manualStart: value });
  commit();
}
function resetOpOverride(cid, oid){
  const c = state.commandes.find(c=>c.id===cid); if(!c) return;
  const o = c.pieces.find(o=>o.id===oid); if(!o) return;
  if(o.fusionGroupId){
    // Pièce fusionnée : "libérer" = revenir au calcul automatique, PAS défaire le regroupement
    // (les pièces sont physiquement découpées ensemble). On libère donc tout le groupe, puis on le
    // refige aussitôt à sa nouvelle position naturelle, pour qu'il reste solidaire.
    const groupId = o.fusionGroupId;
    const members = [];
    state.commandes.forEach(cc => cc.pieces.forEach(oo => {
      if(oo.fusionGroupId === groupId){
        oo.manualStart = null; oo.dureeOverrideH = null; oo.fusionGroupId = null;
        // durée individuelle retrouvée après libération (le temps unitaire reprend la main)
        members.push({ cid: cc.id, oid: oo.id, dureeH: (oo.tempsUnitaire*oo.quantite)/60 });
      }
    }));
    if(members.length >= 2){
      performFusion(members); // enregistre déjà lui-même : pas de second commit ici, sinon la
                              // seconde sauvegarde part avec une version périmée et déclenche à
                              // tort le message "quelqu'un d'autre a modifié le planning".
    } else {
      commit();
    }
    return;
  }
  o.manualStart = null; o.dureeOverrideH = null;
  commit();
}
// Fige une tâche volante pile à son horaire actuellement calculé (celui affiché dans le planning).
function pinOpAtCurrentTime(cid, oid){
  const schedule = computeSchedule(state);
  const cSched = schedule.find(cc=>cc.id===cid);
  const oSched = cSched && cSched.pieces.find(pp=>pp.id===oid);
  if(!oSched || !oSched.start) return;
  const c = state.commandes.find(cc=>cc.id===cid); if(!c) return;
  const o = c.pieces.find(pp=>pp.id===oid); if(!o) return;
  o.manualStart = toInputValue(oSched.start);
  commit();
}
const URGENCY_RANK = { urgente: 0, importante: 1, normale: 2 };
function sortByPriority(){
  state.commandes.sort((a,b)=>{
    const ra = URGENCY_RANK[a.urgence] !== undefined ? URGENCY_RANK[a.urgence] : 2;
    const rb = URGENCY_RANK[b.urgence] !== undefined ? URGENCY_RANK[b.urgence] : 2;
    if(ra !== rb) return ra - rb; // l'urgence prime sur le délai
    if(!a.dateBesoin && !b.dateBesoin) return 0;
    if(!a.dateBesoin) return 1;
    if(!b.dateBesoin) return -1;
    return a.dateBesoin.localeCompare(b.dateBesoin);
  });
  commit();
}

// Reconnaît indifféremment une vraie date Excel, le format français JJ/MM/AAAA (ou JJ-MM-AAAA),
// ou le format ISO AAAA-MM-JJ (celui des anciens modèles déjà en circulation) — retourne toujours
// une valeur AAAA-MM-JJ en interne (format de stockage), ou '' si rien n'a pu être reconnu.
function parseFlexibleDate(raw){
  if(raw instanceof Date && !isNaN(raw)) return toDateInputValue(raw);
  if(typeof raw !== 'string' || !raw.trim()) return '';
  const s = raw.trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); // JJ/MM/AAAA ou JJ-MM-AAAA
  if(m){
    const dd = Number(m[1]), mm = Number(m[2]), yyyy = Number(m[3]);
    const d = new Date(yyyy, mm-1, dd);
    if(!isNaN(d) && d.getMonth()===mm-1 && d.getDate()===dd) return toDateInputValue(d); // rejette un 32/13 par ex.
    return '';
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); // AAAA-MM-JJ (ISO)
  if(m){
    const parsed = new Date(s+'T00:00:00');
    if(!isNaN(parsed)) return toDateInputValue(parsed);
  }
  return '';
}
function normalizeHeaderKey(row, candidates){
  const keys = Object.keys(row);
  for(const cand of candidates){
    const found = keys.find(k => k.trim().toLowerCase() === cand.toLowerCase());
    if(found) return found;
  }
  return null;
}

// Construit les groupes de pièces par référence de commande, à partir de lignes DÉJÀ résolues
// (kRef etc. sont les noms de colonnes réels à utiliser) — ne modifie rien dans state, se contente
// de calculer. Réutilisée par l'import standard ET par l'import personnalisé (qui l'appelle après
// avoir traduit ses propres colonnes vers ces mêmes clés), pour ne jamais dupliquer cette logique.
function buildImportGroups(rows, kRef, kDate, kUrg, kPoste, kPiece, kEtape, kTU, kQte, kPhase, kOperateur, kMatiere, kEpaisseur, kGroupTag, kSousTraitance){
  const errors = [];
  const duplicateLines = []; // doublons pièce/étape (dans le fichier ou déjà présents sur la commande)
  const groups = {}; // référence commande -> { dateBesoin, urgence, pieces: [], seen: Set }
  const machineByName = {};
  state.machines.forEach(m => { machineByName[m.nom.trim().toLowerCase()] = m; });
  const userByName = {};
  usersList.forEach(u => { userByName[u.username.trim().toLowerCase()] = u; });
  const existingByNom = {};
  state.commandes.forEach(c => { existingByNom[c.nom.trim().toLowerCase()] = c; });

  const pieceKey = (piece, etape) => piece.trim().toLowerCase() + '|' + etape.trim().toLowerCase();

  rows.forEach((row, idx) => {
    const lineNo = idx + 2; // ligne 1 = en-têtes
    const ref = String(row[kRef]||'').trim();
    if(!ref){ errors.push(`Ligne ${lineNo} : référence commande manquante — ignorée.`); return; }
    const stRaw = kSousTraitance ? String(row[kSousTraitance]||'').trim().toLowerCase() : '';
    const isSousTraitance = ['1','oui','x','true','vrai'].includes(stRaw);
    const posteNom = String(row[kPoste]||'').trim();
    const machine = machineByName[posteNom.toLowerCase()];
    // Une pièce sous-traitée n'a besoin ni de poste (elle n'en occupe aucun) ni de temps unitaire
    // (souvent inconnu — le sous-traitant ne le communique pas) : ces deux exigences ne s'appliquent
    // qu'aux pièces réellement planifiées en interne.
    if(!machine && !isSousTraitance){ errors.push(`Ligne ${lineNo} : poste "${posteNom}" introuvable — ligne ignorée.`); return; }
    const piece = String(row[kPiece]||'').trim();
    if(!piece){ errors.push(`Ligne ${lineNo} : nom de pièce manquant — ignorée.`); return; }
    const etape = String(row[kEtape]||'').trim();
    let tu = Number(row[kTU]);
    let qte = Number(row[kQte]);
    if(isSousTraitance){
      if(!tu || tu<=0) tu = 0;
      if(!qte || qte<=0) qte = 1;
    } else if(!tu || tu<=0 || !qte || qte<=0){
      errors.push(`Ligne ${lineNo} : temps unitaire ou quantité invalide — ligne ignorée.`); return;
    }

    if(!groups[ref]){
      let dateBesoin = parseFlexibleDate(row[kDate]);
      let urgence = String(row[kUrg]||'normale').trim().toLowerCase();
      if(!['normale','importante','urgente'].includes(urgence)) urgence = 'normale';
      const existing = existingByNom[ref.toLowerCase()];
      const seen = new Set();
      if(existing) existing.pieces.forEach(p => seen.add(pieceKey(p.piece||'', p.etape||'')));
      groups[ref] = { dateBesoin, urgence, pieces: [], seen, existing };
    }

    const key = pieceKey(piece, etape);
    if(groups[ref].seen.has(key)){
      duplicateLines.push(`Ligne ${lineNo} : "${piece}"${etape?' / '+etape:''} existe déjà sur "${ref}" — ligne ignorée.`);
      return;
    }
    groups[ref].seen.add(key);
    let phase = kPhase ? Number(row[kPhase]) : 1;
    if(!phase || phase < 1) phase = 1;
    const operateurNom = kOperateur ? String(row[kOperateur]||'').trim() : '';
    const operateur = operateurNom ? userByName[operateurNom.toLowerCase()] : null;
    const matiere = kMatiere ? String(row[kMatiere]||'').trim() : '';
    const epaisseur = kEpaisseur ? String(row[kEpaisseur]||'').trim() : '';
    const groupTag = kGroupTag ? String(row[kGroupTag]||'').trim() : '';
    groups[ref].pieces.push({
      id: uid('op'), piece, etape, machineId: machine ? machine.id : null,
      tempsUnitaire: tu, quantite: qte, statut:'a_faire', manualStart:null, dureeOverrideH:null,
      debutReel:null, finReel:null, sessions:[], autoPaused:false, dependances:[], phase,
      operatorUserId: operateur ? String(operateur.id) : null, tempsUnitaireTheorique: tu, dureeReelleH: null,
      matiere, epaisseur, dateDebutPossible: null, sousTraitance: isSousTraitance, fusionGroupId: null,
      _importGroupTag: groupTag || null // étiquette temporaire, jamais conservée après l'import (voir confirmCustomImport)
    });
  });
  return { groups, errors, duplicateLines };
}
// Enregistre réellement les groupes construits par buildImportGroups (création ou fusion des
// commandes) — ne fait AUCUNE validation, tout doit déjà avoir été vérifié en amont.
// Prend un état cible en paramètre (pas le state global) pour pouvoir être rejouée telle quelle
// sur une version fraîche en cas de conflit d'enregistrement — comme pour la création manuelle
// d'une commande. Retrouve "g.existing" par son nom DANS l'état cible, plutôt que de se fier à une
// référence figée au moment de l'analyse du fichier (qui deviendrait obsolète après un rejeu).
function commitImportGroups(targetState, groups){
  let sansEcheance = 0;
  const createdNoms = [];
  const updatedNoms = [];
  Object.keys(groups).forEach(ref => {
    const g = groups[ref];
    if(g.pieces.length===0) return; // toutes les lignes de cette référence étaient des doublons
    const existing = targetState.commandes.find(c => c.nom.trim().toLowerCase() === ref.trim().toLowerCase());
    if(existing){
      const alreadyIds = new Set(existing.pieces.map(p=>p.id));
      const newOnes = g.pieces.filter(p => !alreadyIds.has(p.id));
      if(newOnes.length === 0) return; // déjà appliqué lors d'une précédente tentative rejouée
      const existingMaxPhase = existing.pieces.reduce((mx,p) => Math.max(mx, Number(p.phase)||1), 1);
      const toAdd = newOnes.map(p => ({ ...p, phase: (Number(p.phase)||1) + existingMaxPhase })); // s'ajoute strictement après les phases déjà en place
      existing.pieces.push(...toAdd);
      updatedNoms.push({ nom: ref, nbAjoutees: toAdd.length });
      return;
    }
    if(!g.dateBesoin){
      sansEcheance++;
      const d = new Date(); d.setDate(d.getDate()+14);
      g.dateBesoin = toDateInputValue(d); // échéance provisoire, à corriger manuellement
    }
    targetState.commandes.push({ id: uid('c'), nom: ref, dateBesoin: g.dateBesoin, urgence: g.urgence, pieces: g.pieces.map(p=>({...p})) });
    createdNoms.push({ nom: ref, dateBesoin: g.dateBesoin, urgence: g.urgence, nbPieces: g.pieces.length });
  });
  return { createdNoms, updatedNoms, sansEcheance };
}
function processExcelImportRows(rows){
  if(!rows.length){ alert('Le fichier ne contient aucune ligne de données.'); return; }
  const sample = rows[0];
  const kRef = normalizeHeaderKey(sample, ['Référence commande','Reference commande','Commande']);
  const kDate = normalizeHeaderKey(sample, ['Date de besoin (JJ/MM/AAAA)','Date de besoin (AAAA-MM-JJ)','Date de besoin','Echeance','Échéance']);
  const kUrg = normalizeHeaderKey(sample, ['Urgence']);
  const kPoste = normalizeHeaderKey(sample, ['Poste','Machine']);
  const kPiece = normalizeHeaderKey(sample, ['Pièce','Piece']);
  const kEtape = normalizeHeaderKey(sample, ['Étape','Etape']);
  const kTU = normalizeHeaderKey(sample, ['Temps unitaire (min)','Temps unitaire','Temps unitaire (minutes)']);
  const kQte = normalizeHeaderKey(sample, ['Quantité','Quantite','Qté','Qte']);
  const kPhase = normalizeHeaderKey(sample, ['Phase']);
  const kOperateur = normalizeHeaderKey(sample, ['Opérateur','Operateur']);
  const kMatiere = normalizeHeaderKey(sample, ['Matière','Matiere']);
  const kEpaisseur = normalizeHeaderKey(sample, ['Épaisseur','Epaisseur']);
  const kSousTraitance = normalizeHeaderKey(sample, ['Sous-traitance','Sous traitance','Sous-traité','Sous traite']);

  if(!kRef || !kPiece || !kPoste || !kTU || !kQte){
    alert("Colonnes obligatoires manquantes dans le fichier. Il faut au minimum : Référence commande, Poste, Pièce, Temps unitaire (min), Quantité.\n\nTéléchargez le modèle si besoin (bouton « 📋 Modèle Excel »).");
    return;
  }

  const { groups, errors, duplicateLines } = buildImportGroups(rows, kRef, kDate, kUrg, kPoste, kPiece, kEtape, kTU, kQte, kPhase, kOperateur, kMatiere, kEpaisseur, null, kSousTraitance);

  const refs = Object.keys(groups);
  if(refs.length===0){
    excelImportResult = { imported:0, updated:0, pieces:0, sansEcheance:0, errors, duplicateLines, refs:[], updatedRefs:[] };
    render();
    return;
  }

  const { createdNoms, updatedNoms, sansEcheance } = commitImportGroups(state, groups);

  commit();

  excelImportResult = {
    imported: createdNoms.length,
    updated: updatedNoms.length,
    pieces: createdNoms.reduce((s,c)=>s+c.nbPieces,0) + updatedNoms.reduce((s,c)=>s+c.nbAjoutees,0),
    sansEcheance, errors, duplicateLines, refs: createdNoms, updatedRefs: updatedNoms
  };
  render();
}

function applyImportProfile(profileId){
  if(!customImportState) return;
  if(!profileId){ customImportState.profileId = null; customImportState.profileName = ''; customImportState.profileMapSnapshot = null; render(); return; }
  const p = state.importProfiles.find(pp=>pp.id===profileId);
  if(!p) return;
  customImportState.profileId = p.id;
  customImportState.profileName = p.nom;
  customImportState.map = { ...p.map };
  if(!customImportState.map.defaultOperatorByMachine) customImportState.map.defaultOperatorByMachine = {}; // profil créé avant l'ajout de ce réglage
  if(customImportState.map.reference2 === undefined) customImportState.map.reference2 = '';       // profil créé avant la référence composée
  if(customImportState.map.reference2Sep === undefined) customImportState.map.reference2Sep = ' ';
  // Reclasse les clés du profil (valeurs brutes du fichier) selon la même normalisation que le
  // reste de l'import — un profil enregistré avant l'ajout de cette normalisation avait ses clés
  // dans la casse d'origine, ce qui les rendait invisibles aux comparaisons normalisées actuelles.
  const renormalize = (obj) => { const out = {}; Object.keys(obj||{}).forEach(k => { out[normPosteKey(k)] = obj[k]; }); return out; };
  customImportState.posteMapping = renormalize(p.posteMapping);
  customImportState.groupByValue = renormalize(p.groupByValue);
  customImportState.sousTraitanceByValue = renormalize(p.sousTraitanceByValue);
  customImportState.profileMapSnapshot = JSON.stringify(customImportState.map); // référence pour détecter un changement non enregistré
  render();
}

function proceedFromMapping(){
  const cs = customImportState;
  const m = cs.map;
  if(!m.reference){ alert('Merci de choisir la colonne "Référence commande".'); return; }
  if(!m.poste){ alert('Merci de choisir la colonne "Poste".'); return; }
  if(!m.piece){ alert('Merci de choisir la colonne "Pièce".'); return; }
  if(!m.quantite){ alert('Merci de choisir la colonne "Quantité".'); return; }
  if(!m.dureeColonne){ alert('Merci de choisir la colonne de temps ou de durée.'); return; }
  // Correspondance modifiée par rapport au profil chargé : on le détecte et on demande si ça doit
  // être enregistré tout de suite dans le profil, plutôt que d'attendre silencieusement la fin de
  // l'import (comme c'était le cas jusqu'ici).
  if(cs.profileId && cs.profileMapSnapshot && JSON.stringify(cs.map) !== cs.profileMapSnapshot){
    if(confirm(`Vous avez modifié la correspondance des colonnes de "${cs.profileName}".\n\nEnregistrer ces changements dans ce profil ?`)){
      const p = state.importProfiles.find(pp=>pp.id===cs.profileId);
      if(p){ p.map = { ...cs.map }; commit(); }
    }
    cs.profileMapSnapshot = JSON.stringify(cs.map); // ne redemande plus pour ces mêmes valeurs
  }
  const distinctPostes = {}; // clé normalisée -> premier texte original rencontré (pour l'affichage)
  cs.rows.forEach(row => {
    const raw = String(row[m.poste]||'').trim();
    if(!raw) return;
    const key = normPosteKey(raw);
    if(!distinctPostes[key]) distinctPostes[key] = raw;
  });
  cs.posteValues = Object.keys(distinctPostes).sort();
  cs.posteValueLabels = distinctPostes; // clé normalisée -> texte original, pour l'affichage uniquement
  // Pré-remplit ce qui correspond déjà exactement à un poste existant — le reste attend une
  // association manuelle, comme demandé : jamais de création automatique.
  const machineByName = {};
  state.machines.forEach(mm => { machineByName[mm.nom.trim().toLowerCase()] = mm.id; });
  cs.posteValues.forEach(v => {
    if(!cs.posteMapping[v]){
      const exact = machineByName[v.trim().toLowerCase()];
      if(exact) cs.posteMapping[v] = exact;
      else if(m.defaultMachineId) cs.posteMapping[v] = m.defaultMachineId; // reste modifiable ou remettable à "— à associer —" ensuite
    }
  });
  cs.step = 'postes';
  render();
}
function updateCustomImportPosteMap(rawValue, machineId){
  if(!customImportState) return;
  if(machineId) customImportState.posteMapping[rawValue] = machineId;
  else delete customImportState.posteMapping[rawValue];
  // Si le poste choisi contient "sous-traitance" dans son nom, la case "Sous-traité" se coche
  // automatiquement pour cette valeur — reste modifiable si ce n'est pas ce qui était voulu.
  if(machineId){
    const m = state.machines.find(mm=>mm.id===machineId);
    if(m){
      const n = m.nom.toLowerCase();
      if(n.includes('sous-traitance') || n.includes('sous traitance')) customImportState.sousTraitanceByValue[rawValue] = true;
    }
  }
  render();

function backToMappingStep(){

// Traduit une ligne brute (colonnes du fichier source) vers les en-têtes canoniques attendues par
// buildImportGroups — c'est ce qui permet de réutiliser telle quelle la même logique éprouvée que
// l'import standard, sans rien dupliquer.
// Clé normalisée pour comparer une valeur brute du fichier — insensible à la casse et aux espaces,
// pour éviter que "Laser 2D" et "laser 2d" soient traités comme deux valeurs différentes.
function normPosteKey(v){ return String(v||'').trim().toLowerCase(); }
function transformCustomRow(row, map, posteMapping, groupByValue, sousTraitanceByValue){
  let ref = String(row[map.reference]||'').trim();
  if(map.referenceSplitSlash && ref.lastIndexOf('/') > 0){
    ref = ref.slice(0, ref.lastIndexOf('/'));
  }
  // Référence composée de deux colonnes (ex. "Code OF" + "Client" → "C026-0669 BH2M"). Le découpage
  // sur le "/" ne concerne que la colonne principale, qui porte le numéro d'OF ; le complément est
  // ajouté ensuite. S'il est vide sur une ligne, la référence reste simplement celle de base.
  if(map.reference2){
    const suffixe = String(row[map.reference2]||'').trim();
    if(suffixe) ref = ref + (map.reference2Sep !== undefined ? map.reference2Sep : ' ') + suffixe;
  }
  const posteRaw = normPosteKey(row[map.poste]);
  const machineId = posteMapping[posteRaw] || null;
  const machine = machineId ? state.machines.find(mm=>mm.id===machineId) : null;
  const quantite = Number(row[map.quantite]) || 0;
  let tempsUnitaire = 0;
  if(map.dureeMode === 'total'){
    const totalH = Number(row[map.dureeColonne]) || 0;
    tempsUnitaire = quantite > 0 ? (totalH * 60) / quantite : 0;
  } else {
    tempsUnitaire = Number(row[map.dureeColonne]) || 0;
  }
  // Opérateur : celui du fichier si présent, sinon l'opérateur par défaut réglé pour LE POSTE
  // résolu de cette ligne (converti en nom, puisque buildImportGroups résout les opérateurs par nom
  // comme le reste de l'import).
  let operateurNom = map.operateur ? String(row[map.operateur]||'').trim() : '';
  if(!operateurNom && machineId && map.defaultOperatorByMachine && map.defaultOperatorByMachine[machineId]){
    const defaultUser = usersList.find(u=>String(u.id)===map.defaultOperatorByMachine[machineId]);
    if(defaultUser) operateurNom = defaultUser.username;
  }
  return {
    'Référence commande': ref,
    'Date de besoin (JJ/MM/AAAA)': map.dateBesoin ? row[map.dateBesoin] : '',
    'Urgence': map.urgence ? row[map.urgence] : '',
    'Poste': machine ? machine.nom : '', // vide si non associé -> buildImportGroups la rejette proprement, avec un message clair
    'Pièce': map.piece ? row[map.piece] : '',
    'Étape': map.etape ? row[map.etape] : '',
    'Temps unitaire (min)': tempsUnitaire,
    'Quantité': quantite,
    'Phase': map.phase ? row[map.phase] : '',
    'Opérateur': operateurNom,
    'Matière': map.matiere ? row[map.matiere] : '',
    'Épaisseur': map.epaisseur ? row[map.epaisseur] : '',
    // Étiquette temporaire (jamais enregistrée telle quelle) servant uniquement à retrouver, après
    // coup, quelles pièces regrouper — une par valeur brute du fichier cochée "Regrouper".
    'GroupTag': (groupByValue && groupByValue[posteRaw]) ? posteRaw : '',
    'SousTraitance': (sousTraitanceByValue && sousTraitanceByValue[posteRaw]) ? '1' : ''
  };
}
function proceedFromPostes(){
  const cs = customImportState;
  // L'association n'est plus obligatoire : un poste laissé "— à associer —" fait simplement
  // ignorer les lignes correspondantes (buildImportGroups les rejette proprement, avec un message
  // explicite dans l'aperçu qui suit), plutôt que de bloquer tout l'import.
  const transformedRows = cs.rows.map(r => transformCustomRow(r, cs.map, cs.posteMapping, cs.groupByValue, cs.sousTraitanceByValue));
  const { groups, errors, duplicateLines } = buildImportGroups(
    transformedRows, 'Référence commande', 'Date de besoin (JJ/MM/AAAA)', 'Urgence', 'Poste',
    'Pièce', 'Étape', 'Temps unitaire (min)', 'Quantité', 'Phase', 'Opérateur', 'Matière', 'Épaisseur', 'GroupTag', 'SousTraitance'
  );
  const refs = Object.keys(groups);
  const nbNouvelles = refs.filter(r=>!groups[r].existing && groups[r].pieces.length>0).length;
  const nbFusions = refs.filter(r=>groups[r].existing && groups[r].pieces.length>0).length;
  const nbPieces = refs.reduce((s,r)=>s+groups[r].pieces.length, 0);
  cs.preview = { groups, errors, duplicateLines, nbNouvelles, nbFusions, nbPieces };
  cs.step = 'preview';
  render();
}

// Retrouve la commande et la pièce contenant un id de pièce donné — utilisé après coup pour
// fusionner les pièces regroupées par étiquette, une fois qu'elles existent réellement.
// Variantes "sur état cible" de findPieceLocation/performFusion — nécessaires pour que la fusion
// déclenchée par un import puisse être rejouée sur une version fraîche en cas de conflit, sans
// jamais enregistrer elle-même (l'appelant s'en charge une seule fois, pour tout l'import).
function findPieceLocationInState(targetState, pieceId){
  for(const c of targetState.commandes){
    const o = c.pieces.find(p=>p.id===pieceId);
    if(o) return { cid: c.id, oid: o.id };
  }
  return null;
}
function performFusionOnState(targetState, items){
  if(items.length < 2) return;
  const resolved = items.map(it => {
    const c = targetState.commandes.find(cc=>cc.id===it.cid);
    return c && c.pieces.find(oo=>oo.id===it.oid);
  }).filter(Boolean);
  if(resolved.length < 2) return;
  const groupId = uid('fusion');
  const totalDuree = resolved.reduce((s,o) => s + ((o.dureeOverrideH!=null && o.dureeOverrideH>0) ? o.dureeOverrideH : (o.tempsUnitaire*o.quantite)/60), 0);
  const schedule = computeSchedule(targetState);
  let commonStart = null;
  resolved.forEach(o => {
    schedule.forEach(c => {
      const p = c.pieces.find(pp=>pp.id===o.id);
      if(p && p.start && (!commonStart || p.start > commonStart)) commonStart = p.start;
    });
  });
  if(!commonStart){
    // Aucune des pièces du groupe n'a d'horaire calculé (elles sont encore bloquées par une phase
    // antérieure, par exemple). Retomber sur "maintenant" les figerait dans le passé, AVANT les
    // tâches dont elles dépendent — le bug qui faisait démarrer la chaudronnerie avant le laser.
    // On calcule donc un plancher sûr : la fin la plus tardive des pièces de phase inférieure de
    // leurs commandes, et la disponibilité de leur poste.
    const floors = [];
    resolved.forEach(o => {
      const m = targetState.machines.find(mm=>mm.id===o.machineId);
      if(m && m.dispo) floors.push(new Date(m.dispo));
      const cmdSched = schedule.find(c => c.pieces.some(pp=>pp.id===o.id));
      if(cmdSched){
        cmdSched.pieces.forEach(pp => {
          if((pp.phase||1) < (o.phase||1) && pp.end) floors.push(pp.end);
        });
      }
    });
    floors.push(new Date());
    // Arrondi à la minute SUPÉRIEURE : le figeage ne conserve pas les secondes, donc tronquer
    // ferait repasser le groupe quelques secondes avant son plancher.
    commonStart = new Date(Math.ceil(Math.max(...floors.map(d=>d.getTime())) / 60000) * 60000);
  }
  resolved.forEach(o => {
    o.fusionGroupId = groupId;
    o.manualStart = toInputValue(commonStart);
    o.dureeOverrideH = totalDuree;
  });
}
function findPieceLocation(pieceId){
  for(const c of state.commandes){
    const o = c.pieces.find(p=>p.id===pieceId);
    if(o) return { cid: c.id, oid: o.id, dureeH: (o.dureeOverrideH!=null && o.dureeOverrideH>0) ? o.dureeOverrideH : (o.tempsUnitaire*o.quantite)/60 };
  }
  return null;
}
function confirmCustomImport(){
  const cs = customImportState;
  if(!cs || !cs.preview) return;
  const nom = (cs.profileName||'').trim() || `Profil du ${formatDateFr(toDateInputValue(new Date()))}`;
  const profileId = cs.profileId || uid('importprofil'); // fixé une fois pour toutes, pour rester stable même rejoué plusieurs fois
  // Tout ce qui suit (commande(s), fusions par étiquette, profil) est rassemblé dans UNE SEULE
  // fonction rejouable : en cas de conflit d'enregistrement, elle est reproduite telle quelle sur
  // la version fraîche du serveur, sans jamais perdre ni la commande ni le profil — au lieu de
  // plusieurs sauvegardes séparées, dont une seule pouvait échouer silencieusement auparavant.
  const applyFn = (targetState) => {
    const result = commitImportGroups(targetState, cs.preview.groups);
    // Regroupement manuel (case "Regrouper") : toutes les pièces partageant la même valeur du
    // fichier sont regroupées ensemble, sans condition de phase — une pièce dont la phase la plus
    // basse (ex. "Conception") n'est de toute façon pas suivie dans l'appli n'a pas besoin d'être
    // isolée des autres. Les groupes de phase la plus basse sont traités en premier, pour qu'un
    // groupe de phase ultérieure voie toujours la position déjà à jour d'un groupe antérieur.
    const taggedBuckets = {};
    Object.values(cs.preview.groups).forEach(g => {
      g.pieces.forEach(pc => {
        if(pc._importGroupTag){
          if(!taggedBuckets[pc._importGroupTag]) taggedBuckets[pc._importGroupTag] = { minPhase: pc.phase||1, ids: [] };
          taggedBuckets[pc._importGroupTag].ids.push(pc.id);
          if((pc.phase||1) < taggedBuckets[pc._importGroupTag].minPhase) taggedBuckets[pc._importGroupTag].minPhase = pc.phase||1;
        }
      });
    });
    Object.values(taggedBuckets).sort((a,b)=>a.minPhase-b.minPhase).forEach(bucket => {
      if(bucket.ids.length < 2) return;
      const items = bucket.ids.map(id => findPieceLocationInState(targetState, id)).filter(Boolean);
      if(items.length >= 2) performFusionOnState(targetState, items);
    });
    // Étiquette temporaire jamais conservée dans les données réelles — nettoyée ici, sur les pièces
    // effectivement enregistrées dans targetState (des copies distinctes de cs.preview.groups, donc
    // à nettoyer séparément), pour que ce soit correct même en cas de rejeu après un conflit.
    Object.values(cs.preview.groups).forEach(g => {
      g.pieces.forEach(pc => {
        const loc = findPieceLocationInState(targetState, pc.id);
        const realPiece = loc && targetState.commandes.find(c=>c.id===loc.cid).pieces.find(o=>o.id===loc.oid);
        if(realPiece) delete realPiece._importGroupTag;
      });
    });
    // Profil de correspondance, enregistré sur ce même état — survit donc lui aussi à un rejeu.
    if(!targetState.importProfiles) targetState.importProfiles = [];
    const profileData = { map: { ...cs.map }, posteMapping: { ...cs.posteMapping }, groupByValue: { ...cs.groupByValue }, sousTraitanceByValue: { ...cs.sousTraitanceByValue } };
    const existingProfile = targetState.importProfiles.find(p=>p.id===profileId);
    if(existingProfile){ existingProfile.nom = nom; Object.assign(existingProfile, profileData); }
    else { targetState.importProfiles.push({ id: profileId, nom, ...profileData }); }
    return result;
  };
  const { createdNoms, updatedNoms, sansEcheance } = applyFn(state);
  excelImportResult = {
    imported: createdNoms.length, updated: updatedNoms.length,
    pieces: createdNoms.reduce((s,c)=>s+c.nbPieces,0) + updatedNoms.reduce((s,c)=>s+c.nbAjoutees,0),
    sansEcheance, errors: cs.preview.errors, duplicateLines: cs.preview.duplicateLines,
    refs: createdNoms, updatedRefs: updatedNoms
  };
  customImportState = null;
  render();
  saveStateWithReapply(applyFn, 3);
}

function isCurrentlyWorking(cfg){
  const now = new Date(); const dow = now.getDay();
  if(dow===0||dow===6) return false;
  const dh = dayHoursFor(dow,cfg); const dStart = dayStartFor(now,cfg);
  const dEnd = new Date(dStart.getTime()+dh*3600000);
  return now >= dStart && now <= dEnd;
}

function renderCalendrierAnnuelTab(){
  const year = calendrierYear;
  const todayKey = toDateInputValue(new Date());

  // Filtre statut : quelles demandes doivent apparaître dans la grille.
  const statutsVoulus = calendrierStatutFilter==='toutes' ? ['approuve','en_attente','refuse']
    : calendrierStatutFilter==='approuve' ? ['approuve']
    : calendrierStatutFilter==='en_attente' ? ['en_attente']
    : ['approuve','en_attente'];

  // Index par jour (AAAA-MM-JJ) -> liste de { username, typeNom, couleur, statut }, une seule fois pour toute l'année.
  const byDate = {};
  state.leaveRequests.forEach(r => {
    if(!statutsVoulus.includes(r.statut)) return;
    if(calendrierPersonneFilter && r.userId !== calendrierPersonneFilter) return;
    if(!r.debut || !r.fin) return;
    const u = usersList.find(uu=>String(uu.id)===r.userId);
    const t = leaveTypeById(r.typeId);
    let d = new Date(Math.max(new Date(r.debut+'T00:00:00'), new Date(year,0,1)));
    const end = new Date(Math.min(new Date(r.fin+'T00:00:00'), new Date(year,11,31)));
    let guard = 0;
    while(d <= end && guard++ < 400){
      const key = toDateInputValue(d);
      (byDate[key] = byDate[key] || []).push({ username: u?u.username:'?', typeNom: t?t.nom:'Congé', couleur: t?t.couleur:'#888', statut: r.statut });
      d.setDate(d.getDate()+1);
    }
  });

  const monthsHtml = Array.from({length:12}, (_,mi) => {
    const first = new Date(year, mi, 1);
    const gridStart = startOfWeek(first);
    const cells = []; for(let i=0;i<42;i++){ const d=new Date(gridStart); d.setDate(d.getDate()+i); cells.push(d); }
    // Une grille de 5 semaines suffit presque toujours ; on ne montre la 6e que si le mois en a réellement besoin.
    const need6 = cells[34].getMonth()===mi;
    const shownCells = need6 ? cells : cells.slice(0,35);
    const hd = ['L','M','M','J','V','S','D'].map(w=>`<div class="calmonth-weekday-hd">${w}</div>`).join('');
    const dayCells = shownCells.map(d => {
      const key = toDateInputValue(d);
      const inMonth = d.getMonth()===mi;
      const isToday = key===todayKey;
      const entries = byDate[key] || [];
      const dotsHtml = entries.slice(0,4).map(en =>
        `<span class="calmonth-dot ${en.statut==='en_attente'?'pending':''}" style="${en.statut==='en_attente'?`border-color:${en.couleur};`:`background:${en.couleur};`}"></span>`
      ).join('');
      const titleAttr = entries.length ? entries.map(en => `${en.username} — ${en.typeNom}${en.statut==='en_attente'?' (en attente)':''}`).join('\n') : '';
      return `<div class="calmonth-daycell ${inMonth?'':'other-month'} ${isToday?'today':''}" ${titleAttr?`title="${escapeHtml(titleAttr)}"`:''}>
        <div class="calmonth-daynum">${d.getDate()}</div>
        <div class="calmonth-dots">${dotsHtml}</div>
      </div>`;
    }).join('');
    const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    return `<div class="calmonth-block">
      <div class="calmonth-title">${monthNames[mi]}</div>
      <div class="calmonth-grid">${hd}${dayCells}</div>
    </div>`;
  }).join('');

  const legend = state.leaveTypes.map(t => `<span class="calyear-legend-item"><span class="machine-swatch" style="background:${t.couleur}"></span>${escapeHtml(t.nom)}</span>`).join('')
    + `<span class="calyear-legend-item"><span class="calmonth-dot pending" style="border-color:var(--text-faint);"></span>En attente</span>`;

  return `<section class="panel"><div class="panel-body">
    <div class="search-bar">
      <button class="small" data-action="calyear-nav" data-dir="-1">‹</button>
      <strong style="min-width:50px; text-align:center;">${year}</strong>
      <button class="small" data-action="calyear-nav" data-dir="1">›</button>
      <button class="small" data-action="calyear-today">Année en cours</button>
      <label class="field" style="margin:0 0 0 12px;">Personne</label>
      <select data-action="calyear-personne-filter" style="width:auto;">
        <option value="">Toutes</option>
        ${usersList.map(u=>`<option value="${u.id}" ${calendrierPersonneFilter===String(u.id)?'selected':''}>${escapeHtml(u.username)}</option>`).join('')}
      </select>
      <label class="field" style="margin:0 0 0 12px;">Statut</label>
      <select data-action="calyear-statut-filter" style="width:auto;">
        <option value="approuve_attente" ${calendrierStatutFilter==='approuve_attente'?'selected':''}>Approuvés + en attente</option>
        <option value="approuve" ${calendrierStatutFilter==='approuve'?'selected':''}>Approuvés uniquement</option>
        <option value="en_attente" ${calendrierStatutFilter==='en_attente'?'selected':''}>En attente uniquement</option>
        <option value="toutes" ${calendrierStatutFilter==='toutes'?'selected':''}>Toutes (avec refusées)</option>
      </select>
    </div>
    <div class="footer-note" style="text-align:left; padding:6px 0 12px; display:flex; gap:14px; flex-wrap:wrap;">${legend}</div>
    <div class="calyear-months-wrap">${monthsHtml}</div>
    <div class="footer-note" style="text-align:left; padding-top:10px;">Un pastille pleine = congé approuvé. Une pastille au contour = demande encore en attente. Survolez un jour pour voir le détail.</div>
  </div></section>`;
}
function renderImpactSummaryHtml(affected){
  if(affected.length === 0){
    return `<div class="footer-note" style="text-align:left; padding:8px 0;">✓ Aucune tâche ne serait décalée si ce congé est approuvé.</div>`;
  }
  const nbEnRetard = affected.filter(a=>a.enRetard).length;
  const rows = affected.map(a => {
    const m = state.machines.find(mm=>mm.id===a.machineId);
    const dateClass = a.enRetard ? 'impact-date-red' : (a.livraisonInchangee ? 'impact-date-green' : 'impact-date-orange');
    return `<tr>
      <td>${escapeHtml(a.commandeNom)}</td>
      <td>${escapeHtml([a.piece,a.etape].filter(Boolean).join(' / ')||'—')}</td>
      <td>${m?escapeHtml(m.nom):'—'}</td>
      <td>${a.dateBesoin ? formatDateFr(a.dateBesoin) : '—'}</td>
      <td>${formatDT(a.oldEnd)}</td>
      <td class="${dateClass}">${formatDT(a.newEnd)}${a.enRetard ? ' ⚠' : ''}</td>
    </tr>`;
  }).join('');
  return `
    <div class="modal-section-title" style="margin-top:0; color:var(--amber);">⚠ ${affected.length} tâche(s) seraient décalée(s) si ce congé est approuvé${nbEnRetard ? ` — dont ${nbEnRetard} avec risque de retard sur la livraison` : ''}</div>
    <div class="footer-note" style="text-align:left; margin-bottom:8px;">Colonnes "Fin avant/après" : c'est la fin réelle de la tâche qui détermine l'impact, pas son début — une tâche déjà démarrée garde son début figé même si sa fin se décale. &nbsp; <span class="impact-date-green">■</span> tâche décalée, mais livraison de la commande inchangée &nbsp; <span class="impact-date-orange">■</span> décalée, livraison toujours dans les temps &nbsp; <span class="impact-date-red">■</span> décalée, livraison probablement en retard</div>
    <table class="ops-table">
      <thead><tr><th>Commande</th><th>Pièce / Étape</th><th>Poste</th><th>Livraison prévue</th><th>Fin avant</th><th>Fin après</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderContextMenu(){
  if(!contextMenu) return '';
  const c = state.commandes.find(c=>c.id===contextMenu.cid);
  const o = c && c.pieces.find(o=>o.id===contextMenu.oid);
  if(!o) return '';
  const items = [];
  if(o.statut==='a_faire'){
    items.push({action:'ctx-start', label:'▶ Démarrer'});
    const overridden = !!(o.manualStart || o.dureeOverrideH);
    items.push(overridden
      ? {action:'ctx-unpin', label:'↺ Libérer (rendre volante)'}
      : {action:'ctx-pin', label:'📌 Figer à cet horaire'});
    if(isTempsModified(o)) items.push({action:'reset-temps-unitaire', label:'⏱ Revenir au temps théorique'});
  }
  if(o.statut==='en_cours'){
    items.push({action:'ctx-pause', label:'⏸ Mettre en pause'});
    items.push({action:'ctx-finish', label:'✔ Terminer'});
  }
  if(o.statut==='en_pause'){
    items.push({action:'ctx-resume', label:'▶ Reprendre'});
    items.push({action:'ctx-finish', label:'✔ Terminer'});
  }
  if(o.statut==='termine') items.push({action:'ctx-reopen', label:'↺ Rouvrir (À faire)'});
  const label = [c.nom, o.piece, o.etape].filter(Boolean).join(' · ');
  const left = Math.min(contextMenu.x, window.innerWidth - 220);
  const top = Math.min(contextMenu.y, window.innerHeight - (items.length*38+50));
  const menuItems = items.map(it=>`<button class="context-menu-item" data-action="${it.action}" data-cid="${contextMenu.cid}" data-oid="${contextMenu.oid}">${it.label}</button>`).join('');
  return `<div class="context-menu" style="left:${left}px; top:${top}px;">
    <div class="context-menu-title">${escapeHtml(label)}</div>
    ${menuItems}
  </div>`;
}

function rangeLabel(){
  if(currentView==='jour') return viewAnchor.toLocaleDateString('fr-FR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  if(currentView==='semaine'){
    const ws = startOfWeek(viewAnchor); const we = new Date(ws); we.setDate(we.getDate()+4);
    return `${ws.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})} – ${we.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})}`;
  }
  if(currentView==='mois') return viewAnchor.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  return String(viewAnchor.getFullYear());
}

function renderPlanningToolbar(){
  const labels={jour:'Jour',semaine:'Semaine',mois:'Mois',annee:'Année',kanban:'Kanban',liste:'Liste'};
  const tabs = ['jour','semaine','mois','annee','kanban','liste'].map(v=>`<button class="${currentView===v?'active':''}" data-action="set-view" data-view="${v}">${labels[v]}</button>`).join('');
  const dated = currentView!=='kanban' && currentView!=='liste';
  return `<div class="planning-toolbar">

    ${dated ? `<div class="view-nav">

      <button class="small" data-action="nav-today">Aujourd'hui</button>
    </div>` : ''}

}

function combinedDayWindow(date, st){
  let minStart = null, maxEnd = null;
  st.machines.forEach(m => {
    const cfg = effectiveConfig(m, st);
    const win = dayWindow(date, cfg);
    if(!minStart || win.start < minStart) minStart = win.start;
    if(!maxEnd || win.end > maxEnd) maxEnd = win.end;
  });
  if(!minStart){ const win = dayWindow(date, st.config); minStart = win.start; maxEnd = win.end; }
  return { start: minStart, end: maxEnd };
}
function absencesForRange(days){
  if(!(state.config.modules && state.config.modules.conges) || !days.length) return [];
  const rangeStart = toDateInputValue(days[0]);
  const rangeEnd = toDateInputValue(days[days.length-1]);
  return state.leaveRequests
    .filter(r => r.statut==='approuve' && r.debut<=rangeEnd && r.fin>=rangeStart)
    .map(r => {
      const u = usersList.find(uu=>String(uu.id)===r.userId);
      return { username: u?u.username:'(compte supprimé)', debut:r.debut, fin:r.fin };
    })
    .sort((a,b)=>a.username.localeCompare(b.username));
}
function absenceBannerHtml(days){
  const list = absencesForRange(days);
  if(!list.length) return '';
  const items = list.map(a => `<span class="absence-chip">🏖 ${escapeHtml(a.username)} <span class="footer-note" style="margin:0;">(${formatDateFr(a.debut)} → ${formatDateFr(a.fin)})</span></span>`).join('');
  return `<div class="absence-banner">${items}</div>`;
}
// Pour l'affichage du Gantt uniquement : regroupe les pièces d'un même groupe fusionné (qui
// partagent toujours exactement le même horaire) en une seule entrée "porteuse", pour n'afficher
// qu'une seule barre au lieu de plusieurs superposées. Ne modifie rien aux données réelles.
function mergeFusedOpsForDisplay(ops){
  const seen = new Set();
  const result = [];
  ops.forEach(o => {
    if(o.fusionGroupId){
      if(seen.has(o.fusionGroupId)) return;
      seen.add(o.fusionGroupId);
      const members = ops.filter(oo => oo.fusionGroupId === o.fusionGroupId);
      result.push(members.length > 1 ? { ...o, _fusionMembers: members } : o);
    } else {
      result.push(o);
    }
  });
  return result;
}
// Construit le libellé et l'infobulle d'une barre, en tenant compte d'un éventuel regroupement fusionné.
function fusedBarLabelAndTooltip(o, baseLabel, meta){
  if(!o._fusionMembers) return { label: baseLabel, tooltipExtra: '' };
  // Si toutes les pièces fusionnées appartiennent à la même commande (cas fréquent : plusieurs
  // sous-pièces d'une seule affaire), son numéro est bien plus utile qu'une matière/épaisseur
  // souvent absente (import sans cette info) — sinon, on indique le nombre de commandes distinctes.
  const distinctCmd = Array.from(new Set(o._fusionMembers.map(m=>m.commandeNom)));
  const refLabel = distinctCmd.length === 1 ? distinctCmd[0] : `${distinctCmd.length} commandes`;
  const matEp = (o.matiere || o.epaisseur) ? ` — ${o.matiere||'?'}/${o.epaisseur||'?'}` : '';
  const label = `${refLabel} · 🔗 ${o._fusionMembers.length} pièces fusionnées${matEp}`;
  // Pas de liste des pièces dans l'infobulle : elle devenait illisible sur un gros groupe, et le
  // détail complet est déjà accessible d'un clic sur la barre (pop-up de regroupement).
  // Le libellé est échappé à l'affichage : pas de balises HTML ici, elles s'afficheraient telles quelles.
  return { label, tooltipExtra: ` — cliquez sur la barre pour voir le détail du regroupement` };
}
function renderDayView(schedule){
  const now = new Date();
  const day = new Date(viewAnchor.getFullYear(), viewAnchor.getMonth(), viewAnchor.getDate());
  const dow = day.getDay();
  if(dow===0 || dow===6){
    return `<div class="gantt-empty">${day.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'})} — jour non travaillé.</div>`;
  }
  weekRenderCtx = { days: [day] };
  const win = combinedDayWindow(day, state);
  const dStart = win.start, dEnd = win.end;
  const spanMs = dEnd.getTime() - dStart.getTime();

  function pos(d){ // renvoie une fraction 0..1 de la largeur totale disponible
    let frac = spanMs>0 ? (d-dStart)/spanMs : 0;
    return Math.max(0, Math.min(1, frac));
  }

  const ticks = [];
  let t = new Date(dStart);
  while(t < dEnd){ ticks.push(new Date(t)); t = new Date(t.getTime()+3600000); }
  ticks.push(new Date(dEnd));
  const scale = ticks.slice(0,-1).map((tk,i)=>{
    const widthPct = Math.max((pos(ticks[i+1]) - pos(tk))*100, 0.5);
    return `<div class="gantt-day" style="width:${widthPct}%">${pad(tk.getHours())}:${pad(tk.getMinutes())}</div>`;
  }).join('');

  let allOps = [];
  schedule.forEach(c => c.pieces.forEach(o => { if(o.start && o.end) allOps.push({...o, commandeNom:c.nom, cid:c.id, urgence:c.urgence||'normale', dateBesoin:c.dateBesoin}); }));
  const dayEndExclusive = nextDayStart(day);
  const visibleOps = allOps.filter(o => o.end > day && o.start < dayEndExclusive);

  const rows = state.machines.map((m,mi) => {
    const machineCfg = effectiveConfig(m, state);
    const ops = mergeFusedOpsForDisplay(visibleOps.filter(o=>o.machineId===m.id).sort((a,b)=>a.start-b.start));
    const bars = ops.map(o => {
      let leftPct = pos(o.start)*100;
      let rightPct = pos(o.end)*100;
      const widthPct = Math.max(rightPct-leftPct, 0.4);
      const overridden = !!(o.manualStart || o.dureeOverrideH);
      const meta = barStatusMeta(o, machineColor(m, mi), overridden);
      const baseLabel = meta.prefix + [o.commandeNom, o.piece, o.etape].filter(Boolean).join(' · ');
      const { label, tooltipExtra } = fusedBarLabelAndTooltip(o, baseLabel, meta);
      const hlOn = highlightActive();
      const hl = isHighlighted(o.cid, o.commandeNom, o.piece);
      const hlCls = hlOn ? (hl ? 'spotlight' : 'dimmed') : '';
      const tempsModCls = isTempsModified(o) ? 'time-modified' : '';
      return `<div class="gantt-bar ${meta.cls} ${hlCls} ${tempsModCls} ${o._fusionMembers?'fusion-bar':''} ${leftPct > 55 ? 'tooltip-right' : ''}" style="left:${leftPct}%;width:${widthPct}%;background:${meta.color};border-left:4px solid ${meta.urgBorder}"
        data-cid="${o.cid}" data-oid="${o.id}" data-start="${o.start.toISOString()}">
        <div class="gantt-bar-inner"><span>${escapeHtml(label)}</span></div>
        ${ganttBarTooltipHtml(o, label + meta.note + (isTempsModified(o) ? ' — ⏱ temps modifié manuellement' : '') + tooltipExtra)}
        <div class="resize-handle" data-cid="${o.cid}" data-oid="${o.id}"></div>
      </div>`;

function renderWeekView(schedule){
  const now = new Date();
  const ws = startOfWeek(viewAnchor);
  const days = [0,1,2,3,4].map(i=>{ const d=new Date(ws); d.setDate(d.getDate()+i); return d; });
  weekRenderCtx = { days };
  const dayIndex = {}; days.forEach((d,i)=> dayIndex[toDateInputValue(d)] = i);

  function pos(d){ // renvoie une fraction 0..1 de la largeur totale disponible
    const key = toDateInputValue(d);
    const idx = dayIndex[key];
    if(idx===undefined) return d < days[0] ? 0 : 1;
    const win = combinedDayWindow(d, state);
    const spanMs = win.end.getTime() - win.start.getTime();
    let frac = spanMs>0 ? (d - win.start) / spanMs : 0;
    frac = Math.max(0, Math.min(1, frac));
    return (idx+frac) / days.length;
  }

  const scale = days.map(d=>{
    const isToday = toDateInputValue(d)===toDateInputValue(now);
    return `<div class="gantt-day ${isToday?'today':''}" style="width:${100/days.length}%">${d.toLocaleDateString('fr-FR',{weekday:'long'})}<br><span class="mono" style="font-size:10px;">${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</span></div>`;
  }).join('');

  let allOps = [];
  schedule.forEach(c => c.pieces.forEach(o => { if(o.start && o.end) allOps.push({...o, commandeNom:c.nom, cid:c.id, urgence:c.urgence||'normale', dateBesoin:c.dateBesoin}); }));
  const weekEndExclusive = new Date(days[4]); weekEndExclusive.setDate(weekEndExclusive.getDate()+1);
  const visibleOps = allOps.filter(o => o.end > days[0] && o.start < weekEndExclusive);

  const rows = state.machines.map((m,mi) => {
    const machineCfg = effectiveConfig(m, state);
    const ops = mergeFusedOpsForDisplay(visibleOps.filter(o=>o.machineId===m.id).sort((a,b)=>a.start-b.start));
    const bars = ops.map(o => {
      let leftPct = pos(o.start)*100;
      let rightPct = pos(o.end)*100;
      const widthPct = Math.max(rightPct-leftPct, 0.3);
      const overridden = !!(o.manualStart || o.dureeOverrideH);
      const meta = barStatusMeta(o, machineColor(m, mi), overridden);
      const baseLabel = meta.prefix + [o.commandeNom, o.piece, o.etape].filter(Boolean).join(' · ');
      const { label, tooltipExtra } = fusedBarLabelAndTooltip(o, baseLabel, meta);
      const hlOn = highlightActive();
      const hl = isHighlighted(o.cid, o.commandeNom, o.piece);
      const hlCls = hlOn ? (hl ? 'spotlight' : 'dimmed') : '';
      const tempsModCls = isTempsModified(o) ? 'time-modified' : '';
      return `<div class="gantt-bar ${meta.cls} ${hlCls} ${tempsModCls} ${o._fusionMembers?'fusion-bar':''} ${leftPct > 55 ? 'tooltip-right' : ''}" style="left:${leftPct}%;width:${widthPct}%;background:${meta.color};border-left:4px solid ${meta.urgBorder}"
        data-cid="${o.cid}" data-oid="${o.id}" data-start="${o.start.toISOString()}">
        <div class="gantt-bar-inner"><span>${escapeHtml(label)}</span></div>
        ${ganttBarTooltipHtml(o, label + meta.note + (isTempsModified(o) ? ' — ⏱ temps modifié manuellement' : '') + tooltipExtra)}
        <div class="resize-handle" data-cid="${o.cid}" data-oid="${o.id}"></div>
      </div>`;
    }).join('');
    const showTodayLine = now>=days[0] && now<weekEndExclusive;
    const todayLeftPct = pos(nextWorkingInstant(now,machineCfg))*100;
    return `<div class="gantt-row" data-machine-id="${m.id}">
      <div class="gantt-row-label"><span class="machine-swatch" style="background:${machineColor(m,mi)}"></span>${escapeHtml(m.nom)}</div>
      <div class="gantt-track">${bars}${lunchBandsHtml(days, pos, machineCfg)}${indispoBandsHtml(days, pos, machineCfg)}${showTodayLine?`<div class="gantt-today-line" style="left:${todayLeftPct}%"></div>`:''}</div>
    </div>`;
  }).join('');

  return `<div class="gantt-wrap">
    <div class="edge-glow left" title="Glissez ici pour passer à la semaine précédente"></div>
    <div class="edge-glow right" title="Glissez ici pour passer à la semaine suivante"></div>
    <div style="display:flex;">
      <div style="width:150px;flex:0 0 150px;"></div>
      <div class="gantt-scale">${scale}</div>
    </div>
    <div class="gantt-rows">${rows}</div>
  </div>
  ${absenceBannerHtml(days)}
  <div class="footer-note" style="text-align:left; padding:8px 16px 0;">Cliquez sur une tâche (sans glisser) pour isoler sa commande. Glissez une tâche pour changer sa date et/ou son poste (déposez-la sur une autre ligne), tirez son bord droit pour ajuster sa durée, double-cliquez pour revenir au calcul automatique. Maintenez près du bord gauche/droit pour passer à la semaine précédente/suivante sans lâcher la tâche, puis déposez-la où vous voulez.</div>`;
}

    const key = toDateInputValue(o.start);
    (byDay[key]=byDay[key]||[]).push({...o, commandeNom:c.nom, cid:c.id, urgence:c.urgence||'normale', dateBesoin:c.dateBesoin});
  }));

  const dayCells = cells.map(d=>{

      const tempsModPrefixM = isTempsModified(o) ? '⏱ ' : '';

      const timeStr = pad(o.start.getHours())+':'+pad(o.start.getMinutes());
      const hlOnM = highlightActive();

      return `<div class="month-chip ${meta.cls} ${hlClsM}" draggable="${meta.draggable?'true':'false'}" data-cid="${o.cid}" data-oid="${o.id}" data-time="${timeStr}" style="background:${meta.color};border-left:4px solid ${meta.urgBorder}" title="${escapeHtml(label)} — ${formatDT(o.start)}${o.dateBesoin?` — Échéance : ${escapeHtml(new Date(o.dateBesoin+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}))}`:''}${isTempsModified(o)?' — temps modifié manuellement':''}">${escapeHtml(label||'(sans nom)')}</div>`;

    const more = ops.length>4 ? `<div style="font-size:10px;color:var(--text-faint);">+${ops.length-4} autres</div>` : '';
    const indispoTag = allMachinesBlocked ? `<div class="month-indispo-tag" title="Tous les postes sont indisponibles ce jour">🔒 Indispo.</div>` : '';
    return `<div class="month-daycell ${inMonth?'':'other-month'} ${isWeekend?'weekend':''} ${isToday?'today':''} ${allMachinesBlocked?'all-indispo':''}" data-date="${key}">
      <div class="daynum">${d.getDate()}</div>${indispoTag}${chips}${more}
    </div>`;

  return `<div class="month-grid">${hd}${dayCells}</div>
  <div class="footer-note" style="text-align:left; padding:10px 4px 0;">Glissez-déposez une étiquette sur un autre jour pour la replanifier (l'heure de départ est conservée). Double-clic pour revenir au calcul automatique.</div>`;

function renderYearView(schedule){
  const now = new Date();
  const counts = {};
  schedule.forEach(c=>c.pieces.forEach(o=>{
    if(!o.start || !o.end) return;
    let cur = new Date(o.start.getFullYear(), o.start.getMonth(), o.start.getDate());
    const endDay = new Date(o.end.getFullYear(), o.end.getMonth(), o.end.getDate());
    let guard=0;
    while(cur<=endDay && guard++<400){ const k=toDateInputValue(cur); counts[k]=(counts[k]||0)+1; cur=nextDayStart(cur); }
  }));
  const maxCount = Math.max(1, ...Object.values(counts));
  const months = [];
  for(let m=0;m<12;m++){
    const first = new Date(viewAnchor.getFullYear(), m, 1);
    const gridStart = startOfWeek(first);
    const cells = []; for(let i=0;i<42;i++){ const d=new Date(gridStart); d.setDate(d.getDate()+i); cells.push(d); }
    const dayDivs = cells.map(d=>{
      const inMonth = d.getMonth()===m;
      const key = toDateInputValue(d);
      const c = counts[key]||0;
      const alpha = c===0 ? 0 : Math.min(1, 0.22+0.78*(c/maxCount));
      const isToday = key===toDateInputValue(now);
      const bg = c>0 ? `rgba(217,83,30,${alpha})` : 'var(--panel-2)';
      return `<div class="year-day" style="background:${inMonth?bg:'transparent'}; ${isToday?'outline:1px solid var(--text);':''}" title="${d.toLocaleDateString('fr-FR')} — ${c} opération(s)"></div>`;
    }).join('');
    months.push(`<div class="year-month"><h4>${first.toLocaleDateString('fr-FR',{month:'long'})}</h4><div class="year-days">${dayDivs}</div></div>`);
  }
  return `<div class="panel-body"><div class="year-grid">${months.join('')}</div></div>
  <div class="year-legend"><span class="sw" style="background:var(--panel-2)"></span>Aucune charge<span class="sw" style="background:rgba(217,83,30,0.5); margin-left:10px;"></span>Charge modérée<span class="sw" style="background:rgba(217,83,30,1); margin-left:10px;"></span>Charge élevée &nbsp;·&nbsp; vue d'ensemble, non ajustable à la souris</div>`;
}
