version: "3.8"
services:
  planning-atelier:
    build: .
    container_name: planning-atelier
    ports:
      - "3000:3000"
    volumes:
      - planning-data:/data
      - ./Cfg_backup.yml:/app/Cfg_backup.yml
      - ./Cfg_admin.yml:/app/Cfg_admin.yml
    environment:
      # Fuseau horaire du conteneur — server.js le fixe déjà en dur ('Europe/Paris', voir son tout
      # début) pour ne jamais en dépendre, mais le préciser aussi ici documente l'intention et couvre
      # tout ce qui, dans le conteneur, ne passerait pas par ce code (ex. horodatages de logs Docker).
      TZ: "Europe/Paris"
      # Secret utilisé pour signer les cookies de session — OBLIGATOIRE pour un accès exposé
      # sur internet. Générez une valeur aléatoire une fois (ex: openssl rand -hex 32) et
      # gardez-la ensuite fixe : si elle change, tout le monde est déconnecté.
      SESSION_SECRET: ""
      # Passez à "true" une fois l'accès servi en HTTPS (obligatoire avant toute exposition
      # sur internet — voir le README, section Sécurité). Laissez "false" tant que vous
      # n'accédez qu'en HTTP sur le réseau local, sinon la connexion ne fonctionnera pas.
      COOKIE_SECURE: "false"
      # Optionnel : clé de licence installée automatiquement au tout premier démarrage
      # (ex: une clé d'essai de 15 jours pour un nouveau client). Générée hors ligne avec
      # tools/generate-license.js et collée ici. Sans effet si une licence est déjà
      # enregistrée en base — un redémarrage du conteneur n'écrase jamais une licence
      # déjà installée (essai prolongé, licence définitive achetée entre-temps).
      INITIAL_LICENSE_KEY: ""
      # Lecture automatique de la pointeuse (service zk-sync ci-dessous) : clé partagée entre Planning
      # et ce service, à définir dans le fichier `.env` (jamais dans ce fichier versionné).
      # Générez-la une fois : openssl rand -hex 24   puis   DEVICE_SYNC_KEY=<valeur>   dans .env
      # Vide ou de moins de 16 caractères : la route d'envoi reste désactivée.
      DEVICE_SYNC_KEY: "${DEVICE_SYNC_KEY:-}"
      # Pointeuse TimeMoto TM-616 (Paramètres → Pointage présentiel) : aucun identifiant à configurer
      # ici. L'import se fait à la main avec un jeton que l'utilisateur récupère lui-même dans sa
      # session TimeMoto (la page de connexion TimeMoto est protégée par un reCAPTCHA, franchi par un
      # humain). Le jeton n'est jamais stocké côté serveur.
    restart: unless-stopped

  # Lecture automatique de la pointeuse TimeMoto TM-616 en réseau local (protocole ZK, lecture seule).
  # Inactif tant que ZK_IP et DEVICE_SYNC_KEY ne sont pas dans `.env` (il attend sans rien faire).
  # Voir CLAUDE.md « Lecture automatique de la pointeuse ».
  zk-sync:
    build:
      context: ./tools
      dockerfile: Dockerfile.zk-sync
    container_name: planning-zk-sync
    environment:
      TZ: "Europe/Paris"
      ZK_IP: "${ZK_IP:-}"
      ZK_PORT: "${ZK_PORT:-4370}"
      ZK_COMMKEY: "${ZK_COMMKEY:-0}"
      PLANNING_URL: "http://planning-atelier:3000"
      DEVICE_SYNC_KEY: "${DEVICE_SYNC_KEY:-}"
      SYNC_INTERVAL: "${SYNC_INTERVAL:-300}"
      SYNC_DAYS: "${SYNC_DAYS:-3}"
    depends_on:
      - planning-atelier
    restart: unless-stopped

volumes:
  planning-data:
